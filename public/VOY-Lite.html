<!--
VOY V4.1 — Ambient map wallpaper + bottom decision sheet
Build: 2026-06-22 V4.1 (P1–P7 patches)
Architecture: hybrid_command_layer (ambient map + decision sheet)
Engine: core/mobilityEngine.js (UNTOUCHED — pure functions)
Controller: ui/mobilityController.js (P5/P6 — rankBusLines, getBusLineGeometry added)
Patches applied:
  P1/F1/F4: destination search pipeline — overflow:hidden removed, local-first, 250ms debounce
  P2/F2:    CTA visible — sheet-wrap scrollable, blur on select, scrollIntoView, hit area
  P3/F3:    map NOT shadowed — opacity 0.9, no blur, light top+bottom scrim only
  P4/F4:    mobile dest input — suggestions on each input event, Enter fallback geocode
  P5:       bus mini-block — all plausible lines ranked by score
  P6:       bus route overlay + clearly estimated state
  P7:       map visible as context, never obscures decision surface
-->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>VOY – Movilidad Santa Fe</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="core/mobilityEngine.js?v=5"></script>
<script src="ui/mobilityController.js?v=5"></script>
<style>
/* ============================================================
   VOY V4 — AMBIENT_MAP_DECISION_SHEET
   - Map: fixed full-bleed ambient background (opacity 0.35, blur 3px, pe:none)
   - Header: solid bg (no backdrop-filter), 17px wordmark
   - Inputs: single compact card
   - Decision: single bottom sheet, price is largest element (32px)
   - Bus/bike: inline one-liner inside sheet
   - Footer/toast: solid bg, no blur
   ============================================================ */
:root{
  /* COLOR SYSTEM */
  --bg:#F5F5F7;
  --surface:#FFFFFF;
  --bg3:#E5E5EA;
  --text:#111111;
  --text2:#6E6E73;
  --text3:#8E8E93;
  --primary:#007AFF;
  --success:#34C759;
  --red:#FF3B30;
  --orange:#FF9500;
  --border-subtle:rgba(0,0,0,0.06);
  /* SPACING SYSTEM (grid=8) */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:32px;
  --sheet-padding:20px;
  --section-gap:8px;
  /* RADIUS SYSTEM */
  --radius-card:20px;--radius-button:16px;--radius-input:14px;
  --radius-sm:10px;--radius-xs:8px;
  /* TYPE SYSTEM — price is largest (decision inversion) */
  --font-decision:32px;   /* PRICE — largest element on screen */
  --font-title:17px;      /* VOY wordmark + sheet hero provider name */
  --font-headline:17px;   /* section labels */
  --font-body:15px;       /* inputs, subtitles, alternatives */
  --font-caption:13px;    /* ETA pills, metadata */
  --font-micro:11px;      /* button labels uppercase */
  --font-weight-decision:800;
  --font-weight-title:700;
  --font-weight-headline:700;
  --font-weight-body:500;
  /* SHADOWS */
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04),0 1px 3px rgba(0,0,0,0.06);
  --shadow-md:0 4px 16px rgba(0,0,0,0.06),0 1px 4px rgba(0,0,0,0.04);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.10),0 4px 12px rgba(0,0,0,0.05);
  --shadow-sheet:0 -4px 24px rgba(0,0,0,0.08),0 -1px 6px rgba(0,0,0,0.04);
  /* SOLID BACKGROUNDS (no backdrop-filter — perf) */
  --header-bg:rgba(245,245,247,0.94);
  --footer-bg:rgba(245,245,247,0.96);
  /* P3/P7: scrim is now a LIGHT top+bottom fade only — map stays clearly readable in the middle */
  --scrim-bg:linear-gradient(180deg,rgba(245,245,247,0.55) 0%,rgba(245,245,247,0.08) 22%,rgba(245,245,247,0.08) 58%,rgba(245,245,247,0.88) 100%);
  /* MOTION */
  --ease:180ms ease-out;
  --ease-sheet:220ms cubic-bezier(0.22,0.61,0.36,1);
}
[data-theme="dark"]{
  --bg:#000000;--surface:#1C1C1E;--bg3:#2C2C2E;--text:#F2F2F7;--text2:#98989F;
  --text3:#636366;--border-subtle:rgba(255,255,255,0.08);
  --header-bg:rgba(0,0,0,0.94);--footer-bg:rgba(0,0,0,0.96);
  --scrim-bg:linear-gradient(180deg,rgba(0,0,0,0.55) 0%,rgba(0,0,0,0.12) 22%,rgba(0,0,0,0.12) 58%,rgba(0,0,0,0.92) 100%);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3),0 1px 3px rgba(0,0,0,0.4);
  --shadow-md:0 4px 16px rgba(0,0,0,0.4),0 1px 4px rgba(0,0,0,0.3);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.55),0 4px 12px rgba(0,0,0,0.35);
  --shadow-sheet:0 -4px 24px rgba(0,0,0,0.5),0 -1px 6px rgba(0,0,0,0.3);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);font-size:var(--font-body);
  min-height:100dvh;display:flex;flex-direction:column;
  -webkit-tap-highlight-color:transparent;letter-spacing:-0.01em;
  overflow-x:hidden;
}

/* === AMBIENT MAP (z-0) — full-bleed background, CLEARLY VISIBLE, non-interactive === */
/* P3/P7: map must NOT be shadowed/dimmed after selection. Opacity 0.9, no blur. */
#ambientMap{
  position:fixed;inset:0;z-index:0;
  background:var(--bg3);
}
#ambientMap #map{
  position:absolute;inset:0;width:100%;height:100%;
  opacity:0.9;filter:none;
  pointer-events:none;
}
/* MAP EXPAND MODAL — toggled by .map-expanded on body */
body.map-expanded #ambientMap #map{
  opacity:1;filter:none;pointer-events:auto;z-index:200;
}
body.map-expanded #mapModal{display:block}
#mapModal{display:none;position:fixed;inset:0;z-index:199;pointer-events:none}
#mapModal .map-close{
  position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px;z-index:201;
  width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
  background:var(--surface);color:var(--text);font-size:20px;font-weight:700;
  box-shadow:var(--shadow-md);pointer-events:auto;
  display:flex;align-items:center;justify-content:center;
}
#mapModal .map-close:active{transform:scale(0.92)}
#centerRouteBtn{
  position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));right:16px;z-index:201;
  display:none;width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
  background:var(--surface);color:var(--primary);font-size:22px;
  box-shadow:var(--shadow-md);pointer-events:auto;
}
body.map-expanded #centerRouteBtn{display:flex;align-items:center;justify-content:center}
#centerRouteBtn:active{transform:scale(0.92)}
/* Map labels (dead — preserved for compat) */
.voy-label{display:none}.voy-label-popup{display:none}
.voy-label-popup .maplibregl-popup-content{padding:0!important;background:transparent!important;box-shadow:none!important;border-radius:0!important}
.voy-label-popup .maplibregl-popup-tip{display:none}
#map.crosshair .maplibregl-canvas{cursor:crosshair!important}

/* === SCRIM (z-1) — ensures sheet legibility over map === */
#scrim{position:fixed;inset:0;z-index:1;background:var(--scrim-bg);pointer-events:none}
body.map-expanded #scrim{display:none}

/* === APP CONTENT (z-2) === */
.app{
  position:relative;z-index:2;
  max-width:540px;margin:0 auto;width:100%;
  min-height:100dvh;display:flex;flex-direction:column;
}

/* === HEADER — solid bg, 17px wordmark, GPS dot === */
.header{
  background:var(--header-bg);
  color:var(--text);
  padding:calc(10px + env(safe-area-inset-top,0px)) var(--sp-4) 10px;
  display:flex;align-items:center;gap:var(--sp-3);
  position:sticky;top:0;z-index:100;
}
.header h1{
  font-size:var(--font-title);font-weight:var(--font-weight-title);
  letter-spacing:-0.02em;flex:1;color:var(--text);cursor:pointer;
}
.gps-dot{
  width:12px;height:12px;border-radius:50%;flex-shrink:0;
  background:var(--text3);box-shadow:0 0 0 3px rgba(255,255,255,0.6);
  transition:background var(--ease);cursor:pointer;
}
.gps-dot.ok{background:var(--success)}
.gps-dot.err{background:var(--red)}

/* === INPUTS — single compact card === */
.inputs{padding:var(--sp-2) var(--sp-4) var(--sp-1)}
/* P1/F4: overflow:hidden REMOVED — was clipping the .search-dropdown inside .input-row.
   Rounded corners preserved by the card's own border-radius + transparent row backgrounds. */
.input-card{
  background:var(--surface);border:0.5px solid var(--border-subtle);
  border-radius:var(--radius-card);box-shadow:var(--shadow-md);
}
.input-row{
  display:flex;align-items:center;gap:var(--sp-3);
  padding:var(--sp-3) var(--sp-4);position:relative;
}
.input-divider{height:0.5px;background:var(--border-subtle);margin:0 var(--sp-4) 0 calc(var(--sp-4) + 26px)}
.dot{
  width:12px;height:12px;border-radius:50%;flex-shrink:0;
  box-shadow:0 0 0 3px rgba(255,255,255,0.9),0 1px 4px rgba(0,0,0,0.1);
}
.dot.green{background:var(--success)}.dot.red{background:var(--red)}
.input-field{
  flex:1;border:none;background:transparent;outline:none;
  font-size:var(--font-body);font-weight:var(--font-weight-body);color:var(--text);
  min-width:0;letter-spacing:-0.01em;padding:var(--sp-1) 0;
}
.input-field::placeholder{color:var(--text3)}
.input-btn{
  border:none;background:transparent;cursor:pointer;flex-shrink:0;
  width:40px;height:40px;border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:transform var(--ease),background var(--ease);
}
.input-btn:active{transform:scale(0.9);background:var(--bg3)}
.btn-locate{color:var(--primary)}
.btn-map{color:var(--text2);font-size:16px}
/* Search dropdown — P1/F4: high z-index, generous max-height, renders ABOVE sheet/footer within .app stacking context */
.search-field{position:relative;flex:1;min-width:0}
.search-dropdown{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:3000;
  background:var(--surface);border:0.5px solid var(--border-subtle);
  border-radius:var(--radius-card);box-shadow:var(--shadow-lg);overflow:hidden;
  max-height:260px;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.search-dropdown.hidden{display:none}
.search-item{
  display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);cursor:pointer;
  border-bottom:0.5px solid var(--border-subtle);font-size:var(--font-body);line-height:1.35;
  -webkit-tap-highlight-color:transparent;min-height:52px;
  transition:background var(--ease);
}
.search-item:last-child{border-bottom:none}
.search-item:active,.search-item:hover{background:var(--bg3)}
.search-item--recent .search-item-icon{color:var(--text3)}
.search-item--empty{padding:var(--sp-5);color:var(--text2);font-size:14px;cursor:default;text-align:center}
.search-item-icon{font-size:18px;flex-shrink:0;width:24px;text-align:center}
.search-item-text{flex:1;min-width:0}
.search-item-text strong{display:block;font-weight:600;font-size:var(--font-body);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.01em}
.search-item-text small{color:var(--text2);font-size:var(--font-caption);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:2px}

/* === MEMORY BLOCK — horizontal chip row === */
.memory-block{display:none;padding:0 var(--sp-4) var(--sp-1)}
.memory-block.show{display:block}
.memory-section{display:flex;align-items:center;gap:var(--sp-2);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.memory-section::-webkit-scrollbar{display:none}
.memory-title{font-size:var(--font-caption);font-weight:600;color:var(--text2);white-space:nowrap;flex-shrink:0;letter-spacing:0.02em;text-transform:uppercase}
.chip{
  display:inline-flex;align-items:center;gap:var(--sp-1);
  padding:8px 14px;border-radius:var(--radius-button);
  background:var(--surface);border:0.5px solid var(--border-subtle);
  font-size:var(--font-caption);font-weight:600;color:var(--text);
  white-space:nowrap;flex-shrink:0;cursor:pointer;min-height:36px;
  box-shadow:var(--shadow-sm);transition:transform var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.chip:active{transform:scale(0.95)}
.chip .chip-icon{font-size:14px}
.chip .chip-text{max-width:120px;overflow:hidden;text-overflow:ellipsis}
.chip.chip-clear{color:var(--primary);background:rgba(0,122,255,0.08);border-color:transparent}
.chip.chip-clear-confirm{color:#fff;background:var(--red);border-color:transparent}

/* === DECISION SHEET — single bottom-anchored surface === */
/* P2: sheet-wrap is scrollable so the hero CTA is always reachable even when content overflows (keyboard, expanded alts). */
.sheet-wrap{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 var(--sp-4);overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.sheet{
  background:var(--surface);border-radius:var(--radius-card) var(--radius-card) 0 0;
  box-shadow:var(--shadow-sheet);padding:var(--sheet-padding);
  padding-bottom:calc(var(--sheet-padding) + env(safe-area-inset-bottom,0px) + 56px);
  margin-top:var(--sp-6);position:relative;
}
.sheet-empty{
  text-align:center;padding:var(--sp-6) var(--sp-4);color:var(--text2);
  font-size:var(--font-body);font-weight:var(--font-weight-body);
}
.sheet-empty .sheet-empty-icon{font-size:40px;display:block;margin-bottom:var(--sp-3);opacity:0.4}
/* Hero provider row — the decision */
.sheet-hero{
  display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) 0 var(--sp-3);
  cursor:pointer;border-bottom:0.5px solid var(--border-subtle);
}
.hero-color{width:6px;height:44px;border-radius:3px;flex-shrink:0}
.hero-info{flex:1;min-width:0}
.hero-name{
  font-size:var(--font-title);font-weight:var(--font-weight-title);
  color:var(--text);letter-spacing:-0.02em;line-height:1.2;
}
.hero-eta{
  font-size:var(--font-caption);font-weight:600;color:var(--text2);
  margin-top:2px;letter-spacing:-0.01em;
}
.hero-price{
  font-size:var(--font-decision);font-weight:var(--font-weight-decision);
  color:var(--text);letter-spacing:-0.03em;line-height:1;
}
.hero-pedir{
  background:var(--success);color:#fff;border:none;border-radius:var(--radius-button);
  padding:0 24px;height:52px;min-height:52px;font-size:var(--font-body);
  font-weight:var(--font-weight-headline);cursor:pointer;flex-shrink:0;
  box-shadow:0 4px 12px rgba(52,199,89,0.32);letter-spacing:-0.01em;
  transition:transform var(--ease),box-shadow var(--ease);
  display:inline-flex;align-items:center;justify-content:center;
}
.hero-pedir:active{transform:scale(0.95);box-shadow:0 2px 6px rgba(52,199,89,0.28)}
.hero-pedir.hero-pedir--disabled{
  background:var(--bg3);color:var(--text3);box-shadow:none;cursor:not-allowed;
}
/* Expandable alternates */
.sheet-alts{
  max-height:0;overflow:hidden;
  transition:max-height var(--ease-sheet);
}
.sheet-alts.expanded{max-height:300px}
.alt-row{
  display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) 0;
  border-bottom:0.5px solid var(--border-subtle);
}
.alt-row:last-child{border-bottom:none}
.alt-color{width:4px;height:28px;border-radius:2px;flex-shrink:0;opacity:0.7}
.alt-name{
  flex:1;min-width:0;font-size:var(--font-body);font-weight:var(--font-weight-body);
  color:var(--text2);letter-spacing:-0.01em;
}
.alt-name.alt-name--disabled{color:var(--text3)}
.alt-price{
  font-size:var(--font-body);font-weight:600;color:var(--text2);
  letter-spacing:-0.01em;
}
.alt-pedir{
  background:var(--success);color:#fff;border:none;border-radius:var(--radius-button);
  padding:0 16px;height:44px;min-height:44px;font-size:var(--font-caption);
  font-weight:var(--font-weight-headline);cursor:pointer;flex-shrink:0;
  box-shadow:0 2px 8px rgba(52,199,89,0.22);letter-spacing:-0.01em;
  transition:transform var(--ease);
}
.alt-pedir:active{transform:scale(0.95)}
.alt-pedir.alt-pedir--disabled{
  background:var(--bg3);color:var(--text3);box-shadow:none;cursor:not-allowed;
}
.sheet-expand-hint{
  text-align:center;font-size:var(--font-micro);font-weight:700;
  color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;
  padding:var(--sp-2) 0 0;cursor:pointer;
}

/* === BUS MINI-BLOCK (P5) — informational, own block, all plausible lines ranked === */
.bus-block{
  margin-top:var(--sp-4);padding-top:var(--sp-3);border-top:0.5px solid var(--border-subtle);
}
.bus-block-title{
  font-size:var(--font-micro);font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:0.04em;margin-bottom:var(--sp-2);
  display:flex;align-items:center;gap:var(--sp-1);
}
.bus-line-main{
  display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);
  background:var(--bg);border-radius:var(--radius-sm);cursor:pointer;
  transition:background var(--ease);-webkit-tap-highlight-color:transparent;
  min-height:48px;
}
.bus-line-main:active{background:var(--bg3);transform:scale(0.99)}
.bus-line-icon{font-size:18px;flex-shrink:0}
.bus-line-body{flex:1;min-width:0;line-height:1.35}
.bus-line-text{font-size:var(--font-body);font-weight:600;color:var(--text);letter-spacing:-0.01em}
.bus-line-sub{font-size:var(--font-caption);color:var(--text2);margin-top:1px}
.bus-line-eta{font-size:var(--font-caption);font-weight:700;color:var(--text);flex-shrink:0;text-align:right;min-width:44px}
.bus-urgent{color:var(--red);font-weight:700;margin-left:var(--sp-1)}
.bus-estimated-badge{
  font-size:10px;font-weight:700;color:var(--text3);
  background:var(--bg3);padding:2px 6px;border-radius:var(--radius-xs);
  text-transform:uppercase;letter-spacing:0.02em;
}
.bus-alts{
  max-height:0;overflow:hidden;transition:max-height var(--ease-sheet);
}
.bus-alts.expanded{max-height:320px}
.bus-alt-row{
  display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);
  border-top:0.5px solid var(--border-subtle);font-size:var(--font-caption);color:var(--text2);
}
.bus-alt-row .bus-alt-line{font-weight:700;color:var(--text);min-width:48px}
.bus-alt-row .bus-alt-stop{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bus-alt-row .bus-alt-eta{flex-shrink:0;font-weight:600;color:var(--text2)}
.bus-expand-hint{
  text-align:center;font-size:var(--font-micro);font-weight:700;
  color:var(--primary);text-transform:uppercase;letter-spacing:0.04em;
  padding:var(--sp-2) 0 0;cursor:pointer;
}
.bus-detail{
  max-height:0;overflow:hidden;font-size:var(--font-caption);color:var(--text2);
  transition:max-height var(--ease-sheet);line-height:1.5;
}
.bus-detail.expanded{max-height:160px;padding-top:var(--sp-2)}
.bus-detail .bd-row{padding:2px 0}

/* === BIKE one-liner (tertiary, last) === */
.tambien{
  margin-top:var(--sp-4);padding-top:var(--sp-3);border-top:0.5px solid var(--border-subtle);
}
.tambien-line{
  display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;
  font-size:var(--font-body);color:var(--text2);line-height:1.5;
}
.tambien-item{
  display:inline-flex;align-items:center;gap:var(--sp-1);
  padding:6px 12px;border-radius:var(--radius-sm);cursor:pointer;
  transition:background var(--ease);-webkit-tap-highlight-color:transparent;
}
.tambien-item:active{background:var(--bg3);transform:scale(0.98)}
.tambien-item .t-icon{font-size:16px}
.tambien-item .t-text{font-weight:var(--font-weight-body)}
.tambien-item.bus .t-text{color:var(--text2)}
.tambien-item.bike .t-text{color:var(--text3)}
.tambien-urgent{color:var(--red);font-weight:700}
.tambien-detail{
  max-height:0;overflow:hidden;font-size:var(--font-caption);color:var(--text2);
  transition:max-height var(--ease-sheet);line-height:1.5;
}
.tambien-detail.expanded{max-height:120px;padding-top:var(--sp-2)}
.tambien-detail .td-row{padding:2px 0}

/* === FOOTER — solid, no blur, safe-area === */
.footer{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:var(--footer-bg);
  color:var(--text3);font-size:var(--font-micro);
  padding:var(--sp-2) var(--sp-4);
  padding-bottom:calc(var(--sp-2) + env(safe-area-inset-bottom,0px));

function _haversineMeters(lat1,lon1,lat2,lon2){
  var R=6371000;var dLat=(lat2-lat1)*Math.PI/180;var dLon=(lon2-lon1)*Math.PI/180;

}

  if(origin&&origin.source!=='gps'&&origin.source!=='cache')return;
  var now=Date.now();
  if(_gpsLastUpdate&&now-_gpsLastUpdate<GPS_DEBOUNCE_MS)return;
  if(_gpsLastLat!=null){var dist=_haversineMeters(_gpsLastLat,_gpsLastLon,lat,lon);if(dist< GPS_MIN_MOVE_M)return}
  _gpsLastUpdate=now;_gpsLastLat=lat;_gpsLastLon=lon;
  MC.setOrigin(lat,lon,'Mi ubicación','gps');
  va_origin('gps');updateOriginUI();updateMapMarkers();
  if(!_gpsFirstFixDone){
    _gpsFirstFixDone=true;
    clearTimeout(_gpsReverseDebounceTimer);
    _gpsReverseDebounceTimer=setTimeout(function(){reverseGeocodeOrigin(_gpsLastLat,_gpsLastLon)},GPS_REVERSE_DEBOUNCE_MS);
  }
  if(!_gpsMapCenteredOnce){
    _gpsMapCenteredOnce=true;
    if(_map)_map.flyTo({center:[lon,lat],zoom:15});
  }
  if(MC.getDest())runEstimations();
}
function initGPS(){
  if(!navigator.geolocation){updateGPSStatus(false);loadCachedPosition();return}
  if(navigator.permissions&&navigator.permissions.query){
    navigator.permissions.query({name:'geolocation'}).then(function(status){
      _onGpsPermissionChange(status);status.onchange=function(){_onGpsPermissionChange(status)};
    }).catch(function(){_startGpsWatch()});
  }else{_startGpsWatch()}
}
function _onGpsPermissionChange(status){
  if(status.state==='denied'){_stopGpsWatch();updateGPSStatus(false);loadCachedPosition();return}
  _startGpsWatch();
}
function _startGpsWatch(){
  if(_gpsWatch!==null)return;
  _gpsWatch=navigator.geolocation.watchPosition(function(pos){
    _gpsRetryCount=0;updateGPSStatus(true);cachePosition(pos.coords.latitude,pos.coords.longitude);
    _handleGpsPosition(pos.coords.latitude,pos.coords.longitude);
  },function(err){
    updateGPSStatus(false);loadCachedPosition();
    if(err.code===err.PERMISSION_DENIED){return}
    if(_gpsRetryCount<_gpsMaxRetries){
      _gpsRetryCount++;clearTimeout(_gpsRetryTimer);
      _gpsRetryTimer=setTimeout(function(){
        navigator.geolocation.getCurrentPosition(function(pos){
          _gpsRetryCount=0;updateGPSStatus(true);cachePosition(pos.coords.latitude,pos.coords.longitude);
          _handleGpsPosition(pos.coords.latitude,pos.coords.longitude);
        },function(){},{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
      },_gpsRetryCount*5000);
    }
  },{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
}
function _stopGpsWatch(){if(_gpsWatch!==null){navigator.geolocation.clearWatch(_gpsWatch);_gpsWatch=null}}
function updateGPSStatus(ok){
  var el=document.getElementById('gpsStatus');
  if(el){el.className='gps-dot '+(ok?'ok':'err')}
}
function cachePosition(lat,lon){try{localStorage.setItem('voy_last_pos',JSON.stringify({lat:lat,lon:lon}))}catch(e){}}
function loadCachedPosition(){
  try{
    var cached=localStorage.getItem('voy_last_pos');
    if(cached){var pos=JSON.parse(cached);
      if(!MC.getOrigin()){
        MC.setOrigin(pos.lat,pos.lon,'Ubicación guardada','cache');va_origin('cache');updateOriginUI();updateMapMarkers();
      }
    }
  }catch(e){}
}
function locateMe(){
  if(!navigator.geolocation){return}
  navigator.geolocation.getCurrentPosition(function(pos){
    MC.setOriginManual(false);
    MC.setOrigin(pos.coords.latitude,pos.coords.longitude,'Mi ubicación','gps');
    va_origin('gps');cachePosition(pos.coords.latitude,pos.coords.longitude);
    updateOriginUI();updateMapMarkers();
    var origin=MC.getOrigin();
    if(_map)_map.flyTo({center:[origin.lon,origin.lat],zoom:15});

}

// ===================== MAP MARKERS =====================
function updateMapMarkers(){
  if(!_map)return;
  var origin=MC.getOrigin();var dest=MC.getDest();
  if(_originMarker){_originMarker.remove();_originMarker=null}
  if(_destMarker){_destMarker.remove();_destMarker=null}
  if(origin){
    var el=document.createElement('div');
    el.style.cssText='width:16px;height:16px;background:#34C759;border:3px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.5)';
    _originMarker=new maplibregl.Marker({element:el}).setLngLat([origin.lon,origin.lat]).addTo(_map);
  }
  if(dest){
    var el2=document.createElement('div');
    el2.style.cssText='width:16px;height:16px;background:#FF3B30;border:3px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.5)';
    _destMarker=new maplibregl.Marker({element:el2}).setLngLat([dest.lon,dest.lat]).addTo(_map);
  }
  drawRouteLine();
}
function drawRouteLine(){
  if(!_map)return;
  var origin=MC.getOrigin();var dest=MC.getDest();
  if(!origin||!dest)return;
  if(_map.getSource('route-src')){
    if(_map.getLayer('route-shadow'))_map.removeLayer('route-shadow');
    if(_map.getLayer('route-line'))_map.removeLayer('route-line');
    _map.removeSource('route-src');
  }
  var geojson={type:'Feature',geometry:{type:'LineString',coordinates:[[origin.lon,origin.lat],[dest.lon,dest.lat]]}};
  _map.addSource('route-src',{type:'geojson',data:geojson});
  _map.addLayer({id:'route-shadow',type:'line',source:'route-src',layout:{'line-cap':'round'},paint:{'line-color':'#007AFF','line-width':10,'line-opacity':0.15}});
  _map.addLayer({id:'route-line',type:'line',source:'route-src',layout:{'line-cap':'round'},paint:{'line-color':'#007AFF','line-width':4,'line-opacity':0.8}});
}
function centerRoute(){
  if(!_map)return;
  var origin=MC.getOrigin();var dest=MC.getDest();
  if(!origin||!dest)return;
  var bounds=new maplibregl.LngLatBounds();
  bounds.extend([origin.lon,origin.lat]);bounds.extend([dest.lon,dest.lat]);
  _map.fitBounds(bounds,{padding:40,maxZoom:16,duration:600});
}

function formatRelativeTime(ts){

  if(seconds<60)return 'hace un momento';
  var minutes=Math.floor(seconds/60);if(minutes<60)return 'hace '+minutes+' min';
  var hours=Math.floor(minutes/60);if(hours<24)return 'hace '+hours+' h';
  var days=Math.floor(hours/24);if(days===1)return 'ayer';if(days<7)return 'hace '+days+' días';
  var d=new Date(ts);return d.getDate()+'/'+(d.getMonth()+1);
}

function closeAllDropdowns(){document.querySelectorAll('.search-dropdown').forEach(function(d){d.classList.add('hidden')})}
// P1/F4: track the live query per field so the “searching…” hint can show the typed text.
var _currentSearchQuery={origin:'',dest:''};
// P4/F4: track the last key pressed so Enter/Go can trigger fallback geocode.
var _searchEnterPending={origin:false,dest:false};

async function onSearchInput(val,field){
  MC.setSearchTimer(null);
  var id=field==='origin'?'originDropdown':'destDropdown';
  var dropdown=document.getElementById(id);if(!dropdown)return;
  val=(val||'').trim();
  _currentSearchQuery[field]=val;
  if(!val||val.length<2){
    dropdown.classList.add('hidden');
    if(!val||val.length===0){
      if(field==='origin'){
        var origin=MC.getOrigin();
        if(origin&&origin.source!=='gps'&&origin.source!=='cache'){MC.clearOrigin();renderSheet();updateMapMarkers()}
      }else{
        MC.clearDest();renderSheet();updateMapMarkers();
      }
      var recent=MC.getRecentSearches();
      if(recent.length){
        renderSearchDropdown(recent.slice(0,3).map(function(r){return{lat:r.lat,lon:r.lon,display_name:r.display||r.name}}),field,true);
      }
    }
    return;
  }
  // ---- P1/F1/F4: LOCAL-FIRST. Run local search synchronously and show instantly ----
  var local=MC.searchLocal(val);
  if(local.length){
    renderSearchDropdown(local.slice(0,5),field,false,false);
  }else{
    // No local hit yet — show “searching…” while remote resolves.
    renderSearchDropdown([],field,false,true);
  }
  // ---- REMOTE (debounced) — refines with Nominatim, merges + dedups ----
  var version=++_searchVersion;
  var timer=setTimeout(async function(){
    var remote=await MC.searchNominatim(val);
    if(version!==_searchVersion)return;
    // Merge local (already computed) + remote, dedup. Cap at 6 for mobile.
    var merged=MC.dedupResults(local.concat(remote||[]));
    // dedupResults caps at 3; for destination we want a few more — slice explicitly.
    if(merged.length===0&&local.length)merged=local.slice(0,5);
    renderSearchDropdown(merged.slice(0,6),field,false,false);
  },250);
  MC.setSearchTimer(timer);
}
// P4/F4: Enter/Go on the dest input → fallback geocode so manual typing still resolves.
function onSearchKeydown(e,field){
  if(e.key==='Enter'||e.keyCode===13){
    var inp=e.target;
    var val=(inp.value||'').trim();
    if(val.length<2)return;
    e.preventDefault();
    _searchEnterPending[field]=true;
    // If a dropdown is visible with results, select the first one.
    var id=field==='origin'?'originDropdown':'destDropdown';
    var dd=document.getElementById(id);
    if(dd&&!dd.classList.contains('hidden')){
      var first=dd.querySelector('.search-item:not(.search-item--empty)');
      if(first){first.click();return}
    }
    // Otherwise run a fallback geocode with the typed text.
    fallbackGeocode(val,field);
  }
}
// P4/F4: manual fallback geocode — typed text → Nominatim → first result.
async function fallbackGeocode(q,field){
  try{
    var url='https://nominatim.openstreetmap.org/search?'+
      'q='+encodeURIComponent(q+', Santa Fe, Argentina')+
      '&format=json&limit=1&accept-language=es'+
      '&viewbox=-60.85,-31.5,-60.55,-31.75&bounded=1';
    var r=await fetch(url,{headers:{'User-Agent':'MovilidadAsistente/1.0'}});
    var data=await r.json();
    if(data&&data[0]){
      var lat=parseFloat(data[0].lat),lon=parseFloat(data[0].lon);
      var name=data[0].display_name.split(',').slice(0,2).join(', ');
      selectSearchResult(field,lat,lon,data[0].display_name);
      MC.saveRecentSearch({lat:lat,lon:lon,display_name:data[0].display_name});
    }else{
      showToast('No se encontró “'+q+'”','warn');
    }
  }catch(e){
    showToast('Error de red al buscar','error');
  }
}

// ===================== RENDER DECISION SHEET =====================
function renderSheet(){
  var container=document.getElementById('decisionSheet');
  var origin=MC.getOrigin();var dest=MC.getDest();
  var estimations=MC.getEstimations();
  if(!origin||!dest){
    container.innerHTML='<div class="sheet-empty"><span class="sheet-empty-icon">👆</span>Elegí origen y destino para ver opciones</div>';
    clearBusRoute();
    return;
  }
  if(!estimations||!estimations.length){
    container.innerHTML='<div class="sheet-empty"><span class="sheet-empty-icon">⏳</span>Calculando rutas...</div>';
    clearBusRoute();
    return;
  }

  // Separate auto (primary) from bus/bike (inline)
  var autoEst=null,busEst=null,bikeEst=null;
  estimations.forEach(function(e){
    if(e.mode==='auto'&&!autoEst)autoEst=e;
    else if(e.mode==='bus'&&!busEst)busEst=e;
    else if(e.mode==='bike'&&!bikeEst)bikeEst=e;
  });

  if(!autoEst){
    container.innerHTML='<div class="sheet-empty"><span class="sheet-empty-icon">🚗</span>Sin tarifas de auto disponibles</div>';
    clearBusRoute();
    return;
  }

  // Build provider list from engine's rankedProviders (contextual_score).
  // Delete legacy price-sort fallback — engine always returns rankedProviders.
  var providers=[];
  if(autoEst.rankedProviders&&autoEst.rankedProviders.length){
    providers=autoEst.rankedProviders.map(function(p){
      var url=null;
      if(p.id==='uber')url=buildUberLink();
      else if(p.id==='didi')url=buildDiDiLink();
      else if(p.id==='maxim')url=buildMaximLink();
      else if(p.id==='taxi')url='https://wa.link/n7u2e7';
      else if(p.id==='remis')url='https://wa.link/rqov56';
      else if(p.id==='taxiapp')url='https://wa.link/vavbcl';
      return {id:p.id,name:p.name,price:p.price,timeMin:p.timeMin,url:url};
    });
  }
  // Filter: available providers; demote unsupported Maxim (disabled, not hero)
  var hero=null,alts=[],disabledMaxim=false;
  for(var i=0;i<providers.length&&alts.length<2;i++){
    var p=providers[i];
    if(!PROVIDERS[p.id]||!PROVIDERS[p.id].available)continue;
    if(p.id==='maxim'&&!isMaximSupported()){
      disabledMaxim=p; // show as disabled row, never hero
      continue;
    }
    if(!hero){hero=p}
    else{alts.push(p)}
  }
  // If disabled Maxim exists and we have alt slots, append as disabled alt
  if(disabledMaxim&&alts.length<2){alts.push(Object.assign({},disabledMaxim,{disabled:true}))}
  // If still no hero (e.g. all were Maxim on iOS), promote first alt
  if(!hero&&alts.length){hero=alts.shift()}

  var h='';
  // HERO ROW
  if(hero){
    h+='<div class="sheet-hero" onclick="toggleSheetAlts()">';
    h+='<div class="hero-color" style="background:'+(PROVIDERS[hero.id]?PROVIDERS[hero.id].color:'#666')+'"></div>';
    h+='<div class="hero-info">';
    h+='<div class="hero-name">'+escapeHtml(hero.name)+'</div>';
    h+='<div class="hero-eta">'+formatMin(hero.timeMin)+' · '+autoEst.distance.toFixed(1)+' km</div>';
    h+='</div>';
    h+='<div class="hero-price">'+(hero.price!=null?formatPrice(hero.price):'—')+'</div>';
    h+='</div>';
    // Hero Pedir (separate from hero click to avoid toggle)
    h+='<div style="display:flex;justify-content:center;margin-bottom:var(--sp-3)" id="heroPedirWrap"></div>';
  }

  // ALTS (expandable)
  if(alts.length){
    h+='<div class="sheet-alts'+(_sheetExpanded?' expanded':'')+'" id="sheetAlts">';
    alts.forEach(function(p){
      var color=PROVIDERS[p.id]?PROVIDERS[p.id].color:'#666';
      h+='<div class="alt-row">';
      h+='<div class="alt-color" style="background:'+color+'"></div>';
      h+='<span class="alt-name'+(p.disabled?' alt-name--disabled':'')+'">'+escapeHtml(p.name)+(p.disabled?' · No disponible':'')+'</span>';
      if(!p.disabled){
        h+='<span class="alt-price">'+(p.price!=null?formatPrice(p.price):'—')+'</span>';
        h+='<button class="alt-pedir" data-action="'+p.id+'" data-url="'+p.url+'">Pedir</button>';
      }else{
        h+='<span class="alt-price" style="opacity:0.5">—</span>';
        h+='<button class="alt-pedir alt-pedir--disabled" disabled>No disponible</button>';
      }
      h+='</div>';
    });
    h+='</div>';
    if(!_sheetExpanded){
      h+='<div class="sheet-expand-hint" onclick="toggleSheetAlts()">Ver '+alts.length+' más ▾</div>';
    }else{
      h+='<div class="sheet-expand-hint" onclick="toggleSheetAlts()">Cerrar ▴</div>';
    }
  }

  // HERO PEDIR button (rendered after alts so it sits at bottom of hero block)
  if(hero){
    var heroPedirHtml='<button class="hero-pedir" style="width:100%" data-action="'+hero.id+'" data-url="'+hero.url+'">Pedir '+escapeHtml(hero.name)+'</button>';
    // We'll inject via innerHTML replacement after setting container
  }

  // ===== P5: BUS MINI-BLOCK — own block, all plausible lines ranked =====
  // Use MC.rankBusLines() if available (controller-side ranking). Fallback to single busEst.
  var rankedBus=[];
  if(typeof MC.rankBusLines==='function'){
    try{rankedBus=MC.rankBusLines()||[]}catch(e){rankedBus=[]}
  }
  if(!rankedBus.length&&busEst){rankedBus=[busEst]}
  if(rankedBus.length){
    var mainBus=rankedBus[0];
    var otherBus=rankedBus.slice(1);
    h+='<div class="bus-block">';
    h+='<div class="bus-block-title">🚌 Colectivo <span class="bus-estimated-badge">≈ estimado</span></div>';
    // Main line card (tap → toggle detail)
    var busText='Lin. '+escapeHtml(mainBus.linea)+' por '+escapeHtml(shortenStop(mainBus.stopOrigenCalles));
    h+='<div class="bus-line-main" onclick="toggleBusDetail()">';
    h+='<span class="bus-line-icon">🚌</span>';
    h+='<div class="bus-line-body">';
    h+='<div class="bus-line-text">'+busText+'</div>';
    h+='<div class="bus-line-sub">Subir en '+escapeHtml(shortenStop(mainBus.stopOrigenCalles))+' · '+formatMin(mainBus.walkToStopMin||0)+' caminando</div>';
    h+='</div>';
    h+='<div class="bus-line-eta">'+(mainBus.totalMin||0)+' min';
    if(mainBus.walkToStopMin<2)h+='<div class="bus-urgent">¡apurate!</div>';
    h+='</div>';
    h+='</div>';
    // Expandable detail (parada, SUBE, caminata)
    h+='<div class="bus-detail'+(_busDetailExpanded?' expanded':'')+'" id="busDetail">';
    h+='<div class="bd-row">📍 Parada origen: '+escapeHtml(mainBus.stopOrigenCalles||'')+'</div>';
    h+='<div class="bd-row">🏁 Bajada: '+escapeHtml(mainBus.stopDestCalles||'')+'</div>';
    h+='<div class="bd-row">💵 SUBE: '+(mainBus.price!=null?formatPrice(mainBus.price):'—')+'</div>';
    h+='<div class="bd-row">🚶 Caminata al subida: '+formatMin(mainBus.walkToStopMin||0)+'</div>';
    h+='<div class="bd-row">🚶 Caminata desde bajada: '+formatMin(mainBus.walkFromStopMin||0)+'</div>';
    h+='<div class="bd-row" style="color:var(--text3);font-size:11px;margin-top:4px">Horario estimado (sin feed en vivo)</div>';
    h+='</div>';
    // Expandable alternates (other ranked lines)
    if(otherBus.length){
      h+='<div class="bus-alts'+(_busAltsExpanded?' expanded':'')+'" id="busAlts">';
      otherBus.forEach(function(b){
        h+='<div class="bus-alt-row">';
        h+='<span class="bus-alt-line">Lin. '+escapeHtml(b.linea)+'</span>';
        h+='<span class="bus-alt-stop">'+escapeHtml(shortenStop(b.stopOrigenCalles))+'</span>';
        h+='<span class="bus-alt-eta">'+(b.totalMin||0)+' min</span>';
        h+='</div>';
      });
      h+='</div>';
      h+='<div class="bus-expand-hint" onclick="toggleBusAlts()">'+(_busAltsExpanded?'Cerrar ▴':('Ver '+otherBus.length+' líneas más ▾'))+'</div>';
    }
    h+='</div>';
    // P6: draw the main bus line route on the map (clearly estimated)
    drawBusRoute(mainBus.linea);
  }else{
    clearBusRoute();
  }

  // ===== BIKE one-liner (tertiary, LAST) =====
  if(bikeEst){
    h+='<div class="tambien">';
    h+='<div class="tambien-line">';
    h+='<span class="tambien-item bike" onclick="toggleTambien(\'bike\')">🚲 '+bikeEst.distance.toFixed(1)+' km · gratis</span>';
    h+='</div>';
    h+='<div class="tambien-detail'+(_tambienExpanded.bike?' expanded':'')+'" id="tambienBike">';
    if(bikeEst.nearStation)h+='<div class="td-row">📍 Retirar: '+escapeHtml(bikeEst.nearStation.nombre)+' ('+escapeHtml(bikeEst.nearStation.calles)+')</div>';
    if(bikeEst.nearDestStation)h+='<div class="td-row">📍 Dejar: '+escapeHtml(bikeEst.nearDestStation.nombre)+' ('+escapeHtml(bikeEst.nearDestStation.calles)+')</div>';
    h+='<div class="td-row"><a href="'+buildBikeLink()+'" target="_blank" style="color:var(--primary);text-decoration:none">Abrir Las Bicis →</a></div>';
    h+='</div>';
    h+='</div>';
  }

  container.innerHTML=h;

  // Inject hero Pedir button into its wrapper
  if(hero){
    var wrap=document.getElementById('heroPedirWrap');
    if(wrap){
      var btn=document.createElement('button');
      btn.className='hero-pedir';
      btn.style.width='100%';
      btn.setAttribute('data-action',hero.id);
      btn.setAttribute('data-url',hero.url);
      btn.textContent='Pedir '+hero.name;
      wrap.appendChild(btn);
    }
  }

  attachButtonEvents();
}

function shortenStop(calles){
  if(!calles)return'';
  // "Belgrano y Rivadavia" → "Belgrano y Rivadavia"; keep short
  var parts=calles.split(' y ');
  if(parts.length>=2)return parts[0].replace(/^Bvd\.\s*/,'').replace(/^Av\.\s*/,'')+' y '+parts[1].replace(/^Bvd\.\s*/,'').replace(/^Av\.\s*/,'');
  return calles;
}

function toggleSheetAlts(){
  _sheetExpanded=!_sheetExpanded;
  var alts=document.getElementById('sheetAlts');
  if(alts)alts.classList.toggle('expanded',_sheetExpanded);
  // Update hint text
  var hint=document.querySelector('.sheet-expand-hint');
  if(hint){
    var count=alts?alts.querySelectorAll('.alt-row').length:0;
    hint.textContent=_sheetExpanded?'Cerrar ▴':('Ver '+count+' más ▾');
  }
}

function toggleTambien(type){
  _tambienExpanded[type]=!_tambienExpanded[type];
  var el=document.getElementById(type==='bus'?'tambienBus':'tambienBike');
  if(el)el.classList.toggle('expanded',_tambienExpanded[type]);
}

// ===================== P5: BUS MINI-BLOCK TOGGLES =====================
function toggleBusDetail(){
  _busDetailExpanded=!_busDetailExpanded;
  var el=document.getElementById('busDetail');
  if(el)el.classList.toggle('expanded',_busDetailExpanded);
}
function toggleBusAlts(){
  _busAltsExpanded=!_busAltsExpanded;
  var el=document.getElementById('busAlts');
  if(el)el.classList.toggle('expanded',_busAltsExpanded);
  // Update hint text
  var hint=el?el.parentNode.querySelector('.bus-expand-hint'):null;
  if(hint){
    var count=el?el.querySelectorAll('.bus-alt-row').length:0;
    hint.textContent=_busAltsExpanded?'Cerrar ▴':('Ver '+count+' líneas más ▾');
  }
}

// ===================== P6: BUS ROUTE OVERLAY (estimated) =====================
// Draws the bus line's stop sequence as a dashed polyline on the map.
// Clearly labeled "estimated" — no live vehicle positions are faked.
function drawBusRoute(linea){
  if(!_map)return;
  // P6: always clear first (no early return) so re-renders refresh the overlay cleanly.
  clearBusRoute();
  if(!linea)return;
  // Wait for style load — if not ready, defer via rAF so the overlay draws once the map is ready.
  if(typeof _map.isStyleLoaded==='function' && !_map.isStyleLoaded()){
    requestAnimationFrame(function(){drawBusRoute(linea)});return;
  }
  if(typeof MC.getBusLineGeometry!=='function')return;
  var coords=MC.getBusLineGeometry(linea);
  if(!coords||coords.length<2)return;
  // Per-step try/catch so one failure doesn't block the rest.
  try{
    _map.addSource('bus-route-src',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:coords}}});
  }catch(e){}
  try{
    _map.addLayer({id:'bus-route-shadow',type:'line',source:'bus-route-src',layout:{'line-cap':'round'},paint:{'line-color':'#FF9500','line-width':8,'line-opacity':0.12}});
  }catch(e){}
  try{
    _map.addLayer({id:'bus-route-line',type:'line',source:'bus-route-src',layout:{'line-cap':'round'},paint:{'line-color':'#FF9500','line-width':3,'line-opacity':0.75,'line-dasharray':[2,1.5]}});
  }catch(e){}
  // Boarding stop marker (nearest to origin)
  var origin=MC.getOrigin();
  if(origin&&coords.length){
    var boardStop=coords[0];var minD=Infinity;
    coords.forEach(function(c){var d=Math.abs(c[1]-origin.lat)+Math.abs(c[0]-origin.lon);if(d<minD){minD=d;boardStop=c}});
    try{
      _map.addSource('bus-board-src',{type:'geojson',data:{type:'Feature',geometry:{type:'Point',coordinates:boardStop}}});
      _map.addLayer({id:'bus-board-marker',type:'circle',source:'bus-board-src',paint:{'circle-radius':6,'circle-color':'#FF9500','circle-stroke-width':2,'circle-stroke-color':'#fff'}});
    }catch(e){}
  }
  _activeBusLine=linea;
}
function clearBusRoute(){
  if(!_map)return;
  // Remove layers BEFORE their sources. Each in its own try/catch so one failure doesn't block others.
  try{if(_map.getLayer('bus-board-marker'))_map.removeLayer('bus-board-marker')}catch(e){}
  try{if(_map.getLayer('bus-route-line'))_map.removeLayer('bus-route-line')}catch(e){}
  try{if(_map.getLayer('bus-route-shadow'))_map.removeLayer('bus-route-shadow')}catch(e){}
  try{if(_map.getSource('bus-board-src'))_map.removeSource('bus-board-src')}catch(e){}
  try{if(_map.getSource('bus-route-src'))_map.removeSource('bus-route-src')}catch(e){}
  _activeBusLine=null;
}

// ===================== LINK BUILDERS =====================
function buildUberLink(){
  var origin=MC.getOrigin();var dest=MC.getDest();
  if(!origin||!dest)return '#';
  return 'https://m.uber.com/ul/?action=setPickup&pickup[latitude]='+origin.lat+'&pickup[longitude]='+origin.lon+
    '&pickup[formatted_address]=Origen&dropoff[latitude]='+dest.lat+'&dropoff[longitude]='+dest.lon;
}
function buildDiDiLink(){
  var origin=MC.getOrigin();var dest=MC.getDest();
  if(!origin||!dest)return '#';
  return 'https://web.didiglobal.com/ar/passenger/ride/?pickup_lat='+origin.lat+'&pickup_lng='+origin.lon+
    '&dropoff_lat='+dest.lat+'&dropoff_lng='+dest.lon;
}
function buildMaximLink(){
  var origin=MC.getOrigin();var dest=MC.getDest();
  if(!origin||!dest||!origin.lat||!dest.lat)return 'https://taximaxim.com/ar/';
  var isAndroid=/Android/i.test(navigator.userAgent);
  var isIOS=/iPhone|iPad/i.test(navigator.userAgent);
  if(isAndroid){
    var playStore='https://play.google.com/store/apps/details?id=com.taxsee.taxsee';
    return 'intent://order?startLat='+Number(origin.lat).toFixed(6)+'&startLon='+Number(origin.lon).toFixed(6)+
      '&finishLat='+Number(dest.lat).toFixed(6)+'&finishLon='+Number(dest.lon).toFixed(6)+
      '#Intent;scheme=taxsee;package=com.taxsee.taxsee;S.browser_fallback_url='+encodeURIComponent(playStore)+';end';
  }
  if(isIOS)return 'https://apps.apple.com/app/maxim/id893663029';
  return 'https://taximaxim.com/ar/';
}
function buildBikeLink(){
  var isAndroid=/Android/i.test(navigator.userAgent);
  if(isAndroid)return 'intent://#Intent;scheme=lasbicis;package=com.santafe.lasbicis;end';
  var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
  if(isIOS)return 'https://apps.apple.com/ar/app/id6444962582';
  return 'https://www.santafe.gob.ar/index.php/educacionycultura/content/download/55027/283898/file/Las%20Bicis.pdf';
}

// ===================== DOUBLE TAP TO CONFIRM =====================
var _confirmState={};
function requestRide(mode,url){
  var now=Date.now();var last=_confirmState[mode]||0;var DOUBLE_TAP_MS=2000;
  if(now-last<DOUBLE_TAP_MS){
    _confirmState[mode]=0;va_cta(mode);
    if(url&&url.indexOf('intent://')===0){window.location.href=url}
    else{window.open(url,'_blank')}
    saveTripToHistory(mode);
  }else{
    _confirmState[mode]=now;
    showToast('Tocá de nuevo para confirmar','info');
    setTimeout(function(){_confirmState[mode]=0},DOUBLE_TAP_MS+100);
  }
}

// ===================== BUTTON EVENTS =====================
function attachButtonEvents(){
  document.querySelectorAll('.hero-pedir,.alt-pedir').forEach(function(btn){
    if(btn.disabled)return;
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      var action=btn.getAttribute('data-action');var url=btn.getAttribute('data-url');
      if(url&&url!=='#')requestRide(action,url);
    });
  });
}

// ===================== UI UPDATES =====================
function updateOriginUI(){
  var origin=MC.getOrigin();var el=document.getElementById('originInput');
  if(el)el.value=origin?origin.name:'';
}
function updateDestUI(){
  var dest=MC.getDest();var el=document.getElementById('destInput');
  if(el)el.value=dest?dest.name:'';
}

// ===================== TOAST =====================
function showToast(msg,type){
  type=type||'info';
  var container=document.getElementById('toastContainer');if(!container)return;
  var el=document.createElement('div');el.className='toast '+type;el.textContent=msg;
  container.appendChild(el);
  setTimeout(function(){
    el.style.opacity='0';el.style.transition='opacity .3s';
    setTimeout(function(){if(el.parentNode)el.remove()},300);
  },2500);
}

// Backward-compat alias (older code paths may call renderCards)
function renderCards(){renderSheet()}

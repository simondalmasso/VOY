<!--
VOY Lite — Slim mobility UI for Santa Fe
Build: 2026-06-09 LITE
Runtime: public/VOY-Lite.html
Engine: core/mobilityEngine.js (refactored — auto/bus/bike only)
Controller: ui/mobilityController.js (refactored — no prefs, no recommendation)
3 card types only. No moto, no walk, no fake bus, no favorites, no decision core.
-->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VOY Lite – Movilidad Santa Fe</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="core/mobilityEngine.js?v=2"></script>
<script src="ui/mobilityController.js?v=2"></script>
<style>
/* ============================================================
   VOY Lite — Apple Maps / iOS 18 visual language (UI-only patch)
   All IDs/classes preserved. Zero JS changes.
   ============================================================ */
:root{
  --bg:#F5F5F7;--bg2:#FFFFFF;--bg3:#E5E5EA;--text:#111111;--text2:#6E6E73;
  --text3:#8E8E93;--accent:#007AFF;--green:#34C759;--red:#FF3B30;--orange:#FF9500;
  --purple:#AF52DE;--card-bg:#FFFFFF;--card-border:rgba(0,0,0,0.06);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04),0 1px 3px rgba(0,0,0,0.06);
  --shadow-md:0 4px 16px rgba(0,0,0,0.06),0 1px 4px rgba(0,0,0,0.04);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.10),0 4px 12px rgba(0,0,0,0.05);
  --radius:18px;--radius-lg:22px;--radius-xl:26px;
  --glass-bg:rgba(255,255,255,0.78);--glass-bg-strong:rgba(255,255,255,0.92);
  --blur:saturate(180%) blur(20px);
  --header-bg:rgba(245,245,247,0.82);--footer-bg:rgba(245,245,247,0.92);
}
[data-theme="dark"]{
  --bg:#000000;--bg2:#1C1C1E;--bg3:#2C2C2E;--text:#F2F2F7;--text2:#98989F;
  --text3:#636366;--card-bg:#1C1C1E;--card-border:rgba(255,255,255,0.08);
  --glass-bg:rgba(28,28,30,0.78);--glass-bg-strong:rgba(28,28,30,0.92);
  --header-bg:rgba(0,0,0,0.82);--footer-bg:rgba(0,0,0,0.92);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3),0 1px 3px rgba(0,0,0,0.4);
  --shadow-md:0 4px 16px rgba(0,0,0,0.4),0 1px 4px rgba(0,0,0,0.3);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.55),0 4px 12px rgba(0,0,0,0.35);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);font-size:16px;
  min-height:100dvh;display:flex;flex-direction:column;
  -webkit-tap-highlight-color:transparent;letter-spacing:-0.01em;
}
/* HEADER — compact, glass */
.header{
  background:var(--header-bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  color:var(--text);padding:14px 20px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:100;border-bottom:0.5px solid var(--card-border);
}
.header h1{font-size:30px;font-weight:800;letter-spacing:-0.03em;flex:1;color:var(--text)}
.header .gps-status{
  font-size:14px;display:flex;align-items:center;gap:4px;padding:8px 12px;
  background:var(--glass-bg-strong);border-radius:14px;
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:0.5px solid var(--card-border);
}
/* INPUTS — floating glass cards, Apple Maps style */
.inputs{background:transparent;padding:16px 16px 8px;border-bottom:none}
.input-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;position:relative}
.input-row:last-child{margin-bottom:0}
.dot{
  width:14px;height:14px;border-radius:50%;flex-shrink:0;
  box-shadow:0 0 0 3px rgba(255,255,255,0.9),0 2px 6px rgba(0,0,0,0.15);
}
.dot.green{background:var(--green)}.dot.red{background:var(--red)}
.input-label{font-size:13px;font-weight:600;color:var(--text2);min-width:48px;letter-spacing:-0.01em}
.input-field{
  flex:1;border:0.5px solid var(--card-border);border-radius:18px;padding:18px 20px;
  font-size:17px;font-weight:500;background:var(--card-bg);color:var(--text);
  outline:none;min-width:0;box-shadow:var(--shadow-sm);
  transition:box-shadow 180ms ease-out,transform 180ms ease-out;letter-spacing:-0.01em;
}
.input-field:focus{box-shadow:0 0 0 4px rgba(0,122,255,0.18),var(--shadow-md);border-color:transparent}
.input-btn{
  font-size:14px;font-weight:600;padding:14px 16px;border:0.5px solid var(--card-border);
  border-radius:18px;cursor:pointer;white-space:nowrap;flex-shrink:0;min-height:48px;
  display:inline-flex;align-items:center;justify-content:center;
  transition:transform 180ms ease-out;background:var(--card-bg);letter-spacing:-0.01em;
}
.input-btn:active{transform:scale(0.95)}
.btn-locate{color:var(--accent);box-shadow:var(--shadow-sm);font-size:18px;padding:14px 16px}
.btn-map{color:var(--text);box-shadow:var(--shadow-sm)}
/* Search field + inline dropdown */
.search-field{position:relative;width:100%}
.search-field input{width:100%;box-sizing:border-box}
.search-dropdown{
  position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:2000;
  background:var(--card-bg);border:0.5px solid var(--card-border);
  border-radius:18px;box-shadow:var(--shadow-lg);overflow:hidden;
  max-height:280px;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.search-dropdown.hidden{display:none}
.search-item{
  display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;
  border-bottom:0.5px solid var(--card-border);font-size:15px;line-height:1.35;
  -webkit-tap-highlight-color:transparent;min-height:56px;
  transition:background 180ms ease-out;
}
.search-item:last-child{border-bottom:none}
.search-item:active,.search-item:hover{background:var(--bg3)}
.search-item--recent{opacity:1}
.search-item--recent .search-item-icon{color:var(--text3)}
.search-item--empty{padding:18px;color:var(--text2);font-size:14px;cursor:default;text-align:center}
.search-item-icon{font-size:20px;flex-shrink:0;width:28px;text-align:center}
.search-item-text{flex:1;min-width:0}
.search-item-text strong{display:block;font-weight:600;font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.01em}
.search-item-text small{color:var(--text2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:2px}
/* MAP — compact, rounded, in padded wrapper (210h, 22r, 16 padding) */
#map{
  width:100%;height:210px;min-height:210px;background:#E5E5EA;position:relative;
  border-radius:22px;overflow:hidden;
}
@media(min-width:600px){#map{height:280px;min-height:280px}}
#map.crosshair .maplibregl-canvas{cursor:crosshair!important}
/* Map labels (legacy — hidden since FAVORITOS_OVERLAY patch) */
.voy-label{display:none}
.voy-label-popup{display:none}
.voy-label-popup .maplibregl-popup-content{padding:0!important;background:transparent!important;box-shadow:none!important;border-radius:0!important}
.voy-label-popup .maplibregl-popup-tip{display:none}
/* MAP HINT — floating pill */
.map-hint{
  display:none;padding:10px 18px;background:var(--card-bg);color:var(--text2);
  font-size:13px;font-weight:500;border-radius:14px;margin:10px 16px 0;
  box-shadow:var(--shadow-sm);letter-spacing:-0.01em;text-align:center;
}
.map-hint.show{display:block}
/* ROUTE CARDS — floating panels */
.cards{flex:1;padding:8px 16px 100px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.route-card{
  background:var(--card-bg);border:0.5px solid var(--card-border);border-radius:22px;
  padding:20px;margin-bottom:16px;box-shadow:var(--shadow-md);position:relative;
  transition:transform 180ms ease-out,box-shadow 180ms ease-out;overflow:hidden;
}
.route-card:active{transform:scale(0.98);box-shadow:var(--shadow-sm)}
.rc-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.rc-icon{font-size:28px;flex-shrink:0}
.rc-title{font-size:20px;font-weight:700;flex:1;letter-spacing:-0.02em;color:var(--text)}
.rc-time{
  font-size:15px;font-weight:700;color:var(--text);background:var(--bg3);
  padding:6px 12px;border-radius:12px;letter-spacing:-0.01em;
}
.rc-subtitle{font-size:15px;color:var(--text2);margin-bottom:14px;white-space:pre-line;line-height:1.5;letter-spacing:-0.01em}
/* Apurate badge for bus card */
.apurate-badge{
  display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:800;
  padding:4px 10px;border-radius:8px;margin-left:8px;letter-spacing:0.02em;
  text-transform:uppercase;animation:pulseApurate 1.2s ease-in-out infinite;vertical-align:middle;
}
@keyframes pulseApurate{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.75;transform:scale(0.96)}}
/* Provider row — Apple card style (PROVIDER_BLOCKS) */
.provider-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:0.5px solid var(--card-border)}
.provider-row ~ .provider-row{padding-top:14px}
.provider-name{font-size:16px;font-weight:600;min-width:80px;color:var(--text);letter-spacing:-0.01em}
.provider-color{width:6px;height:36px;border-radius:3px;flex-shrink:0}
.card-action-row{display:flex;align-items:center;gap:12px;margin-left:auto;flex-shrink:0}
.btn-pedir{
  background:var(--green);color:#fff;border:none;border-radius:18px;padding:0 22px;
  font-size:18px;font-weight:700;cursor:pointer;white-space:nowrap;
  height:60px;min-height:60px;min-width:120px;
  display:inline-flex;align-items:center;justify-content:center;
  transition:transform 180ms ease-out,box-shadow 180ms ease-out;
  box-shadow:0 4px 12px rgba(52,199,89,0.32);letter-spacing:-0.01em;
}
.btn-pedir:active{transform:scale(0.95);box-shadow:0 2px 6px rgba(52,199,89,0.28)}
.card-price{font-size:17px;font-weight:700;color:var(--text);letter-spacing:-0.02em}
/* MAIN_CTA — cheapest provider (first row, sorted asc by JS) becomes full-width green block.
   Uses :not(.provider-row ~ .provider-row) to target the FIRST .provider-row regardless
   of preceding .rc-header / .rc-subtitle divs (which break :first-of-type). */
.route-card[data-mode="auto"] .provider-row:not(.provider-row ~ .provider-row){
  background:linear-gradient(135deg,#34C759 0%,#2BB24C 100%);
  margin:14px -20px -20px;padding:20px 20px 22px;
  border-radius:0 0 22px 22px;border-top:none;position:relative;
}
.route-card[data-mode="auto"] .provider-row:not(.provider-row ~ .provider-row) .provider-name{color:#fff;font-size:20px;font-weight:800;min-width:0;flex:1}
.route-card[data-mode="auto"] .provider-row:not(.provider-row ~ .provider-row) .provider-color{background:rgba(255,255,255,0.45)!important;height:40px}
.route-card[data-mode="auto"] .provider-row:not(.provider-row ~ .provider-row) .card-price{color:#fff;font-size:22px;font-weight:800}
.route-card[data-mode="auto"] .provider-row:not(.provider-row ~ .provider-row) .btn-pedir{
  background:#fff;color:var(--green);height:52px;min-height:52px;
  font-size:18px;font-weight:800;padding:0 22px;box-shadow:0 2px 8px rgba(0,0,0,0.18);
}
.route-card[data-mode="auto"] .provider-row:not(.provider-row ~ .provider-row) .btn-pedir:active{transform:scale(0.95);box-shadow:0 1px 4px rgba(0,0,0,0.15)}
/* Bike action link */
.rc-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.rc-action{
  padding:0 22px;border:none;border-radius:18px;font-size:18px;font-weight:700;
  cursor:pointer;color:#fff;height:60px;min-height:60px;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;flex:1;
  transition:transform 180ms ease-out;letter-spacing:-0.01em;
}
.rc-action:active{transform:scale(0.95)}
.rc-action.bike{background:var(--green);box-shadow:0 4px 12px rgba(52,199,89,0.32)}
/* Footer — glass, sticky bottom, iOS safe-area */
.footer{
  position:fixed;bottom:0;left:0;right:0;background:var(--footer-bg);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  color:var(--text2);font-size:11px;padding:8px 16px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  text-align:center;z-index:100;border-top:0.5px solid var(--card-border);letter-spacing:-0.01em;
}
/* Toast */
.toast-container{
  position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:9999;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
  width:calc(100vw - 32px);max-width:420px;
}
.toast{
  padding:14px 20px;border-radius:18px;font-size:15px;font-weight:600;color:#fff;
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  animation:toastIn 280ms cubic-bezier(0.22,0.61,0.36,1);pointer-events:auto;
  text-align:center;letter-spacing:-0.01em;box-shadow:var(--shadow-lg);
}
.toast.info{background:rgba(0,122,255,0.92)}
.toast.success{background:rgba(52,199,89,0.92)}
.toast.error{background:rgba(255,59,48,0.92)}
.toast.warn{background:rgba(255,149,0,0.92);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
/* Memory block — history, inside floating glass card */
.memory-block{background:transparent;border-bottom:none;display:none;padding:0 0 4px}
.memory-block.show{display:block}
.memory-section{
  background:var(--card-bg);border-radius:18px;padding:14px 16px;margin-bottom:12px;
  box-shadow:var(--shadow-sm);border:0.5px solid var(--card-border);
}
.memory-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.memory-title{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;letter-spacing:-0.01em}
.history-list{max-height:200px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.history-item{
  display:flex;align-items:center;gap:12px;padding:12px 4px;
  border-bottom:0.5px solid var(--card-border);cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background 180ms ease-out,transform 180ms ease-out;
  min-height:52px;
}
.history-item:last-child{border-bottom:none}
.history-item:active{background:var(--bg3);transform:scale(0.99)}
.history-item-icon{font-size:22px;flex-shrink:0;width:32px;text-align:center}
.history-item-text{flex:1;min-width:0}
.history-item-route{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);letter-spacing:-0.01em}
.history-item-time{font-size:12px;color:var(--text2);margin-top:2px}
.history-clear{
  font-size:13px;font-weight:600;color:var(--accent);cursor:pointer;
  padding:8px 14px;border-radius:14px;background:rgba(0,122,255,0.08);border:none;
  -webkit-tap-highlight-color:transparent;min-height:40px;display:inline-flex;align-items:center;
  transition:transform 180ms ease-out,background 180ms ease-out;letter-spacing:-0.01em;
}
.history-clear:active{transform:scale(0.95);background:rgba(0,122,255,0.16)}
.history-clear-confirm{
  font-size:13px;color:#fff;font-weight:700;cursor:pointer;padding:8px 14px;
  border-radius:14px;background:var(--red);border:none;-webkit-tap-highlight-color:transparent;
  min-height:40px;display:inline-flex;align-items:center;transition:transform 180ms ease-out;letter-spacing:-0.01em;
}
.history-clear-confirm:active{transform:scale(0.95)}
/* Center route button — Apple floating control */
#centerRouteBtn{
  font-size:14px!important;font-weight:700!important;padding:12px 16px!important;
  border-radius:16px!important;background:var(--glass-bg-strong)!important;
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:0.5px solid var(--card-border)!important;box-shadow:var(--shadow-md)!important;
  color:var(--text)!important;letter-spacing:-0.01em;transition:transform 180ms ease-out;
}
#centerRouteBtn:active{transform:scale(0.95)}
</style>
</head>
<body data-theme="light">

<!-- HEADER -->
<div class="header">
  <h1>VOY</h1>
  <div class="gps-status" id="gpsStatus">📍❌</div>
</div>

<!-- INPUTS -->
<div class="inputs">
  <div class="input-row">
    <div class="dot green"></div>
    <span class="input-label">Origen</span>
    <div class="search-field">
      <input type="text" id="originInput" class="input-field" placeholder="¿Desde dónde salís?" autocomplete="off" autocorrect="off" spellcheck="false" oninput="onSearchInput(this.value,'origin')" onfocus="onSearchFocus('origin')">
      <div id="originDropdown" class="search-dropdown hidden"></div>
    </div>
    <button class="input-btn btn-locate" onclick="locateMe()">📍</button>
    <button class="input-btn btn-map" onclick="activateMapOrigin()">📌 Elegir</button>
  </div>
  <div class="input-row">
    <div class="dot red"></div>
    <span class="input-label">Destino</span>

      <div id="destDropdown" class="search-dropdown hidden"></div>
    </div>
    <button class="input-btn btn-map" onclick="activateMapDest()">📌 Elegir</button>
  </div>
</div>

<!-- MEMORY BLOCK: history only (favorites removed in VOY Lite) -->
<div class="memory-block" id="memoryBlock">
  <div class="memory-section" id="memHistory" style="display:none">
    <div class="memory-header">
      <span class="memory-title">🕐 Recientes</span>
      <span id="historyClearBtn" class="history-clear" onclick="confirmClearHistory()">Borrar</span>

    <div class="history-list" id="historyList"></div>
  </div>
</div>

<!-- MAP — compact, padded wrapper (16px), radius 22px on map -->
<div style="position:relative;padding:0 16px">

  </div>
</div>

<!-- MAP HINT -->
<div class="map-hint" id="mapHint">🗺️ Ruta en mapa · Arrastrá para cambiar</div>

<!-- ROUTE CARDS -->
<div class="cards" id="cardsContainer"></div>

<!-- FOOTER -->
<div class="footer">VOY Lite · Asistente de movilidad Santa Fe · Datos informativos</div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toastContainer"></div>

<!-- ANALYTICS DASHBOARD (hidden, 5 taps on header) -->
<div id="vaDash"></div>

var _VA_KEY='voy_va';

var _VA_GRID=0.0072; // ~800m geo cluster
var _vaS={o:0,os:'n',dt:0,dn:'',dc:'',ct:0,ms:'',cm:'',ct2:0,x:0}; // current session

function _vaCluster(lat,lon){return(lat/_VA_GRID).toFixed(0)+'_'+(lon/_VA_GRID).toFixed(0)}

function va_open(){
  _vaS={o:Date.now(),os:'n',dt:0,dn:'',dc:'',ct:0,ms:'',cm:'',ct2:0,x:0};
}

function va_origin(src){
  if(!_vaS.o)return;
  var m={gps:'g',cache:'c',map:'m',search:'s'};
  _vaS.os=m[src]||'n';
}

function va_dest(name,lat,lon){
  if(!_vaS.o||_vaS.dt)return; // solo primer destino por sesión
  _vaS.dt=Date.now();
  _vaS.dn=(name||'').substring(0,25);
  _vaS.dc=_vaCluster(lat,lon);
}

function va_cards(modes){
  if(!_vaS.o)return;
  if(!_vaS.ct)_vaS.ct=Date.now();
  var modeMap={bus:'b',bike:'i',auto:'a'};
  _vaS.ms=(modes||[]).map(function(e){return modeMap[e]||'?'}).join(',');
}

function va_cta(mode){
  if(!_vaS.o)return;
  _vaS.cm=mode||'';
  _vaS.ct2=Date.now();
}

function va_close(){
  if(!_vaS.o)return;
  _vaS.x=Date.now();
  if(_vaS.x-_vaS.o<500)return; // descarta bounces <500ms
  try{
    var raw=localStorage.getItem(_VA_KEY);
    var arr=raw?JSON.parse(raw):[];
    if(!Array.isArray(arr))arr=[];
    arr.push(_vaS);
    if(arr.length>_VA_MAX)arr=arr.slice(arr.length-_VA_MAX);
    localStorage.setItem(_VA_KEY,JSON.stringify(arr));
  }catch(e){}
}

function va_load(){
  try{var r=localStorage.getItem(_VA_KEY);return r?JSON.parse(r):[]}catch(e){return[]}
}

function va_metrics(){
  var s=va_load();
  var n=s.length;
  if(!n)return{total:0};
  var m={total:n,ctaRate:0,abandonRate:0,avgToCTA:0,avgDecision:0,topDest:[],providerWins:{},deadCards:{}};
  var ctaCount=0,abandonCount=0,sumToCTA=0,sumDecision=0;
  var destCounts={},provCounts={},modeShown={},modeChosen={};
  s.forEach(function(r){
    if(!r.dt)abandonCount++;
    if(r.ct2>0){ctaCount++;if(r.ct2>r.o)sumToCTA+=r.ct2-r.o;if(r.ct2>r.ct&&r.ct>0)sumDecision+=r.ct2-r.ct}
    if(r.cm)provCounts[r.cm]=(provCounts[r.cm]||0)+1;
    if(r.dc){var dk=r.dc+(r.dn?'|'+r.dn:'');destCounts[dk]=(destCounts[dk]||0)+1}
    if(r.ms){r.ms.split(',').forEach(function(c){modeShown[c]=(modeShown[c]||0)+1})}
    if(r.cm){var ck={uber:'a',didi:'a',maxim:'a',taxi:'a',remis:'a',taxiapp:'a',bus:'b',bike:'i'}[r.cm]||'?';modeChosen[ck]=(modeChosen[ck]||0)+1}
  });
  m.ctaRate=ctaCount/n;m.abandonRate=abandonCount/n;
  if(ctaCount){m.avgToCTA=Math.round(sumToCTA/ctaCount);m.avgDecision=Math.round(sumDecision/ctaCount)}
  var sorted=Object.keys(destCounts).sort(function(a,b){return destCounts[b]-destCounts[a]});
  m.topDest=sorted.slice(0,5).map(function(k){return{name:k.split('|')[1]||k.split('|')[0],count:destCounts[k]}});
  m.providerWins=provCounts;
  var modeNames={b:'Colectivo',i:'Bicicleta',a:'Auto'};
  Object.keys(modeShown).forEach(function(k){if(!modeChosen[k]&&modeShown[k]>=2)m.deadCards[modeNames[k]||k]=modeShown[k]});
  return m;
}

// ===================== GPS: silent, cache, retry =====================
var _gpsRetryCount=0;
var _gpsMaxRetries=3;
var _gpsRetryTimer=null;

// GPS_REFRESH: debounce 3s + 30m minimum movement to avoid UI recompute storms
var _gpsLastUpdate=0;
var _gpsLastLat=null;
var _gpsLastLon=null;
var GPS_DEBOUNCE_MS=3000;
var GPS_MIN_MOVE_M=30;

function _haversineMeters(lat1,lon1,lat2,lon2){
  var R=6371000;
  var dLat=(lat2-lat1)*Math.PI/180;
  var dLon=(lon2-lon1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+
    Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
    Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function _handleGpsPosition(lat,lon){
  if(MC.isOriginManual())return;
  var origin=MC.getOrigin();
  if(origin&&origin.source!=='gps'&&origin.source!=='cache')return;
  var now=Date.now();
  // Debounce: skip if updated <3s ago
  if(_gpsLastUpdate && now-_gpsLastUpdate< GPS_DEBOUNCE_MS)return;
  // Hysteresis: skip if moved <30m from last accepted fix
  if(_gpsLastLat!=null){
    var dist=_haversineMeters(_gpsLastLat,_gpsLastLon,lat,lon);
    if(dist< GPS_MIN_MOVE_M)return;
  }
  _gpsLastUpdate=now;
  _gpsLastLat=lat;
  _gpsLastLon=lon;
  MC.setOrigin(lat,lon,'Mi ubicación','gps');
  va_origin('gps');
  updateOriginUI();
  updateMapMarkers();
  // AUTO_GPS: reverse-geocode so the origin input shows a real address (zero taps).
  reverseGeocodeOrigin(lat,lon);
  if(MC.getDest())runEstimations();
}

// GPS_PERMISSION: use Permissions API when available to react to state changes.
// AUTO_GPS: first launch auto-requests permission via watchPosition (zero taps).
function initGPS(){
  if(!navigator.geolocation){updateGPSStatus(false);loadCachedPosition();return}
  if(navigator.permissions&&navigator.permissions.query){
    navigator.permissions.query({name:'geolocation'}).then(function(status){
      _onGpsPermissionChange(status);
      status.onchange=function(){_onGpsPermissionChange(status)};
    }).catch(function(){_startGpsWatch()}); // Permissions API unavailable → fall back to direct watch
  }else{
    _startGpsWatch();
  }
}

function _onGpsPermissionChange(status){
  if(status.state==='denied'){
    // GPS_PERMISSION: denied → graceful fallback, no retries, no errors.
    _stopGpsWatch();
    updateGPSStatus(false);
    loadCachedPosition();
    return;
  }
  // 'granted' or 'prompt' → start watch. 'prompt' triggers the native permission dialog.
  _startGpsWatch();
}

function _startGpsWatch(){
  // AUTO_GPS: no duplicate GPS requests.
  if(_gpsWatch!==null)return;
  _gpsWatch=navigator.geolocation.watchPosition(function(pos){
    _gpsRetryCount=0;
    updateGPSStatus(true);
    cachePosition(pos.coords.latitude,pos.coords.longitude);
    _handleGpsPosition(pos.coords.latitude,pos.coords.longitude);
  },function(err){
    updateGPSStatus(false);
    loadCachedPosition();
    // GPS_PERMISSION: if user denied, do NOT retry (pointless + battery drain).
    if(err.code===err.PERMISSION_DENIED){return}
    if(_gpsRetryCount<_gpsMaxRetries){
      _gpsRetryCount++;
      clearTimeout(_gpsRetryTimer);
      _gpsRetryTimer=setTimeout(function(){
        navigator.geolocation.getCurrentPosition(function(pos){
          _gpsRetryCount=0;
          updateGPSStatus(true);
          cachePosition(pos.coords.latitude,pos.coords.longitude);
          _handleGpsPosition(pos.coords.latitude,pos.coords.longitude);
        },function(){},{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
      },_gpsRetryCount*5000);
    }
  },{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
}

function _stopGpsWatch(){
  if(_gpsWatch!==null){
    navigator.geolocation.clearWatch(_gpsWatch);
    _gpsWatch=null;
  }
}

function updateGPSStatus(ok){
  var el=document.getElementById('gpsStatus');
  if(el)el.textContent=ok?'📍🟢':'📍❌';
}

function cachePosition(lat,lon){
  try{localStorage.setItem('voy_last_pos',JSON.stringify({lat:lat,lon:lon}))}catch(e){}
}

function loadCachedPosition(){
  try{
    var cached=localStorage.getItem('voy_last_pos');
    if(cached){
      var pos=JSON.parse(cached);
      if(!MC.getOrigin()){
        MC.setOrigin(pos.lat,pos.lon,'Ubicación guardada','cache');
        va_origin('cache');
        updateOriginUI();
        updateMapMarkers();
      }
    }
  }catch(e){}
}

function locateMe(){
  if(!navigator.geolocation){return}
  navigator.geolocation.getCurrentPosition(function(pos){
    MC.setOriginManual(false);
    MC.setOrigin(pos.coords.latitude,pos.coords.longitude,'Mi ubicación','gps');
    va_origin('gps');
    cachePosition(pos.coords.latitude,pos.coords.longitude);
    updateOriginUI();
    updateMapMarkers();
    var origin=MC.getOrigin();
    if(_map)_map.flyTo({center:[origin.lon,origin.lat],zoom:15});
    if(MC.getDest())runEstimations();
  },function(){
    loadCachedPosition();
  },{enableHighAccuracy:true,timeout:10000});

// ===================== MAP MARKERS =====================
function updateMapMarkers(){
  if(!_map)return;
  var origin=MC.getOrigin();
  var dest=MC.getDest();

  if(_originMarker){_originMarker.remove();_originMarker=null}
  if(_destMarker){_destMarker.remove();_destMarker=null}
  // FAVORITOS_OVERLAY: no popups/labels on map; only real markers.
  if(_originPopup){_originPopup.remove();_originPopup=null}
  if(_destPopup){_destPopup.remove();_destPopup=null}

  if(origin){
    var el=document.createElement('div');
    el.style.cssText='width:18px;height:18px;background:#16a34a;border:3px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.5)';
    _originMarker=new maplibregl.Marker({element:el}).setLngLat([origin.lon,origin.lat]).addTo(_map);
  }
  if(dest){
    var el2=document.createElement('div');
    el2.style.cssText='width:18px;height:18px;background:#dc2626;border:3px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.5)';
    _destMarker=new maplibregl.Marker({element:el2}).setLngLat([dest.lon,dest.lat]).addTo(_map);
  }

  // MAP_STATE: do NOT auto-center; only update markers + route line.
  // User retains zoom/position. Explicit centering via centerRoute() / locateMe().
  drawRouteLine();

  var cBtn=document.getElementById('centerRouteBtn');
  if(cBtn)cBtn.style.display=(origin&&dest)?'block':'none';
}

function drawRouteLine(){
  if(!_map)return;
  var origin=MC.getOrigin();
  var dest=MC.getDest();
  if(!origin||!dest)return;
  if(_map.getSource('route-src')){
    if(_map.getLayer('route-shadow'))_map.removeLayer('route-shadow');
    if(_map.getLayer('route-line'))_map.removeLayer('route-line');
    _map.removeSource('route-src');
  }
  var geojson={
    type:'Feature',
    geometry:{type:'LineString',coordinates:[[origin.lon,origin.lat],[dest.lon,dest.lat]]}
  };
  _map.addSource('route-src',{type:'geojson',data:geojson});
  _map.addLayer({id:'route-shadow',type:'line',source:'route-src',layout:{'line-cap':'round'},paint:{'line-color':'#2563eb','line-width':10,'line-opacity':0.15}});
  _map.addLayer({id:'route-line',type:'line',source:'route-src',layout:{'line-cap':'round'},paint:{'line-color':'#2563eb','line-width':4,'line-opacity':0.8}});
}

function centerRoute(){
  if(!_map)return;
  var origin=MC.getOrigin();
  var dest=MC.getDest();
  if(!origin||!dest)return;
  var bounds=new maplibregl.LngLatBounds();
  bounds.extend([origin.lon,origin.lat]);
  bounds.extend([dest.lon,dest.lat]);
  _map.fitBounds(bounds,{padding:40,maxZoom:16,duration:600});
}

function getProviderIcon(provider,mode){
  if(mode==='bus'||provider==='colectivo')return '🚌';
  if(provider==='uber')return '🚗';
  if(provider==='didi')return '🟠';
  if(provider==='maxim')return '🟣';
  if(provider==='taxi'||provider==='radiotaxi')return '🚕';
  if(provider==='remis')return '🚙';
  if(provider==='taxiapp')return '📱';
  if(mode==='bike')return '🚲';
  if(mode==='auto')return '🚗';
  return '📍';
}

function formatRelativeTime(ts){
  var now=Date.now();
  var diff=now-ts;
  var seconds=Math.floor(diff/1000);
  if(seconds<60)return 'hace un momento';
  var minutes=Math.floor(seconds/60);
  if(minutes<60)return 'hace '+minutes+' min';
  var hours=Math.floor(minutes/60);
  if(hours<24)return 'hace '+hours+' h';
  var days=Math.floor(hours/24);
  if(days===1)return 'ayer';
  if(days<7)return 'hace '+days+' días';
  var d=new Date(ts);
  return d.getDate()+'/'+(d.getMonth()+1);
}

  if(!results.length){

  }

  results.forEach(function(r){

    var displayName=r.display_name||r.display||r.name||'';
    var name=displayName.split(',')[0];
    var sub=displayName.split(',').slice(1,3).join(',').trim();
    var icon=r.type==='bus'?'🚌':r.type==='bike'?'🚲':'📍';

function selectSearchResult(field,lat,lon,name){
  if(field==='origin'){
    MC.setOriginManual(true);
    MC.setOrigin(lat,lon,name,'search');
    va_origin('search');
    document.getElementById('originInput').value=name.split(',')[0];

    MC.setDest(lat,lon,name,'search');
    va_dest(name,lat,lon);
    document.getElementById('destInput').value=name.split(',')[0];
    updateMapMarkers();
    if(MC.getOrigin())runEstimations();
  }
  closeAllDropdowns();

function closeAllDropdowns(){
  document.querySelectorAll('.search-dropdown').forEach(function(d){d.classList.add('hidden')});
}

async function onSearchInput(val,field){
  MC.setSearchTimer(null);
  var id=field==='origin'?'originDropdown':'destDropdown';
  var dropdown=document.getElementById(id);

  if(!val||val.trim().length<2){
    dropdown.classList.add('hidden');
    if(!val||val.trim().length===0){
      if(field==='origin'){
        var origin=MC.getOrigin();
        if(origin&&origin.source!=='gps'&&origin.source!=='cache'){
          MC.clearOrigin();
          renderCards();
          updateMapMarkers();
        }
      }else{
        MC.clearDest();
        renderCards();
        updateMapMarkers();
      }
      var recent=MC.getRecentSearches();
      if(recent.length){
        renderSearchDropdown(
          recent.slice(0,3).map(function(r){return{lat:r.lat,lon:r.lon,display_name:r.display||r.name}}),
          field,true
        );
      }
    }
    return;
  }

  var version=++_searchVersion;
  var timer=setTimeout(async function(){
    var results=await MC.searchNominatim(val.trim());
    if(version!==_searchVersion){
      return; // stale response
    }
    renderSearchDropdown(results,field,false);
  },400);
  MC.setSearchTimer(timer);
}

function onSearchFocus(field){
  var inputId=field==='origin'?'originInput':'destInput';
  var input=document.getElementById(inputId);
  if(!input||input.value.trim().length>=2)return;
  var recent=MC.getRecentSearches();
  if(recent.length){
    renderSearchDropdown(
      recent.slice(0,3).map(function(r){return{lat:r.lat,lon:r.lon,display_name:r.display||r.name}}),
      field,true
    );
  }
}

function renderProviderRow(key,name,price,colorKey,timeOverride,waLink){
  var provider=PROVIDERS[key];
  if(!provider||!provider.available)return'';
  var color=provider.color||'#666';
  var t=timeOverride?formatMin(timeOverride):'';
  var url='';
  if(key==='uber')url=buildUberLink();
  else if(key==='didi')url=buildDiDiLink();
  else if(key==='maxim')url=buildMaximLink();
  else if(waLink)url=waLink;

  var h='<div class="provider-row">';
  h+='<div class="provider-color" style="background:'+color+'"></div>';
  h+='<span class="provider-name">'+name+'</span>';
  h+='<div class="card-action-row">';
  if(url){
    h+='<button class="btn-pedir" data-action="'+key+'" data-url="'+url+'">Pedir</button>';

  if(t)h+='<span class="rc-time" style="margin-left:4px">'+t+'</span>';
  h+='</div></div>';

function buildUberLink(){

}

function buildDiDiLink(){
  var origin=MC.getOrigin();
  var dest=MC.getDest();
  if(!origin||!dest)return '#';
  return 'https://web.didiglobal.com/ar/passenger/ride/?pickup_lat='+origin.lat+'&pickup_lng='+origin.lon+
    '&dropoff_lat='+dest.lat+'&dropoff_lng='+dest.lon;
}

function buildMaximLink(){
  var origin=MC.getOrigin();
  var dest=MC.getDest();
  if(!origin||!dest||!origin.lat||!dest.lat)return 'https://taximaxim.com/ar/';
  var isAndroid=/Android/i.test(navigator.userAgent);
  var isIOS=/iPhone|iPad/i.test(navigator.userAgent);
  if(isAndroid){
    var playStore='https://play.google.com/store/apps/details?id=com.taxsee.taxsee';
    return 'intent://order?'+
      'startLat='+Number(origin.lat).toFixed(6)+
      '&startLon='+Number(origin.lon).toFixed(6)+
      '&finishLat='+Number(dest.lat).toFixed(6)+
      '&finishLon='+Number(dest.lon).toFixed(6)+
      '#Intent'+
      ';scheme=taxsee'+
      ';package=com.taxsee.taxsee'+
      ';S.browser_fallback_url='+encodeURIComponent(playStore)+
      ';end';
  }
  if(isIOS){
    return 'https://apps.apple.com/app/maxim/id893663029';
  }
  return 'https://taximaxim.com/ar/';
}

function buildBikeLink(){
  var isAndroid=/Android/i.test(navigator.userAgent);
  if(isAndroid)return 'intent://#Intent;scheme=lasbicis;package=com.santafe.lasbicis;end';
  var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
  if(isIOS)return 'https://apps.apple.com/ar/app/id6444962582';
  return 'https://www.santafe.gob.ar/index.php/educacionycultura/content/download/55027/283898/file/Las%20Bicis.pdf';
}

// ===================== DOUBLE TAP TO CONFIRM =====================
var _confirmState={};
function requestRide(mode,url){
  var now=Date.now();
  var last=_confirmState[mode]||0;
  var DOUBLE_TAP_MS=2000;
  if(now-last<DOUBLE_TAP_MS){
    _confirmState[mode]=0;
    va_cta(mode);
    // MAXIM_ANDROID: intent:// URLs must use location.href (not window.open)
    // so Android resolves the intent. The intent's S.browser_fallback_url
    // handles the Play Store fallback; taximaxim.com is the final web fallback.
    if(url && url.indexOf('intent://')===0){
      window.location.href=url;
    }else{
      window.open(url,'_blank');
    }
    saveTripToHistory(mode);
  }else{
    _confirmState[mode]=now;
    showToast('Tocá de nuevo para confirmar','info');
    setTimeout(function(){_confirmState[mode]=0},DOUBLE_TAP_MS+100);
  }
}

}

function updateOriginUI(){
  var origin=MC.getOrigin();
  var el=document.getElementById('originInput');
  if(el)el.value=origin?origin.name:'';
}

function updateDestUI(){
  var dest=MC.getDest();
  var el=document.getElementById('destInput');
  if(el)el.value=dest?dest.name:'';
}

// ===================== TOAST =====================
function showToast(msg,type){
  type=type||'info';
  var container=document.getElementById('toastContainer');
  if(!container)return;
  var el=document.createElement('div');
  el.className='toast '+type;
  el.textContent=msg;
  container.appendChild(el);
  setTimeout(function(){
    el.style.opacity='0';
    el.style.transition='opacity .3s';
    setTimeout(function(){if(el.parentNode)el.remove()},300);
  },2500);
}
</script>

<style>
:root{
  --bg:#f5f5f5;--bg2:#fff;--bg3:#e8e8e8;--text:#1a1a1a;--text2:#555;--accent:#2563eb;
  --green:#16a34a;--red:#dc2626;--orange:#f97316;--purple:#8b5cf6;--card-bg:#fff;
  --card-border:#e5e5e5;--shadow:0 1px 3px rgba(0,0,0,.1);--radius:12px;
  --header-bg:#1e293b;--footer-bg:#1e293b;
}
[data-theme="dark"]{
  --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--text:#e2e8f0;--text2:#94a3b8;
  --card-bg:#1e293b;--card-border:#334155;--shadow:0 1px 3px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100dvh;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
/* HEADER */
.header{background:var(--header-bg);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100}
.header h1{font-size:20px;font-weight:800;letter-spacing:1px;flex:1}
.header .gps-status{font-size:12px;display:flex;align-items:center;gap:2px}
.header .weather{font-size:14px;cursor:pointer}
/* INPUTS */
.inputs{background:var(--bg2);padding:10px 12px;border-bottom:1px solid var(--card-border)}
.input-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;position:relative}
.input-row:last-child{margin-bottom:0}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.dot.green{background:var(--green)}.dot.red{background:var(--red)}
.input-label{font-size:11px;color:var(--text2);min-width:44px}
.input-field{flex:1;border:1px solid var(--card-border);border-radius:6px;padding:4px 8px;font-size:13px;background:var(--bg);color:var(--text);outline:none;min-width:0}
.input-field:focus{border-color:var(--accent)}
.input-btn{font-size:10px;padding:4px 6px;border:none;border-radius:6px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.btn-locate{background:#dbeafe;color:#1d4ed8}
.btn-map{background:#fef3c7;color:#92400e}
/* Autocomplete dropdown */
.ac-dropdown{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg2);border:1px solid var(--card-border);border-top:none;border-radius:0 0 8px 8px;z-index:50;max-height:150px;overflow-y:auto;box-shadow:var(--shadow)}
.ac-dropdown.show{display:block}
.ac-item{padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--card-border)}
.ac-item:last-child{border-bottom:none}
.ac-item:active{background:var(--bg3)}
.ac-item small{color:var(--text2);font-size:11px;display:block;margin-top:2px}
/* MAP - height fija para mobile (MapLibre requiere height>0 al init) */
#map{width:100%;height:220px;min-height:160px;background:#e8e0d8;position:relative}
@media(min-width:600px){#map{height:320px}}
#map.crosshair .maplibregl-canvas{cursor:crosshair!important}
/* Map floating labels */
.voy-label{font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis;line-height:1.3;pointer-events:none}
.voy-label--green{background:#16a34a;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.voy-label--red{background:#dc2626;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.voy-label-popup .maplibregl-popup-content{padding:0!important;background:transparent!important;box-shadow:none!important;border-radius:0!important}
.voy-label-popup .maplibregl-popup-tip{display:none}
.voy-label--amber{background:#f59e0b;color:#1a1a1a;box-shadow:0 1px 4px rgba(0,0,0,.3)}
/* MAP HINT */
.map-hint{display:none;padding:6px 12px;background:#eff6ff;color:#1d4ed8;font-size:12px;border-bottom:1px solid #bfdbfe}
.map-hint.show{display:block}
/* ROUTE CARDS */
.cards{flex:1;padding:8px 12px;overflow-y:auto;padding-bottom:80px}
.route-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:12px;margin-bottom:8px;box-shadow:var(--shadow);position:relative;transition:transform .15s}
.route-card.dragging{opacity:.6;transform:scale(.97)}
.route-card.drag-over{border-top:3px solid var(--accent)}
.rc-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rc-icon{font-size:20px}
.rc-title{font-size:14px;font-weight:700;flex:1}
.rc-time{font-size:12px;color:var(--text2)}
.rc-subtitle{font-size:13px;color:var(--text2);margin-bottom:6px;white-space:pre-line;line-height:1.5}
/* Provider row */
.provider-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--card-border)}
.provider-name{font-size:12px;font-weight:600;min-width:70px}
.provider-color{width:4px;height:24px;border-radius:2px;flex-shrink:0}
.card-action-row{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.btn-pedir{background:var(--green);color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:44px}
.btn-pedir:active{transform:scale(.95)}
.card-price{font-size:14px;font-weight:700}
/* Action buttons in cards */
.rc-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rc-action{padding:6px 12px;border:none;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;color:#fff;min-height:44px}
.rc-action.uber{background:#000}.rc-action.didi{background:var(--orange)}
.rc-action.maxim{background:var(--purple)}.rc-action.radiotaxi{background:#d97706}
.rc-action.remis{background:#6b7280}.rc-action.taxiapp{background:#25d366}
.rc-action.moto-uber{background:#000}.rc-action.moto-didi{background:var(--orange)}
.rc-action.moto-maxim{background:var(--purple)}.rc-action.moto-taxi{background:#d97706}
.rc-action.moto-remis{background:#6b7280}.rc-action.moto-taxiapp{background:#25d366}
.rc-action.bike{background:var(--green)}.rc-action.bus{background:#2563eb}
.rc-action.walk{background:var(--green)}
/* Unavailable cards */
.route-card--unavailable{opacity:.45;filter:grayscale(.6);pointer-events:none}
.unavailable-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2}
.unavailable-overlay span{background:#dc2626;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px;letter-spacing:.5px}
.unavailable-summary{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12px;color:var(--text2);opacity:.6;border-top:1px solid var(--card-border);margin-top:4px}
.unavailable-summary span{margin-left:auto;font-size:11px}
/* Footer */
.footer{position:fixed;bottom:0;left:0;right:0;background:var(--footer-bg);color:#94a3b8;font-size:10px;padding:6px 12px;text-align:center;z-index:100}
/* Toast */
.toast-container{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;color:#fff;animation:toastIn .3s ease;pointer-events:auto;max-width:90vw;text-align:center}
.toast.info{background:#2563eb}.toast.success{background:var(--green)}.toast.error{background:var(--red)}.toast.warn{background:#f59e0b;color:#1a1a1a}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
/* Drag handle */
.drag-handle{position:absolute;top:4px;right:8px;font-size:16px;cursor:grab;color:var(--text2);opacity:.4}
.drag-handle:active{cursor:grabbing}
</style>

  sources:{

function initMap(){

function initDarkMode(){

}

// ===================== GPS: silent, cache, retry =====================
var _gpsRetryCount=0;
var _gpsMaxRetries=3;
var _gpsRetryTimer=null;

function initGPS(){
  if(!navigator.geolocation){updateGPSStatus(false);loadCachedPosition();return}
  _gpsWatch=navigator.geolocation.watchPosition(function(pos){
    _gpsRetryCount=0;
    updateGPSStatus(true);
    cachePosition(pos.coords.latitude,pos.coords.longitude);
    if(!_originManual&&(!_origin||_origin.source==='gps'||_origin.source==='cache')){
      _origin={lat:pos.coords.latitude,lon:pos.coords.longitude,name:'Mi ubicación',source:'gps'};
      updateOriginUI();
      updateMapMarkers();
      if(_dest)runEstimations();
    }
  },function(err){
    updateGPSStatus(false);
    loadCachedPosition();
    // Silent retry with backoff
    if(_gpsRetryCount<_gpsMaxRetries){
      _gpsRetryCount++;
      clearTimeout(_gpsRetryTimer);
      _gpsRetryTimer=setTimeout(function(){
        navigator.geolocation.getCurrentPosition(function(pos){
          _gpsRetryCount=0;
          updateGPSStatus(true);
          cachePosition(pos.coords.latitude,pos.coords.longitude);
          if(!_originManual&&(!_origin||_origin.source==='gps'||_origin.source==='cache')){
            _origin={lat:pos.coords.latitude,lon:pos.coords.longitude,name:'Mi ubicación',source:'gps'};
            updateOriginUI();
            updateMapMarkers();
            if(_dest)runEstimations();
          }
        },function(){},{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
      },_gpsRetryCount*5000);
    }
  },{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
}

function updateGPSStatus(ok){
  var el=document.getElementById('gpsStatus');
  el.textContent=ok?'📍🟢':'📍❌';
}

function cachePosition(lat,lon){
  try{localStorage.setItem('voy_last_pos',JSON.stringify({lat:lat,lon:lon}))}catch(e){}
}

function loadCachedPosition(){
  try{
    var cached=localStorage.getItem('voy_last_pos');
    if(cached){
      var pos=JSON.parse(cached);
      if(!_origin){
        _origin={lat:pos.lat,lon:pos.lon,name:'Ubicación guardada',source:'cache'};
        updateOriginUI();
        updateMapMarkers();
      }
    }
  }catch(e){}
}

function locateMe(){
  if(!navigator.geolocation){return}
  navigator.geolocation.getCurrentPosition(function(pos){
    _originManual=false;
    _origin={lat:pos.coords.latitude,lon:pos.coords.longitude,name:'Mi ubicación',source:'gps'};
    cachePosition(pos.coords.latitude,pos.coords.longitude);
    updateOriginUI();
    updateMapMarkers();
    _map.flyTo({center:[_origin.lon,_origin.lat],zoom:15});
    if(_dest)runEstimations();
  },function(){
    // FIX 11: silent fallback, no emotional messages
    loadCachedPosition();
  },{enableHighAccuracy:true,timeout:10000});
}

// ===================== BUS ROUTE OVERLAY =====================
function drawBusRoute(est){
  if(!est||!est.stopOrigen||!_origin||!_dest)return;

  // Remove normal route line first
  if(_map.getSource('route-src')){
    if(_map.getLayer('route-shadow'))_map.removeLayer('route-shadow');
    if(_map.getLayer('route-line'))_map.removeLayer('route-line');
    _map.removeSource('route-src');
  }

  // Build segment coordinates
  var walkSegs=[];
  var rideSegs=[];
  var transSegs=[];

  if(est.combination){
    // Guard: stopTransbordo2 puede no existir en datos legacy
    if(!est.stopTransbordo2) est.stopTransbordo2 = est.stopTransbordo;
    // 5 segments: walk→ride1→trans→ride2→walk
    walkSegs.push([[_origin.lon,_origin.lat],[est.stopOrigen.lon,est.stopOrigen.lat]]);
    rideSegs.push([[est.stopOrigen.lon,est.stopOrigen.lat],[est.stopTransbordo.lon,est.stopTransbordo.lat]]);
    transSegs.push([[est.stopTransbordo.lon,est.stopTransbordo.lat],[est.stopTransbordo2.lon,est.stopTransbordo2.lat]]);
    rideSegs.push([[est.stopTransbordo2.lon,est.stopTransbordo2.lat],[est.stopDest.lon,est.stopDest.lat]]);
    walkSegs.push([[est.stopDest.lon,est.stopDest.lat],[_dest.lon,_dest.lat]]);
  }else{
    // 3 segments: walk→ride→walk
    walkSegs.push([[_origin.lon,_origin.lat],[est.stopOrigen.lon,est.stopOrigen.lat]]);
    rideSegs.push([[est.stopOrigen.lon,est.stopOrigen.lat],[est.stopDest.lon,est.stopDest.lat]]);
    walkSegs.push([[est.stopDest.lon,est.stopDest.lat],[_dest.lon,_dest.lat]]);
  }

  // Add walk segments (green dashed)
  if(walkSegs.length){
    _map.addSource('bus-walk-src',{type:'geojson',data:{type:'Feature',geometry:{type:'MultiLineString',coordinates:walkSegs}}});
    _map.addLayer({id:'bus-walk-line',type:'line',source:'bus-walk-src',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#22c55e','line-width':3,'line-opacity':0.75,'line-dasharray':[2,2]}});
  }

  // Add ride segments (blue solid + shadow)
  if(rideSegs.length){
    _map.addSource('bus-ride-src',{type:'geojson',data:{type:'Feature',geometry:{type:'MultiLineString',coordinates:rideSegs}}});
    _map.addLayer({id:'bus-ride-shadow',type:'line',source:'bus-ride-src',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#2563eb','line-width':10,'line-opacity':0.15}});
    _map.addLayer({id:'bus-ride-line',type:'line',source:'bus-ride-src',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#2563eb','line-width':4,'line-opacity':0.9}});
  }

  // Add transfer segment (orange dashed)
  if(transSegs.length){
    _map.addSource('bus-trans-src',{type:'geojson',data:{type:'Feature',geometry:{type:'MultiLineString',coordinates:transSegs}}});
    _map.addLayer({id:'bus-trans-line',type:'line',source:'bus-trans-src',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#f59e0b','line-width':3,'line-opacity':0.8,'line-dasharray':[3,2]}});
  }

  // Add stop markers
  var stops=[];
  stops.push({point:est.stopOrigen,label:'Subida'});
  stops.push({point:est.stopDest,label:'Bajada'});
  if(est.combination && est.stopTransbordo){
    stops.push({point:est.stopTransbordo,label:'Bajada transbordo'});
    stops.push({point:est.stopTransbordo2||est.stopTransbordo,label:'Subida transbordo'});
  }

  stops.forEach(function(s){
    var el=document.createElement('div');
    el.style.cssText='width:12px;height:12px;background:#f59e0b;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.4)';
    var marker=new maplibregl.Marker({element:el}).setLngLat([s.point.lon,s.point.lat]).addTo(_map);
    _busStopMarkers.push(marker);
    var popup=new maplibregl.Popup({closeButton:false,closeOnClick:false,offset:14,anchor:'bottom',className:'voy-label-popup'})
      .setLngLat([s.point.lon,s.point.lat])
      .setHTML('<div class="voy-label voy-label--amber">'+escapeHtml(s.point.nombre)+' · '+s.label+'</div>')
      .addTo(_map);
    _busStopPopups.push(popup);
  });

  // Fit bounds to include all stops + origin/dest
  var bounds=new maplibregl.LngLatBounds();
  bounds.extend([_origin.lon,_origin.lat]);
  bounds.extend([_dest.lon,_dest.lat]);
  stops.forEach(function(s){bounds.extend([s.point.lon,s.point.lat])});
  _map.fitBounds(bounds,{padding:40,maxZoom:16,duration:600});
}

function clearBusRoute(){
  // Remove bus route sources/layers
  ['bus-walk-line'].forEach(function(id){if(_map.getLayer(id))_map.removeLayer(id)});

  ['bus-trans-line'].forEach(function(id){if(_map.getLayer(id))_map.removeLayer(id)});
  ['bus-walk-src','bus-ride-src','bus-trans-src'].forEach(function(id){if(_map.getSource(id))_map.removeSource(id)});

  // Remove stop markers & popups
  _busStopMarkers.forEach(function(m){m.remove()});
  _busStopPopups.forEach(function(p){p.remove()});
  _busStopMarkers=[];
  _busStopPopups=[];

  _busRouteActive=false;
  _busRouteIdx=-1;
}

function toggleBusRoute(idx){
  if(!_estimations||!_estimations[idx])return;

  if(_busRouteActive&&_busRouteIdx===idx){

    clearBusRoute();

}

function searchPlaces(q,field){
  var now=Date.now();
  if(now-_lastSearchTime<1100)return;
  _lastSearchTime=now;

  // FIX 6: fuzzy search local data
  var localResults=[];
  var nq=normalize(q);

  BUS_STOPS.forEach(function(s){
    var score=Math.max(
      fuzzyScore(q,s.nombre),
      fuzzyScore(q,s.calles),
      fuzzyScore(q,'Línea '+s.linea)
    );
    if(score>0){
      localResults.push({type:'bus',name:'Línea '+s.linea+' – '+s.nombre,sub:s.calles,lat:s.lat,lon:s.lon,score:score});
    }
  });

  BIKE_STATIONS.forEach(function(s){
    var score=Math.max(
      fuzzyScore(q,s.nombre),
      fuzzyScore(q,s.calles)
    );
    if(score>0){
      localResults.push({type:'bike',name:'🚲 '+s.nombre,sub:s.calles,lat:s.lat,lon:s.lon,score:score});
    }
  });

  // Search landmarks (Puente Colgante, Catedral, etc.)
  LANDMARKS.forEach(function(s){
    var score=Math.max(
      fuzzyScore(q,s.nombre),
      fuzzyScore(q,s.calles)
    );
    if(score>0){
      localResults.push({type:'place',name:s.nombre,sub:s.calles,lat:s.lat,lon:s.lon,score:score});
    }
  });

  // Nominatim remote search
  var url='https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(q+', Santa Fe, Argentina')+'&format=json&limit=5&accept-language=es&viewbox=-60.75,-31.58,-60.63,-31.69&bounded=1';
  fetch(url).then(function(r){return r.json()}).then(function(data){
    var remoteResults=(data||[]).map(function(d,i){
      return {type:'place',name:d.display_name.split(',').slice(0,2).join(', '),sub:d.display_name,lat:parseFloat(d.lat),lon:parseFloat(d.lon),score:70-i*5};
    });
    var all=localResults.concat(remoteResults);
    all.sort(function(a,b){return b.score-a.score});
    // FIX 5: dedup same name
    var seen={};
    var deduped=[];
    all.forEach(function(r){
      var key=normalize(r.name);
      if(!seen[key]){seen[key]=true;deduped.push(r)}
    });
    // FIX 5: max 3 results
    renderAc(field,deduped.slice(0,3));
  }).catch(function(){
    localResults.sort(function(a,b){return b.score-a.score});
    var seen={};
    var deduped=[];
    localResults.forEach(function(r){
      var key=normalize(r.name);
      if(!seen[key]){seen[key]=true;deduped.push(r)}
    });
    renderAc(field,deduped.slice(0,3));
  });
}

// ===================== FIX 6: FUZZY SEARCH =====================
function normalize(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}

function fuzzyScore(query,target){
  var nq=normalize(query);
  var nt=normalize(target);
  var idx=nt.indexOf(nq);
  if(idx>=0){
    return idx===0?100:80; // substring match, higher at start
  }
  // character-by-character matching
  var qi=0,score=0;
  for(var ti=0;ti<nt.length&&qi<nq.length;ti++){
    if(nt[ti]===nq[qi]){
      score+=10;
      if(ti===0||nt[ti-1]===' ')score+=5; // word boundary bonus
      qi++;
    }
  }
  return qi===nq.length?score:0;
}

function weatherEmoji(code,isDay,temp){
  if(temp>=35)return'🥵';
  if(temp<=0)return'🥶';
  if(code===0)return isDay?'☀️':'🌙';
  if(code<=3)return isDay?'🌤️':'🌙';
  if(code<=48)return'🌫️';
  if(code<=57)return'🌧️';
  if(code<=67)return'🌧️';
  if(code<=77)return'🌨️';
  if(code<=82)return'🌧️';
  if(code<=86)return'🌨️';
  if(code<=99)return'⛈️';
  return isDay?'🌤️':'🌙';
}

// ===================== UTILS =====================
function haversine(lat1,lon1,lat2,lon2){
  var R=6371;var dLat=(lat2-lat1)*Math.PI/180;var dLon=(lon2-lon1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function formatPrice(n){return '$'+n.toLocaleString('es-AR')}
function formatMin(m){return Math.ceil(m)+' min'}
function escapeStr(s){return s.replace(/'/g,"\\'").replace(/"/g,'&quot;')}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// ===================== ESTIMATION ENGINE =====================
function runEstimations(){
  if(!_origin||!_dest)return;
  var distKm=haversine(_origin.lat,_origin.lon,_dest.lat,_dest.lon);

  _estimations=[];
  if(_busRouteActive)clearBusRoute();

  // 1. Walk
  var walkMin=(distKm/5)*60;
  var walkPri=distKm<=0.8?1:3;
  _estimations.push({mode:'walk',icon:'🚶',title:'Caminando',timeMin:walkMin,distance:distKm,priority:walkPri});

  // 2. Bus
  var busResult=estimateBus(distKm);
  if(busResult)busResult.timeMin=busResult.totalMin;
  _estimations.push(Object.assign({mode:'bus',icon:'🚌',title:'Colectivo',priority:2,distance:distKm},busResult||{timeMin:0,totalMin:0,price:0,boletos:1,combination:false}));

  // 3. Bike
  var bikeMin=(distKm/15)*60;
  var nearBike=findNearestBikeStation(_origin);
  var nearDestBike=_dest?findNearestBikeStation(_dest):null;
  _estimations.push({mode:'bike',icon:'🚲',title:'Bicicleta',timeMin:bikeMin,distance:distKm,priority:2,nearStation:nearBike,nearDestStation:nearDestBike});

  // 4. Moto - uses FareRegistry.moto.discount
  var motoResult=estimateMoto(distKm);
  _estimations.push(Object.assign({mode:'moto',icon:'🏍️',title:'Moto',priority:3,distance:distKm},motoResult));

  // 5. Auto
  var autoResult=estimateAuto(distKm);
  _estimations.push(Object.assign({mode:'auto',icon:'🚗',title:'Auto',priority:4,distance:distKm},autoResult));

  _estimations.sort(function(a,b){return a.priority-b.priority||a.timeMin-b.timeMin});

  renderCards();
  updateMapHint();
}

function estimateBus(distKm){
  var stopsByLine={};
  BUS_STOPS.forEach(function(s){
    if(!stopsByLine[s.linea])stopsByLine[s.linea]=[];
    stopsByLine[s.linea].push(s);
  });

  var bestDirect=null;
  var bestCombo=null;

  Object.keys(stopsByLine).forEach(function(linea){
    var stops=stopsByLine[linea];
    var nearOrig=null,nearDest=null;
    var minDO=Infinity,minDD=Infinity;
    stops.forEach(function(s){
      var dO=haversine(_origin.lat,_origin.lon,s.lat,s.lon);
      var dD=haversine(_dest.lat,_dest.lon,s.lat,s.lon);
      if(dO<minDO){minDO=dO;nearOrig=s}
      if(dD<minDD){minDD=dD;nearDest=s}
    });
    if(nearOrig&&nearDest&&stops.length>=2){
      var rideDist=haversine(nearOrig.lat,nearOrig.lon,nearDest.lat,nearDest.lon);
      var walkToMin=minDO/5*60+3;
      var rideMin=rideDist/15*60;
      var walkFromMin=minDD/5*60+5;
      var totalMin=walkToMin+rideMin+walkFromMin;
      var price=FareRegistry.bus.sube;
      if(!bestDirect||totalMin<bestDirect.totalMin){
        bestDirect={linea:linea,stopOrigen:nearOrig,stopDest:nearDest,
          walkToStopMin:Math.ceil(walkToMin),rideMin:Math.ceil(rideMin),
          walkFromStopMin:Math.ceil(walkFromMin),totalMin:Math.ceil(totalMin),
          price:price,boletos:1,combination:false,
          stopOrigenCalles:nearOrig.calles,stopDestCalles:nearDest.calles};
      }
    }
  });

  var lines=Object.keys(stopsByLine);
  for(var i=0;i<lines.length;i++){
    for(var j=0;j<lines.length;j++){
      if(i===j)continue;
      var line1=lines[i];var line2=lines[j];
      var stops1=stopsByLine[line1];var stops2=stopsByLine[line2];
      var bestS1=null,minD1=Infinity;
      stops1.forEach(function(s){var d=haversine(_origin.lat,_origin.lon,s.lat,s.lon);if(d<minD1){minD1=d;bestS1=s}});
      var bestS2=null,minD2=Infinity;
      stops2.forEach(function(s){var d=haversine(_dest.lat,_dest.lon,s.lat,s.lon);if(d<minD2){minD2=d;bestS2=s}});
      var bestTrans1=null,bestTrans2=null,minTrans=Infinity;
      stops1.forEach(function(s1){
        stops2.forEach(function(s2){
          var d=haversine(s1.lat,s1.lon,s2.lat,s2.lon);
          if(d<minTrans){minTrans=d;bestTrans1=s1;bestTrans2=s2}
        });
      });
      if(bestS1&&bestS2&&bestTrans1&&bestTrans2&&minTrans<0.8){
        var seg1Dist=haversine(bestS1.lat,bestS1.lon,bestTrans1.lat,bestTrans1.lon);
        var seg2Dist=haversine(bestTrans2.lat,bestTrans2.lon,bestS2.lat,bestS2.lon);
        var walkToMin1=minD1/5*60+3;
        var ride1Min=seg1Dist/15*60;
        var transWalkMin=minTrans/5*60;
        var ride2Min=seg2Dist/15*60;
        var walkFromMin2=minD2/5*60+5;
        var totalMin=walkToMin1+ride1Min+transWalkMin+ride2Min+walkFromMin2;
        var price=FareRegistry.bus.sube*2;
        if(!bestCombo||totalMin<bestCombo.totalMin){
          bestCombo={linea1:line1,linea2:line2,
            stopOrigen:bestS1,stopTransbordo:bestTrans1,stopTransbordo2:bestTrans2,stopDest:bestS2,
            walkToStopMin:Math.ceil(walkToMin1),ride1Min:Math.ceil(ride1Min),
            transWalkMin:Math.ceil(transWalkMin),ride2Min:Math.ceil(ride2Min),
            walkFromStopMin:Math.ceil(walkFromMin2),totalMin:Math.ceil(totalMin),
            price:price,boletos:2,combination:true,
            stopOrigenCalles:bestS1.calles,stopTransbordoCalles:bestTrans1.calles};
        }
      }
    }
  }

  var chosen=bestCombo||bestDirect;
  if(!chosen){
    chosen={totalMin:Math.ceil((distKm/15)*60+8),price:FareRegistry.bus.sube,boletos:1,combination:false,
      linea:'?',stopOrigenCalles:'—',walkToStopMin:3};
  }
  return chosen;
}

function findNearestBikeStation(point){
  var best=null,minD=Infinity;
  BIKE_STATIONS.forEach(function(s){
    var d=haversine(point.lat,point.lon,s.lat,s.lon);
    if(d<minD){minD=d;best=s}
  });
  return best;
}

// Moto: solo Uber Moto confirmado, DiDi Moto sin confirmar → Consultar
function estimateMoto(distKm){
  var durMoto=(distKm/35)*60;
  var autoResult=estimateAuto(distKm);
  var d=FareRegistry.moto.discount;
  return{
    timeMin:Math.round(durMoto),
    uberMotoTimeMin:Math.round(durMoto*1.00),
    didiMotoTimeMin:Math.round(durMoto*1.04),
    uberMotoPrice:autoResult.uberPrice!=null?Math.ceil(autoResult.uberPrice*d):null,
    didiMotoPrice:null // No confirmado en Santa Fe → Consultar
  };
}

function estimateAuto(distKm){
  var durCar=(distKm/25)*60;
  var uberPrice=calcAppPrice('uber',distKm,durCar);
  var didiPrice=calcAppPrice('didi',distKm,durCar);
  var maximPrice=calcAppPrice('maxim',distKm,durCar);
  var cabifyPrice=calcAppPrice('cabify',distKm,durCar); // null
  var taxiPrice=estimateTaxi(distKm);
  var remisPrice=taxiPrice;
  var taxiappPrice=taxiPrice;
  return{timeMin:Math.round(durCar),
    uberTimeMin:Math.round(durCar*1.00),
    didiTimeMin:Math.round(durCar*1.03),
    maximTimeMin:Math.round(durCar*1.05),
    taxiTimeMin:Math.round(durCar*1.10),
    remisTimeMin:Math.round(durCar*1.08),
    taxiappTimeMin:Math.round(durCar*1.07),
    uberPrice:uberPrice,didiPrice:didiPrice,
    maximPrice:maximPrice,cabifyPrice:cabifyPrice,
    taxiPrice:taxiPrice,remisPrice:remisPrice,taxiappPrice:taxiappPrice};
}

function calcAppPrice(fareKey,distKm,timeMin){
  var f=FareRegistry.apps[fareKey];
  if(!f||f.base===null)return null;
  var price=f.base+f.km*distKm+f.min*timeMin;
  return Math.max(price,f.minFare);
}

function estimateTaxi(distKm){
  var h=new Date().getHours();
  var t=(h>=6&&h<22)?FareRegistry.taxi.diurno:FareRegistry.taxi.nocturno;
  var fichas=Math.floor(distKm*1000/t.distFicha);
  return t.bajada+fichas*t.ficha;
}

function renderProviderRow(key,name,price,colorKey,timeOverride,waLink,waText){
  var provider=PROVIDERS[key];
  if(!provider||!provider.available)return'';
  var color=provider.color||'#666';
  var t=timeOverride?formatMin(timeOverride):'';
  var url='';
  if(key==='uber'||key==='uber_moto')url=buildUberLink();
  else if(key==='didi'||key==='didi_moto')url=buildDiDiLink();
  else if(key==='maxim')url=buildMaximLink();
  else if(key==='cabify')url='https://cabify.com/';
  else if(waLink)url=waLink;

  var h='<div class="provider-row">';
  h+='<div class="provider-color" style="background:'+color+'"></div>';
  h+='<span class="provider-name">'+name+'</span>';
  h+='<div class="card-action-row">';
  if(url){
    h+='<button class="btn-pedir" data-action="'+key+'" data-url="'+url+'">Pedir</button>';
  }
  h+='<span class="card-price">'+(price!=null?formatPrice(price):'Consultar')+'</span>';
  if(t)h+='<span class="rc-time" style="margin-left:4px">'+t+'</span>';
  h+='</div></div>';
  return h;
}

function buildDiDiLink(){

function buildMaximLink(){
  if(!_origin||!_dest||!_origin.lat||!_dest.lat) return 'https://taximaxim.com/ar/';
  var isAndroid=/Android/i.test(navigator.userAgent);
  var isIOS=/iPhone|iPad/i.test(navigator.userAgent);
  if(isAndroid){
    var playStore='https://play.google.com/store/apps/details?id=com.taxsee.taxsee';
    return 'intent://order?'+
      'startLat='+Number(_origin.lat).toFixed(6)+
      '&startLon='+Number(_origin.lon).toFixed(6)+
      '&finishLat='+Number(_dest.lat).toFixed(6)+
      '&finishLon='+Number(_dest.lon).toFixed(6)+
      '#Intent'+
      ';scheme=taxsee'+
      ';package=com.taxsee.taxsee'+
      ';S.browser_fallback_url='+encodeURIComponent(playStore)+
      ';end';
  }
  if(isIOS){
    return 'https://apps.apple.com/app/maxim/id893663029';
  }
  return 'https://taximaxim.com/ar/';
}

function buildBikeLink(){
  var isAndroid=/Android/i.test(navigator.userAgent);
  if(isAndroid)return 'intent://#Intent;scheme=lasbicis;package=com.santafe.lasbicis;end';
  var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);

}

// ===================== DOUBLE TAP TO CONFIRM =====================
var _confirmState={};
function requestRide(mode,url){
  var now=Date.now();
  var last=_confirmState[mode]||0;
  var DOUBLE_TAP_MS=2000;
  if(now-last<DOUBLE_TAP_MS){
    _confirmState[mode]=0;
    window.open(url,'_blank');
  }else{
    _confirmState[mode]=now;
    showToast('Tocá de nuevo para confirmar','info');
    setTimeout(function(){_confirmState[mode]=0},DOUBLE_TAP_MS+100);
  }
}

// ===================== DRAG AND DROP - FIX 10: update _estimations =====================
function initDragAndDrop(){
  var cards=document.querySelectorAll('.route-card:not(.route-card--unavailable)');
  var dragSrc=null;

  cards.forEach(function(card){
    card.addEventListener('dragstart',function(e){
      dragSrc=card;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',card.getAttribute('data-mode'));
    });

    card.addEventListener('dragend',function(){
      card.classList.remove('dragging');
      document.querySelectorAll('.route-card').forEach(function(c){c.classList.remove('drag-over')});
    });

    card.addEventListener('dragover',function(e){
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      if(card!==dragSrc){
        card.classList.add('drag-over');
      }
    });

    card.addEventListener('dragleave',function(){
      card.classList.remove('drag-over');
    });

    card.addEventListener('drop',function(e){
      e.preventDefault();
      card.classList.remove('drag-over');
      if(dragSrc&&dragSrc!==card){
        var container=document.getElementById('cardsContainer');
        var allCards=Array.from(container.querySelectorAll('.route-card:not(.route-card--unavailable)'));
        var fromIdx=allCards.indexOf(dragSrc);
        var toIdx=allCards.indexOf(card);
        if(fromIdx<toIdx){
          container.insertBefore(dragSrc,card.nextSibling);
        }else{
          container.insertBefore(dragSrc,card);
        }
        // FIX 10: reorder _estimations to match new visual order
        syncEstimationsFromDOM();
        // FIX 9: update map hint with ranking[0]
        updateMapHint();
      }
    });
  });
}

// FIX 10: sync _estimations array order with DOM order
function syncEstimationsFromDOM(){
  if(!_estimations)return;
  var container=document.getElementById('cardsContainer');
  var domCards=container.querySelectorAll('.route-card:not(.route-card--unavailable)');
  var newOrder=[];
  domCards.forEach(function(card){
    var mode=card.getAttribute('data-mode');
    var found=_estimations.find(function(e){return e.mode===mode});
    if(found)newOrder.push(found);
  });
  if(newOrder.length===_estimations.length){
    _estimations=newOrder;
  }
}

// ===================== PREFERENCE ENGINE =====================
var PREFS_KEY='voy_prefs';

function loadPrefs(){
  try{
    var saved=localStorage.getItem(PREFS_KEY);
    if(saved){
      var parsed=JSON.parse(saved);
      // Merge: only known keys
      Object.keys(_prefs).forEach(function(k){if(k in parsed)_prefs[k]=!!parsed[k]});
    }
  }catch(e){}
}

function savePrefs(){
  try{localStorage.setItem(PREFS_KEY,JSON.stringify(_prefs))}catch(e){}
}

function togglePref(key){
  if(!(key in _prefs))return;
  _prefs[key]=!_prefs[key];
  // Mutually exclusive: price vs speed
  if(key==='prioritizePrice'&&_prefs.prioritizePrice)_prefs.prioritizeSpeed=false;
  if(key==='prioritizeSpeed'&&_prefs.prioritizeSpeed)_prefs.prioritizePrice=false;
  savePrefs();
  renderPrefsPanel();
  renderRecommendation();
}

    options.forEach(function(opt){
      var checked=_prefs[opt.key];
      h+='<label style="display:flex;align-items:center;gap:6px;padding:5px 0;font-size:12px;cursor:pointer;color:var(--text);line-height:1.2">';
      h+='<input type="checkbox" onchange="togglePref(\''+opt.key+'\')" '+(checked?'checked':'')+' style="accent-color:var(--accent);width:16px;height:16px;flex-shrink:0">';
      h+='<span>'+opt.icon+' '+opt.label+'</span>';
      h+='</label>';
    });
    h+='</div>';
  }

  h+='</div>';
  el.innerHTML=h;
}

// ===================== RECOMMENDATION ENGINE =====================
function computeRecommendation(){
  if(!_estimations||!_estimations.length)return null;
  var alternatives=[];

  // Determine weights from preferences
  var priceW=0.6,timeW=0.4;
  if(_prefs.prioritizePrice){priceW=0.8;timeW=0.2}
  else if(_prefs.prioritizeSpeed){priceW=0.2;timeW=0.8}

  _estimations.forEach(function(est){
    // Skip walk/bike: free options trivialize price-based recommendations
    if(est.mode==='walk'||est.mode==='bike')return;

    if(est.mode==='bus'){
      if(est.price!=null&&est.timeMin!=null&&est.timeMin>0){
        var busWalkTo=est.walkToStopMin||0;
        var busWalkFrom=est.walkFromStopMin||0;
        var busHasCombo=!!est.combination;
        alternatives.push({name:'Colectivo',price:est.price,time:Math.ceil(est.timeMin),mode:'bus',icon:'🚌',walkMin:busWalkTo+busWalkFrom,hasTransfer:busHasCombo});
      }
    }

    if(est.mode==='moto'){
      if(est.uberMotoPrice!=null){
        alternatives.push({name:'Uber Moto',price:est.uberMotoPrice,time:est.uberMotoTimeMin||est.timeMin,mode:'moto',icon:'🏍️'});
      }
      // DiDi Moto price=null → excluded from recommendation (can't score without price)
    }

    if(est.mode==='auto'){
      var autoProviders=[
        {key:'uber',name:'Uber',priceKey:'uberPrice',timeKey:'uberTimeMin'},
        {key:'didi',name:'DiDi',priceKey:'didiPrice',timeKey:'didiTimeMin'},
        {key:'maxim',name:'Maxim',priceKey:'maximPrice',timeKey:'maximTimeMin'},
        {key:'cabify',name:'Cabify',priceKey:'cabifyPrice',timeKey:null},
        {key:'taxi',name:'Radiotaxi',priceKey:'taxiPrice',timeKey:'taxiTimeMin'},
        {key:'remis',name:'Remises Real',priceKey:'remisPrice',timeKey:'remisTimeMin'},
        {key:'taxiapp',name:'TaxiApp',priceKey:'taxiappPrice',timeKey:'taxiappTimeMin'}
      ];
      autoProviders.forEach(function(p){
        if(est[p.priceKey]!=null&&PROVIDERS[p.key]&&PROVIDERS[p.key].available){
          var pTime=p.timeKey&&est[p.timeKey]?est[p.timeKey]:est.timeMin;
          alternatives.push({name:p.name,price:est[p.priceKey],time:pTime,mode:'auto',icon:'🚗'});
        }
      });
    }
  });

  // Apply preference: avoidMoto → exclude moto alternatives
  if(_prefs.avoidMoto){
    alternatives=alternatives.filter(function(a){return a.mode!=='moto'});
  }

  if(!alternatives.length)return null;

  // Normalize price and time to [0,1] range
  var prices=alternatives.map(function(a){return a.price});
  var times=alternatives.map(function(a){return a.time});
  var minPrice=Math.min.apply(null,prices);
  var maxPrice=Math.max.apply(null,prices);
  var minTime=Math.min.apply(null,times);
  var maxTime=Math.max.apply(null,times);

  alternatives.forEach(function(a){
    var priceNorm=maxPrice>minPrice?(a.price-minPrice)/(maxPrice-minPrice):0;
    var timeNorm=maxTime>minTime?(a.time-minTime)/(maxTime-minTime):0;
    a.score=priceNorm*priceW+timeNorm*timeW;

    // Penalizaciones aditivas (lineales, independientes del score base)
    if(_prefs.avoidLongWalks&&a.walkMin&&a.walkMin>8){
      a.score+=0.20;
    }
    if(_prefs.avoidTransfers&&a.hasTransfer){
      a.score+=0.25;
    }
    if(_prefs.withLuggage&&(a.mode==='bike'||a.mode==='walk')){
      a.score+=0.30;
    }
    if(_prefs.withChildren&&a.mode==='moto'){
      a.score+=0.35;
    }
    // Clamp score to max 1.0
    a.score=Math.min(a.score,1.0);
  });

  // Sort by each criterion
  var byPrice=alternatives.slice().sort(function(a,b){return a.price-b.price});
  var byTime=alternatives.slice().sort(function(a,b){return a.time-b.time});
  var byScore=alternatives.slice().sort(function(a,b){return a.score-b.score});

  // Tie detection: < 5% difference → empate técnico
  function getTied(arr,prop){
    if(!arr.length)return[];
    var best=arr[0];
    var threshold=Math.abs(best[prop])*0.05;
    return arr.filter(function(a){return Math.abs(a[prop]-best[prop])<=threshold});
  }

  // Build transparency reasons
  var reasons=[];
  if(_prefs.prioritizePrice)reasons.push('priorizás precio');
  else if(_prefs.prioritizeSpeed)reasons.push('priorizás velocidad');
  if(_prefs.avoidMoto)reasons.push('evitás motos');
  if(_prefs.withLuggage)reasons.push('viajás con equipaje');
  if(_prefs.withChildren)reasons.push('viajás con niños');
  if(_prefs.avoidLongWalks)reasons.push('evitás caminatas largas');
  if(_prefs.avoidTransfers)reasons.push('evitás transbordos');
  var reasonText=reasons.length?'Motivo: '+reasons.join(', '):'Motivo: configuración estándar';

  return{
    cheapest:getTied(byPrice,'price'),
    fastest:getTied(byTime,'time'),
    balanced:getTied(byScore,'score'),
    reason:reasonText
  };
}

function renderRecommendation(){
  var el=document.getElementById('recommendationBlock');
  if(!el)return;

  var rec=computeRecommendation();
  if(!rec||(!rec.cheapest.length&&!rec.fastest.length&&!rec.balanced.length)){
    el.style.display='none';
    return;
  }

  el.style.display='block';
  var html='';

  // Header
  html+='<div style="font-size:11px;font-weight:800;color:var(--accent);margin-bottom:6px;letter-spacing:.5px">🏆 RECOMENDACIÓN VOY</div>';

  // Más barato
  if(rec.cheapest.length){
    html+='<div style="font-size:12px;margin-bottom:4px;line-height:1.4">💰 <b>Más barato:</b> ';
    if(rec.cheapest.length>1){
      html+='<span style="color:var(--orange);font-weight:600">Empate técnico</span> · '+
        rec.cheapest.map(function(a){return a.name}).join(' / ');
    }else{
      html+=rec.cheapest[0].name+' — <b>'+formatPrice(rec.cheapest[0].price)+'</b>';
    }
    html+='</div>';
  }

  // Más rápido
  if(rec.fastest.length){
    html+='<div style="font-size:12px;margin-bottom:4px;line-height:1.4">⚡ <b>Más rápido:</b> ';
    if(rec.fastest.length>1){
      html+='<span style="color:var(--orange);font-weight:600">Empate técnico</span> · '+
        rec.fastest.map(function(a){return a.name}).join(' / ');
    }else{
      html+=rec.fastest[0].icon+' '+rec.fastest[0].name+' — <b>'+formatMin(rec.fastest[0].time)+'</b>';
    }
    html+='</div>';
  }

  // Mejor equilibrio
  if(rec.balanced.length){
    html+='<div style="font-size:12px;line-height:1.4">⚖️ <b>Mejor equilibrio:</b> ';
    if(rec.balanced.length>1){
      html+='<span style="color:var(--orange);font-weight:600">Empate técnico</span> · '+
        rec.balanced.map(function(a){return a.name}).join(' / ');
    }else{
      var b=rec.balanced[0];
      html+=b.name+' — <b>'+formatPrice(b.price)+'</b> / '+formatMin(b.time);
    }
    html+='</div>';
  }

  // Transparency reason
  if(rec.reason){
    html+='<div style="font-size:10px;color:var(--text2);margin-top:4px;font-style:italic">'+rec.reason+'</div>';
  }

  el.innerHTML=html;
}

if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',function(e){
    document.body.setAttribute('data-theme',e.matches?'dark':'light');
  });
}

var _VA_KEY='voy_va';
var _VA_MAX=300; // FIFO cap
var _VA_GRID=0.0072; // ~800m geo cluster
var _vaS={o:0,os:'n',dt:0,dn:'',dc:'',ct:0,ms:'',cm:'',ct2:0,x:0}; // current session

function _vaCluster(lat,lon){return(lat/_VA_GRID).toFixed(0)+'_'+(lon/_VA_GRID).toFixed(0)}

function va_open(){
  _vaS={o:Date.now(),os:'n',dt:0,dn:'',dc:'',ct:0,ms:'',cm:'',ct2:0,x:0};
}

function va_origin(src){
  if(!_vaS.o)return;
  var m={gps:'g',cache:'c',map:'m',search:'s'};
  _vaS.os=m[src]||'n';
}

function va_dest(name,lat,lon){
  if(!_vaS.o||_vaS.dt)return; // solo primer destino por sesión
  _vaS.dt=Date.now();
  _vaS.dn=(name||'').substring(0,25);
  _vaS.dc=_vaCluster(lat,lon);
}

function va_cards(modes){
  if(!_vaS.o)return;
  if(!_vaS.ct)_vaS.ct=Date.now();
  var modeMap={walk:'w',bus:'b',bike:'i',moto:'m',auto:'a'};
  _vaS.ms=(modes||[]).map(function(e){return modeMap[e]||'?'}).join(',');
}

function va_cta(mode){
  if(!_vaS.o)return;
  _vaS.cm=mode||'';
  _vaS.ct2=Date.now();
}

function va_close(){
  if(!_vaS.o)return;
  _vaS.x=Date.now();
  if(_vaS.x-_vaS.o<500)return; // descarta bounces <500ms
  try{
    var raw=localStorage.getItem(_VA_KEY);
    var arr=raw?JSON.parse(raw):[];
    if(!Array.isArray(arr))arr=[];
    arr.push(_vaS);
    if(arr.length>_VA_MAX)arr=arr.slice(arr.length-_VA_MAX);
    localStorage.setItem(_VA_KEY,JSON.stringify(arr));
  }catch(e){}
}

function va_load(){
  try{var r=localStorage.getItem(_VA_KEY);return r?JSON.parse(r):[]}catch(e){return[]}
}

function va_metrics(){
  var s=va_load();
  var n=s.length;
  if(!n)return{total:0};
  var m={total:n,ctaRate:0,abandonRate:0,avgToCTA:0,avgDecision:0,topDest:[],providerWins:{},deadCards:{}};
  var ctaCount=0,abandonCount=0,sumToCTA=0,sumDecision=0;
  var destCounts={},provCounts={},modeShown={},modeChosen={};
  s.forEach(function(r){
    if(!r.dt)abandonCount++;
    if(r.ct2>0){ctaCount++;if(r.ct2>r.o)sumToCTA+=r.ct2-r.o;if(r.ct2>r.ct&&r.ct>0)sumDecision+=r.ct2-r.ct}
    if(r.cm)provCounts[r.cm]=(provCounts[r.cm]||0)+1;
    if(r.dc){var dk=r.dc+(r.dn?'|'+r.dn:'');destCounts[dk]=(destCounts[dk]||0)+1}
    if(r.ms){r.ms.split(',').forEach(function(c){modeShown[c]=(modeShown[c]||0)+1})}
    if(r.cm){var cm=r.cm.indexOf('_')>=0?r.cm.split('_')[0]:r.cm;var ck={uber:'a',didi:'a',maxim:'a',taxi:'a',remis:'a',taxiapp:'a',cabify:'a',uber_moto:'m',didi_moto:'m',bus:'b',walk:'w',bike:'i'}[r.cm]||'?';modeChosen[ck]=(modeChosen[ck]||0)+1}
  });
  m.ctaRate=ctaCount/n;m.abandonRate=abandonCount/n;
  if(ctaCount){m.avgToCTA=Math.round(sumToCTA/ctaCount);m.avgDecision=Math.round(sumDecision/ctaCount)}
  var sorted=Object.keys(destCounts).sort(function(a,b){return destCounts[b]-destCounts[a]});
  m.topDest=sorted.slice(0,5).map(function(k){return{name:k.split('|')[1]||k.split('|')[0],count:destCounts[k]}});
  m.providerWins=provCounts;
  var modeNames={w:'Caminata',b:'Colectivo',i:'Bicicleta',m:'Moto',a:'Auto'};
  Object.keys(modeShown).forEach(function(k){if(!modeChosen[k]&&modeShown[k]>=2)m.deadCards[modeNames[k]||k]=modeShown[k]});
  return m;
}

  h+='</table>';

    var sorted=Object.keys(m.providerWins).sort(function(a,b){return m.providerWins[b]-m.providerWins[a]});
    sorted.forEach(function(k){var pct=(m.providerWins[k]/m.total*100).toFixed(0);h+='<div style="margin:2px 0">'+k+': '+m.providerWins[k]+' ('+pct+'%) <span style="background:#2563eb;height:8px;display:inline-block;width:'+(pct*1.5)+'px;border-radius:2px"></span></div>'});
    h+='</div>';

  if(m.topDest.length){

    h+='</div>';
  }
  if(Object.keys(m.deadCards).length){
    h+='<div style="margin-bottom:12px"><b>👻 Cards vistas nunca elegidas</b>';
    Object.keys(m.deadCards).forEach(function(k){h+='<div style="margin:2px 0;color:#f97316">'+k+': vista '+m.deadCards[k]+'x, nunca elegida</div>'});
    h+='</div>';
  }
  h+='<div style="margin-top:16px;font-size:10px;color:#666">Datos locales · Sin SDK externo · FIFO '+_VA_MAX+' sesiones</div>';
  h+='</div>';
  el.innerHTML=h;
}

// ===================== GPS: silent, cache, retry =====================
var _gpsRetryCount=0;
var _gpsMaxRetries=3;
var _gpsRetryTimer=null;

function initGPS(){
  if(!navigator.geolocation){updateGPSStatus(false);loadCachedPosition();return}
  _gpsWatch=navigator.geolocation.watchPosition(function(pos){
    _gpsRetryCount=0;
    updateGPSStatus(true);
    cachePosition(pos.coords.latitude,pos.coords.longitude);
    if(!MC.isOriginManual()){
      var origin=MC.getOrigin();
      if(!origin||origin.source==='gps'||origin.source==='cache'){
        MC.setOrigin(pos.coords.latitude,pos.coords.longitude,'Mi ubicación','gps');
        va_origin('gps');
        updateOriginUI();
        updateMapMarkers();
        if(MC.getDest())runEstimations();
      }
    }
  },function(err){
    updateGPSStatus(false);
    loadCachedPosition();
    // Silent retry with backoff
    if(_gpsRetryCount<_gpsMaxRetries){
      _gpsRetryCount++;
      clearTimeout(_gpsRetryTimer);
      _gpsRetryTimer=setTimeout(function(){
        navigator.geolocation.getCurrentPosition(function(pos){
          _gpsRetryCount=0;
          updateGPSStatus(true);
          cachePosition(pos.coords.latitude,pos.coords.longitude);
          if(!MC.isOriginManual()){
            var origin=MC.getOrigin();
            if(!origin||origin.source==='gps'||origin.source==='cache'){
              MC.setOrigin(pos.coords.latitude,pos.coords.longitude,'Mi ubicación','gps');
              va_origin('gps');
              updateOriginUI();
              updateMapMarkers();
              if(MC.getDest())runEstimations();
            }
          }
        },function(){},{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
      },_gpsRetryCount*5000);
    }
  },{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
}

function updateGPSStatus(ok){
  var el=document.getElementById('gpsStatus');
  el.textContent=ok?'📍🟢':'📍❌';
}

function cachePosition(lat,lon){
  try{localStorage.setItem('voy_last_pos',JSON.stringify({lat:lat,lon:lon}))}catch(e){}
}

function loadCachedPosition(){
  try{
    var cached=localStorage.getItem('voy_last_pos');
    if(cached){
      var pos=JSON.parse(cached);
      if(!MC.getOrigin()){
        MC.setOrigin(pos.lat,pos.lon,'Ubicación guardada','cache');
        va_origin('cache');
        updateOriginUI();
        updateMapMarkers();
      }
    }
  }catch(e){}
}

function locateMe(){
  if(!navigator.geolocation){return}
  navigator.geolocation.getCurrentPosition(function(pos){
    MC.setOriginManual(false);
    MC.setOrigin(pos.coords.latitude,pos.coords.longitude,'Mi ubicación','gps');
    va_origin('gps');
    cachePosition(pos.coords.latitude,pos.coords.longitude);
    updateOriginUI();
    updateMapMarkers();
    var origin=MC.getOrigin();
    _map.flyTo({center:[origin.lon,origin.lat],zoom:15});
    if(MC.getDest())runEstimations();
  },function(){
    loadCachedPosition();
  },{enableHighAccuracy:true,timeout:10000});
}

// ===================== MAP CLICK / MANUAL PIN =====================
function activateMapOrigin(){
  _manualOriginMode=true;
  _manualDestMode=false;
  document.getElementById('map').classList.add('crosshair');
  showToast('Tocá el mapa para fijar el origen','info');
}

function activateMapDest(){
  _manualDestMode=true;
  _manualOriginMode=false;
  document.getElementById('map').classList.add('crosshair');
  showToast('Tocá el mapa para fijar el destino','info');
}

function onMapClick(e){
  if(!_manualOriginMode&&!_manualDestMode)return;
  var lat=e.lngLat.lat;
  var lon=e.lngLat.lng;

  if(_manualDestMode){
    _manualDestMode=false;
    document.getElementById('map').classList.remove('crosshair');
    MC.setDest(lat,lon,'','map');
    va_dest('',lat,lon);
    reverseGeocodeDest(lat,lon);
    updateMapMarkers();
    if(MC.getOrigin())runEstimations();
    return;
  }

  if(_manualOriginMode){
    _manualOriginMode=false;
    MC.setOriginManual(true);

    MC.setOrigin(lat,lon,'','map');
    va_origin('map');
    reverseGeocodeOrigin(lat,lon);
    updateOriginUI();
    updateMapMarkers();
    if(MC.getDest())runEstimations();
  }
}

function reverseGeocodeOrigin(lat,lon){
  fetch('https://nominatim.openstreetmap.org/reverse?lat='+lat+'&lon='+lon+'&format=json&accept-language=es')
    .then(function(r){return r.json()})
    .then(function(d){
      if(d&&d.display_name){
        MC.setOriginName(d.display_name.split(',').slice(0,2).join(', '));
        updateOriginUI();
        refreshOriginLabel();
      }
    }).catch(function(){});
}

function reverseGeocodeDest(lat,lon){
  fetch('https://nominatim.openstreetmap.org/reverse?lat='+lat+'&lon='+lon+'&format=json&accept-language=es')
    .then(function(r){return r.json()})
    .then(function(d){
      if(d&&d.display_name){
        MC.setDestName(d.display_name.split(',').slice(0,2).join(', '));
        updateDestUI();
        refreshDestLabel();
      }
    }).catch(function(){});
}

// ===================== MAP MARKERS =====================
function updateMapMarkers(){
  var origin=MC.getOrigin();
  var dest=MC.getDest();

  if(_originMarker){_originMarker.remove();_originMarker=null}
  if(_destMarker){_destMarker.remove();_destMarker=null}
  if(_originPopup){_originPopup.remove();_originPopup=null}
  if(_destPopup){_destPopup.remove();_destPopup=null}

  if(origin){
    const el=document.createElement('div');
    el.style.cssText='width:18px;height:18px;background:#16a34a;border:3px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.5)';
    _originMarker=new maplibregl.Marker({element:el}).setLngLat([origin.lon,origin.lat]).addTo(_map);
    const oLabel=origin.name||'Origen';
    _originPopup=new maplibregl.Popup({closeButton:false,closeOnClick:false,offset:22,anchor:'bottom',className:'voy-label-popup'})
      .setLngLat([origin.lon,origin.lat])
      .setHTML('<div class="voy-label voy-label--green">'+escapeHtml(oLabel)+'</div>')
      .addTo(_map);
  }
  if(dest){
    const el2=document.createElement('div');
    el2.style.cssText='width:18px;height:18px;background:#dc2626;border:3px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.5)';
    _destMarker=new maplibregl.Marker({element:el2}).setLngLat([dest.lon,dest.lat]).addTo(_map);
    const dLabel=dest.name||'Destino';
    _destPopup=new maplibregl.Popup({closeButton:false,closeOnClick:false,offset:22,anchor:'bottom',className:'voy-label-popup'})
      .setLngLat([dest.lon,dest.lat])
      .setHTML('<div class="voy-label voy-label--red">'+escapeHtml(dLabel)+'</div>')
      .addTo(_map);
  }

  if(origin&&dest){
    const bounds=new maplibregl.LngLatBounds();
    bounds.extend([origin.lon,origin.lat]);
    bounds.extend([dest.lon,dest.lat]);
    _map.fitBounds(bounds,{padding:40,maxZoom:16,duration:800});
  } else if(origin){
    _map.flyTo({center:[origin.lon,origin.lat],zoom:15});
  }

  if(_busRouteActive)clearBusRoute();
  drawRouteLine();

  const cBtn=document.getElementById('centerRouteBtn');
  if(cBtn)cBtn.style.display=(origin&&dest)?'block':'none';
}

function drawRouteLine(){
  var origin=MC.getOrigin();
  var dest=MC.getDest();
  if(!origin||!dest)return;
  if(_map.getSource('route-src')){
    if(_map.getLayer('route-shadow'))_map.removeLayer('route-shadow');
    if(_map.getLayer('route-line'))_map.removeLayer('route-line');
    _map.removeSource('route-src');
  }
  var geojson={
    type:'Feature',
    geometry:{type:'LineString',coordinates:[[origin.lon,origin.lat],[dest.lon,dest.lat]]}
  };
  _map.addSource('route-src',{type:'geojson',data:geojson});
  _map.addLayer({id:'route-shadow',type:'line',source:'route-src',layout:{'line-cap':'round'},paint:{'line-color':'#2563eb','line-width':10,'line-opacity':0.15}});
  _map.addLayer({id:'route-line',type:'line',source:'route-src',layout:{'line-cap':'round'},paint:{'line-color':'#2563eb','line-width':4,'line-opacity':0.8}});
}

function centerRoute(){
  var origin=MC.getOrigin();
  var dest=MC.getDest();
  if(!origin||!dest)return;
  var bounds=new maplibregl.LngLatBounds();
  bounds.extend([origin.lon,origin.lat]);
  bounds.extend([dest.lon,dest.lat]);
  _map.fitBounds(bounds,{padding:40,maxZoom:16,duration:600});
}

// ===================== BUS ROUTE OVERLAY =====================
function drawBusRoute(est){
  var origin=MC.getOrigin();
  var dest=MC.getDest();
  if(!est||!est.stopOrigen||!origin||!dest)return;

  // Remove normal route line first
  if(_map.getSource('route-src')){
    if(_map.getLayer('route-shadow'))_map.removeLayer('route-shadow');
    if(_map.getLayer('route-line'))_map.removeLayer('route-line');
    _map.removeSource('route-src');
  }

  // Build segment coordinates
  var walkSegs=[];
  var rideSegs=[];
  var transSegs=[];

  if(est.combination){
    // Guard: stopTransbordo2 puede no existir en datos legacy
    if(!est.stopTransbordo2) est.stopTransbordo2 = est.stopTransbordo;
    // 5 segments: walk→ride1→trans→ride2→walk
    walkSegs.push([[origin.lon,origin.lat],[est.stopOrigen.lon,est.stopOrigen.lat]]);
    rideSegs.push([[est.stopOrigen.lon,est.stopOrigen.lat],[est.stopTransbordo.lon,est.stopTransbordo.lat]]);
    transSegs.push([[est.stopTransbordo.lon,est.stopTransbordo.lat],[est.stopTransbordo2.lon,est.stopTransbordo2.lat]]);
    rideSegs.push([[est.stopTransbordo2.lon,est.stopTransbordo2.lat],[est.stopDest.lon,est.stopDest.lat]]);
    walkSegs.push([[est.stopDest.lon,est.stopDest.lat],[dest.lon,dest.lat]]);
  }else{
    // 3 segments: walk→ride→walk
    walkSegs.push([[origin.lon,origin.lat],[est.stopOrigen.lon,est.stopOrigen.lat]]);
    rideSegs.push([[est.stopOrigen.lon,est.stopOrigen.lat],[est.stopDest.lon,est.stopDest.lat]]);
    walkSegs.push([[est.stopDest.lon,est.stopDest.lat],[dest.lon,dest.lat]]);
  }

  // Add walk segments (green dashed)
  if(walkSegs.length){
    _map.addSource('bus-walk-src',{type:'geojson',data:{type:'Feature',geometry:{type:'MultiLineString',coordinates:walkSegs}}});
    _map.addLayer({id:'bus-walk-line',type:'line',source:'bus-walk-src',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#22c55e','line-width':3,'line-opacity':0.75,'line-dasharray':[2,2]}});
  }

  // Add ride segments (blue solid + shadow)
  if(rideSegs.length){
    _map.addSource('bus-ride-src',{type:'geojson',data:{type:'Feature',geometry:{type:'MultiLineString',coordinates:rideSegs}}});
    _map.addLayer({id:'bus-ride-shadow',type:'line',source:'bus-ride-src',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#2563eb','line-width':10,'line-opacity':0.15}});
    _map.addLayer({id:'bus-ride-line',type:'line',source:'bus-ride-src',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#2563eb','line-width':4,'line-opacity':0.9}});
  }

  // Add transfer segment (orange dashed)
  if(transSegs.length){
    _map.addSource('bus-trans-src',{type:'geojson',data:{type:'Feature',geometry:{type:'MultiLineString',coordinates:transSegs}}});
    _map.addLayer({id:'bus-trans-line',type:'line',source:'bus-trans-src',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#f59e0b','line-width':3,'line-opacity':0.8,'line-dasharray':[3,2]}});
  }

  // Add stop markers
  var stops=[];
  stops.push({point:est.stopOrigen,label:'Subida'});
  stops.push({point:est.stopDest,label:'Bajada'});
  if(est.combination && est.stopTransbordo){
    stops.push({point:est.stopTransbordo,label:'Bajada transbordo'});
    stops.push({point:est.stopTransbordo2||est.stopTransbordo,label:'Subida transbordo'});
  }

  stops.forEach(function(s){
    var el=document.createElement('div');
    el.style.cssText='width:12px;height:12px;background:#f59e0b;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.4)';
    var marker=new maplibregl.Marker({element:el}).setLngLat([s.point.lon,s.point.lat]).addTo(_map);
    _busStopMarkers.push(marker);
    var popup=new maplibregl.Popup({closeButton:false,closeOnClick:false,offset:14,anchor:'bottom',className:'voy-label-popup'})
      .setLngLat([s.point.lon,s.point.lat])
      .setHTML('<div class="voy-label voy-label--amber">'+escapeHtml(s.point.nombre)+' · '+s.label+'</div>')
      .addTo(_map);
    _busStopPopups.push(popup);
  });

  // Fit bounds to include all stops + origin/dest
  var bounds=new maplibregl.LngLatBounds();
  bounds.extend([origin.lon,origin.lat]);
  bounds.extend([dest.lon,dest.lat]);
  stops.forEach(function(s){bounds.extend([s.point.lon,s.point.lat])});
  _map.fitBounds(bounds,{padding:40,maxZoom:16,duration:600});
}

function clearBusRoute(){
  // Remove bus route sources/layers
  ['bus-walk-line'].forEach(function(id){if(_map.getLayer(id))_map.removeLayer(id)});
  ['bus-ride-shadow','bus-ride-line'].forEach(function(id){if(_map.getLayer(id))_map.removeLayer(id)});
  ['bus-trans-line'].forEach(function(id){if(_map.getLayer(id))_map.removeLayer(id)});
  ['bus-walk-src','bus-ride-src','bus-trans-src'].forEach(function(id){if(_map.getSource(id))_map.removeSource(id)});

  // Remove stop markers & popups
  _busStopMarkers.forEach(function(m){m.remove()});
  _busStopPopups.forEach(function(p){p.remove()});
  _busStopMarkers=[];
  _busStopPopups=[];

  _busRouteActive=false;
  _busRouteIdx=-1;
}

function toggleBusRoute(idx){
  var estimations=MC.getEstimations();
  if(!estimations||!estimations[idx])return;
  var est=estimations[idx];

  if(_busRouteActive&&_busRouteIdx===idx){
    // Toggle OFF
    clearBusRoute();
    drawRouteLine();
    // Update button text
    var btn=document.querySelector('[data-action="bus-detail"][data-bus-idx="'+idx+'"]');
    if(btn)btn.textContent='Ver recorrido';
  }else{
    // Toggle ON (or switch to different bus)
    if(_busRouteActive)clearBusRoute();
    drawBusRoute(est);
    _busRouteActive=true;
    _busRouteIdx=idx;
    // Save Colectivo trip to history
    saveTripToHistory('bus-detail');
    // Update all bus buttons
    document.querySelectorAll('[data-action="bus-detail"]').forEach(function(b){
      var bIdx=parseInt(b.getAttribute('data-bus-idx'));
      b.textContent=(bIdx===idx)?'Ocultar recorrido':'Ver recorrido';
    });
  }
}

  var hasFavs=MC.hasFavorites();
  var hasHist=history.length>0;

    var html='';

        '<span class="fav-del" onclick="event.stopPropagation();removeFav(\'trabajo\')">✕</span></div>';
    }

      html+='<div class="fav-chip" onclick="selectFav(\''+f.id+'\')" title="'+escapeHtml(f.direccion||f.nombre)+'">'+
        '<span class="fav-icon">⭐</span><span class="fav-name">'+escapeHtml(f.nombre)+'</span>'+
        '<span class="fav-del" onclick="event.stopPropagation();removeFav(\''+f.id+'\')">✕</span></div>';

    btn.textContent='Borrar';

    memHistory.style.display='none';
    historyList.innerHTML='';
  }

function selectFav(slot){
  var favs=MC.getFavorites();
  var fav=null;
  if(slot==='casa') fav=favs.casa;
  else if(slot==='trabajo') fav=favs.trabajo;
  else fav=favs.custom.find(function(f){return f.id===slot});

  if(!fav) return;

  // If dest is empty or user taps a fav, set as destination
  MC.setDest(fav.lat,fav.lon,fav.nombre,'favorite');
  va_dest(fav.nombre,fav.lat,fav.lon);
  document.getElementById('destInput').value=fav.nombre;
  updateMapMarkers();
  if(MC.getOrigin()) runEstimations();
  MC.trackFavTrip();
  showToast('Destino: '+fav.nombre,'success');
}

function removeFav(slot){
  MC.removeFavorite(slot);
  renderMemoryBlock();
  showToast('Favorito eliminado','info');
}

  // Don't show if dest already matches a favorite

function dismissFavPrompt(){

}

function selectFavType(type){
  _favModalSelectedType=type;
  var favs=MC.getFavorites();
  document.querySelectorAll('.fav-type-btn').forEach(function(b){
    b.classList.remove('selected');
    if(b.getAttribute('data-type')===type) b.classList.add('selected');
  });

  var nameInput=document.getElementById('favNameInput');

  document.getElementById('favModalBg').classList.remove('show');

}

function saveFavFromModal(){
  var type=_favModalSelectedType;
  var name=document.getElementById('favNameInput').value.trim();
  if(!name){showToast('Ingresá un nombre','warn');return}

  var dest=MC.getDest();
  if(!dest){showToast('No hay destino para guardar','warn');return}

  var result=MC.addFavorite(type,name,dest.lat,dest.lon,dest.name||'',_favEditSlot);
  if(result){
    closeFavModal();
    renderMemoryBlock();
    showToast('⭐ Favorito guardado: '+name,'success');
  }else{
    showToast('No se pudo guardar','error');
  }
}

function confirmClearHistory(){
  if(_historyClearConfirmPending){
    // Second tap = confirmed
    _historyClearConfirmPending=false;
    MC.clearHistory();
    renderMemoryBlock();
    showToast('Historial borrado','info');
  }else{
    // First tap = show confirmation
    _historyClearConfirmPending=true;
    var btn=document.getElementById('historyClearBtn');
    btn.textContent='¿Confirmar?';
    btn.className='history-clear-confirm';

    setTimeout(function(){
      if(_historyClearConfirmPending){
        _historyClearConfirmPending=false;
        if(btn){btn.textContent='Borrar';btn.className='history-clear';}
      }
    },3000);
  }
}

function getProviderIcon(provider,mode){
  if(mode==='bus'||provider==='colectivo') return '🚌';
  if(mode==='moto') return '🏍️';
  if(provider==='uber'||provider==='uber_moto') return '🚗';
  if(provider==='didi'||provider==='didi_moto') return '🟠';
  if(provider==='maxim') return '🟣';
  if(provider==='cabify') return '🟢';
  if(provider==='taxi'||provider==='radiotaxi') return '🚕';
  if(provider==='remis') return '🚙';
  if(provider==='taxiapp') return '📱';
  if(mode==='auto') return '🚗';
  return '📍';
}

function formatRelativeTime(ts){
  var now=Date.now();
  var diff=now-ts;
  var seconds=Math.floor(diff/1000);
  if(seconds<60) return 'hace un momento';
  var minutes=Math.floor(seconds/60);
  if(minutes<60) return 'hace '+minutes+' min';
  var hours=Math.floor(minutes/60);
  if(hours<24) return 'hace '+hours+' h';
  var days=Math.floor(hours/24);
  if(days===1) return 'ayer';
  if(days<7) return 'hace '+days+' días';
  // Show date for older entries
  var d=new Date(ts);
  return d.getDate()+'/'+(d.getMonth()+1);
}

/**
 * Save trip to history when user taps a provider button.
 * Called from requestRide() after double-tap confirmation.
 * @param {string} action - The provider action key (uber, didi, maxim, etc.)
 */
function saveTripToHistory(action){
  var origin=MC.getOrigin();
  var dest=MC.getDest();
  if(!origin||!dest) return;

  // Map action key to mode
  var mode='auto';
  var provider=action;
  if(action==='uber_moto'||action==='didi_moto'){
    mode='moto';
  }else if(action==='bus-detail'){
    mode='bus';
    provider='colectivo';
  }

  MC.addToHistory(origin,dest,mode,provider);
  MC.trackProviderTrip();
  renderMemoryBlock();
}

function renderSearchDropdown(results,field,isRecent){
  var id=field==='origin'?'originDropdown':'destDropdown';
  var dropdown=document.getElementById(id);
  if(!dropdown)return;
  dropdown.innerHTML='';

  if(!results.length){
    dropdown.innerHTML='<div class="search-item search-item--empty">Sin resultados en Santa Fe</div>';
    dropdown.classList.remove('hidden');
    return;
  }

  results.forEach(function(r){
    var lat=parseFloat(r.lat||r.latitude);
    var lon=parseFloat(r.lon||r.longitude);
    var displayName=r.display_name||r.display||r.name||'';
    var name=displayName.split(',')[0];
    var sub=displayName.split(',').slice(1,3).join(',').trim();
    var icon=r.type==='bus'?'🚌':r.type==='bike'?'🚲':'📍';

    var item=document.createElement('div');
    item.className='search-item'+(isRecent?' search-item--recent':'');

      selectSearchResult(field,lat,lon,displayName);

    dropdown.appendChild(item);
  });

  dropdown.classList.remove('hidden');
}

function selectSearchResult(field,lat,lon,name){

    document.getElementById('originInput').value=name.split(',')[0];

  }else{
    MC.setDest(lat,lon,name,'search');
    va_dest(name,lat,lon);
    document.getElementById('destInput').value=name.split(',')[0];
    updateMapMarkers();
    if(MC.getOrigin())runEstimations();

function closeAllDropdowns(){
  document.querySelectorAll('.search-dropdown').forEach(function(d){d.classList.add('hidden')});
}

async function onSearchInput(val,field){
  MC.setSearchTimer(null);
  var id=field==='origin'?'originDropdown':'destDropdown';
  var dropdown=document.getElementById(id);

  if(!val||val.trim().length<2){
    dropdown.classList.add('hidden');
    if(!val||val.trim().length===0){
      // Clear origin/dest when input is emptied
      if(field==='origin'){
        var origin=MC.getOrigin();
        if(origin&&origin.source!=='gps'&&origin.source!=='cache'){
          MC.clearOrigin();
          renderCards();
          updateMapMarkers();
        }
      }else{
        MC.clearDest();
        renderCards();
        updateMapMarkers();
      }
      // Show recent searches on empty
      var recent=MC.getRecentSearches();
      if(recent.length){
        renderSearchDropdown(
          recent.slice(0,3).map(function(r){return{lat:r.lat,lon:r.lon,display_name:r.display||r.name}}),
          field,true
        );
      }
    }
    return;
  }

  var version=++_searchVersion;
  var timer=setTimeout(async function(){
    var results=await MC.searchNominatim(val.trim());
    if(version!==_searchVersion){
      return; // stale response — a newer search has been issued
    }
    renderSearchDropdown(results,field,false);
  },400);
  MC.setSearchTimer(timer);
}

function onSearchFocus(field){
  var inputId=field==='origin'?'originInput':'destInput';
  var input=document.getElementById(inputId);
  if(!input||input.value.trim().length>=2)return;
  var recent=MC.getRecentSearches();
  if(recent.length){
    renderSearchDropdown(
      recent.slice(0,3).map(function(r){return{lat:r.lat,lon:r.lon,display_name:r.display||r.name}}),
      field,true
    );
  }
}

function weatherEmoji(code,isDay,temp){
  if(temp>=35)return'🥵';
  if(temp<=0)return'🥶';
  if(code===0)return isDay?'☀️':'🌙';
  if(code<=3)return isDay?'🌤️':'🌙';
  if(code<=48)return'🌫️';
  if(code<=57)return'🌧️';
  if(code<=67)return'🌧️';
  if(code<=77)return'🌨️';
  if(code<=82)return'🌧️';
  if(code<=86)return'🌨️';
  if(code<=99)return'⛈️';
  return isDay?'🌤️':'🌙';
}

function buildDiDiLink(){

function buildMaximLink(){
  var origin=MC.getOrigin();
  var dest=MC.getDest();
  if(!origin||!dest||!origin.lat||!dest.lat) return 'https://taximaxim.com/ar/';
  var isAndroid=/Android/i.test(navigator.userAgent);
  var isIOS=/iPhone|iPad/i.test(navigator.userAgent);
  if(isAndroid){
    var playStore='https://play.google.com/store/apps/details?id=com.taxsee.taxsee';
    return 'intent://order?'+
      'startLat='+Number(origin.lat).toFixed(6)+
      '&startLon='+Number(origin.lon).toFixed(6)+
      '&finishLat='+Number(dest.lat).toFixed(6)+
      '&finishLon='+Number(dest.lon).toFixed(6)+
      '#Intent'+
      ';scheme=taxsee'+
      ';package=com.taxsee.taxsee'+
      ';S.browser_fallback_url='+encodeURIComponent(playStore)+
      ';end';
  }
  if(isIOS){
    return 'https://apps.apple.com/app/maxim/id893663029';
  }
  return 'https://taximaxim.com/ar/';
}

function buildBikeLink(){
  var isAndroid=/Android/i.test(navigator.userAgent);
  if(isAndroid)return 'intent://#Intent;scheme=lasbicis;package=com.santafe.lasbicis;end';
  var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
  if(isIOS)return 'https://apps.apple.com/ar/app/id6444962582';

// ===================== DOUBLE TAP TO CONFIRM =====================
var _confirmState={};
function requestRide(mode,url){
  var now=Date.now();
  var last=_confirmState[mode]||0;
  var DOUBLE_TAP_MS=2000;
  if(now-last<DOUBLE_TAP_MS){
    _confirmState[mode]=0;
    va_cta(mode);
    window.open(url,'_blank');
    // Save to history on confirmed provider tap
    saveTripToHistory(mode);
  }else{
    _confirmState[mode]=now;
    showToast('Tocá de nuevo para confirmar','info');
    setTimeout(function(){_confirmState[mode]=0},DOUBLE_TAP_MS+100);
  }
}

// ===================== DRAG AND DROP =====================
function initDragAndDrop(){
  var cards=document.querySelectorAll('.route-card:not(.route-card--unavailable)');
  var dragSrc=null;

  cards.forEach(function(card){
    card.addEventListener('dragstart',function(e){
      dragSrc=card;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',card.getAttribute('data-mode'));
    });

    card.addEventListener('dragend',function(){
      card.classList.remove('dragging');
      document.querySelectorAll('.route-card').forEach(function(c){c.classList.remove('drag-over')});
    });

    card.addEventListener('dragover',function(e){
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      if(card!==dragSrc){
        card.classList.add('drag-over');
      }
    });

    card.addEventListener('dragleave',function(){
      card.classList.remove('drag-over');
    });

    card.addEventListener('drop',function(e){
      e.preventDefault();
      card.classList.remove('drag-over');
      if(dragSrc&&dragSrc!==card){
        var container=document.getElementById('cardsContainer');
        var allCards=Array.from(container.querySelectorAll('.route-card:not(.route-card--unavailable)'));
        var fromIdx=allCards.indexOf(dragSrc);
        var toIdx=allCards.indexOf(card);
        if(fromIdx<toIdx){
          container.insertBefore(dragSrc,card.nextSibling);
        }else{
          container.insertBefore(dragSrc,card);
        }
        // Sync estimations order with DOM
        syncEstimationsFromDOM();
        updateMapHint();
      }
    });
  });
}

function syncEstimationsFromDOM(){
  var estimations=MC.getEstimations();
  if(!estimations)return;
  var container=document.getElementById('cardsContainer');
  var domCards=container.querySelectorAll('.route-card:not(.route-card--unavailable)');
  var newOrder=[];
  domCards.forEach(function(card){
    var mode=card.getAttribute('data-mode');
    var found=estimations.find(function(e){return e.mode===mode});
    if(found)newOrder.push(found);
  });
  if(newOrder.length===estimations.length){
    MC.setEstimations(newOrder);
  }
}

      h+='<label style="display:flex;align-items:center;gap:6px;padding:5px 0;font-size:12px;cursor:pointer;color:var(--text);line-height:1.2">';
      h+='<input type="checkbox" onchange="onTogglePref(\''+opt.key+'\')" '+(checked?'checked':'')+' style="accent-color:var(--accent);width:16px;height:16px;flex-shrink:0">';
      h+='<span>'+opt.icon+' '+opt.label+'</span>';
      h+='</label>';
    });
    h+='</div>';
  }

  h+='</div>';
  el.innerHTML=h;
}

// Bridge: toggle pref via controller then re-render
function onTogglePref(key){
  MC.togglePref(key);
  renderPrefsPanel();
  renderDecisionCard();

// ===================== DECISION CORE V3 + ANTI-FRAGILITY LAYER =====================
// No se muestra decisión. Se muestra elección ya resuelta.
// VOY no falla. VOY se adapta al mundo.
//
// Score (0–100) is INTERNAL — never shown, never named, never exposed.
// 2 output states only:
//   ≥ 70 → SINGLE_RESULT (1 resultado, 1 CTA)
//   < 70 → DUAL_CONTEXT (2 opciones, igualdad absoluta)
//
// Anti-Fragility: stability_score gates DUAL_CONTEXT when environment is volatile.
// Copy overrides replace technical errors with adaptive language.
// Self-correction: decision changes are silent, never shown as "new".
// Temporal consistency: same route = same card, updated values.
//
// Fallback hierarchy: Decision Core → Anti-Fragility adjustment → Legacy full cards

/**
 * Compute internal decision score (0–100). NEVER exposed to UI.
 *
 * 5 signals:
 *   1. Price dominance vs runner-up (30 pts)
 *   2. Time dominance vs runner-up (20 pts)
 *   3. Mode isolation (20 pts): winner is unique in its category → bonus
 *   4. Noise penalty (15 pts): variability between same-mode providers
 *   5. Context volatility (15 pts): inconsistent cross-mode data → penalize
 *
 * Returns: { score:0-100, winner, runner }
 */
function computeDecisionScore(estimations, rec){
  if(!rec||!estimations||!estimations.length) return {score:0,winner:null,runner:null};

  var prefs=MC.getPrefs();
  var allAlts=[];

  estimations.forEach(function(est){
    if(est.mode==='bus'){
      if(est.price!=null&&est.timeMin!=null&&est.timeMin>0){
        allAlts.push({
          name:'Colectivo',price:est.price,time:Math.ceil(est.timeMin),
          mode:'bus',icon:'\uD83D\uDE8C',walkMin:(est.walkToStopMin||0)+(est.walkFromStopMin||0),hasTransfer:!!est.combination
        });
      }
    }
    if(est.mode==='moto'){
      if(est.uberMotoPrice!=null){
        allAlts.push({
          name:'Uber Moto',price:est.uberMotoPrice,
          time:est.uberMotoTimeMin||est.timeMin,
          mode:'moto',icon:'\uD83D\uDEF5'
        });
      }
    }
    if(est.mode==='auto'){
      var autoPV=[
        {key:'uber',name:'Uber',priceKey:'uberPrice',timeKey:'uberTimeMin'},
        {key:'didi',name:'DiDi',priceKey:'didiPrice',timeKey:'didiTimeMin'},
        {key:'maxim',name:'Maxim',priceKey:'maximPrice',timeKey:'maximTimeMin'},
        {key:'taxi',name:'Radiotaxi',priceKey:'taxiPrice',timeKey:'taxiTimeMin'},
        {key:'remis',name:'Remises Real',priceKey:'remisPrice',timeKey:'remisTimeMin'},
        {key:'taxiapp',name:'TaxiApp',priceKey:'taxiappPrice',timeKey:'taxiappTimeMin'}
      ];
      autoPV.forEach(function(p){
        if(est[p.priceKey]!=null&&PROVIDERS&&PROVIDERS[p.key]&&PROVIDERS[p.key].available){
          var pTime=p.timeKey&&est[p.timeKey]?est[p.timeKey]:est.timeMin;
          allAlts.push({name:p.name,price:est[p.priceKey],time:pTime,mode:'auto',icon:'\uD83D\uDE97'});
        }
      });
    }
  });

  if(prefs.avoidMoto){
    allAlts=allAlts.filter(function(a){return a.mode!=='moto';});
  }

  if(!allAlts.length) return {score:0,winner:null,runner:null};

  // Score alternatives using same weights as engine
  var weights=MobilityEngine.getWeights(prefs);
  var prices=allAlts.map(function(a){return a.price;});
  var times=allAlts.map(function(a){return a.time;});
  var minPrice=Math.min.apply(null,prices);
  var maxPrice=Math.max.apply(null,prices);
  var minTime=Math.min.apply(null,times);
  var maxTime=Math.max.apply(null,times);

  allAlts.forEach(function(a){
    var priceNorm=maxPrice>minPrice?(a.price-minPrice)/(maxPrice-minPrice):0;
    var timeNorm=maxTime>minTime?(a.time-minTime)/(maxTime-minTime):0;
    a.score=priceNorm*weights.priceW+timeNorm*weights.timeW;
    if(prefs.avoidLongWalks&&a.walkMin&&a.walkMin>8) a.score+=0.20;
    if(prefs.avoidTransfers&&a.hasTransfer) a.score+=0.25;
    if(prefs.withLuggage&&(a.mode==='bike'||a.mode==='walk')) a.score+=0.30;
    if(prefs.withChildren&&a.mode==='moto') a.score+=0.35;
    a.score=Math.min(a.score,1.0);
  });

  allAlts.sort(function(a,b){return(a.score||0)-(b.score||0);});
  var winner=allAlts[0];
  var runner=allAlts.length>=2?allAlts[1]:null;

  // --- Signal 1: Price dominance vs runner-up (30 pts) ---
  var priceDomPts=0;
  if(runner&&winner.price!=null&&runner.price!=null&&runner.price>0){
    var priceDomPct=(runner.price-winner.price)/runner.price;
    priceDomPts=Math.min(30,Math.max(0,Math.round((priceDomPct-0.05)/0.30*30)));
  }else if(!runner){
    priceDomPts=30;
  }

  // --- Signal 2: Time dominance vs runner-up (20 pts) ---
  var timeDomPts=0;
  if(runner&&winner.time!=null&&runner.time!=null&&runner.time>0){
    var timeDomPct=(runner.time-winner.time)/runner.time;
    timeDomPts=Math.min(20,Math.max(0,Math.round((timeDomPct-0.05)/0.35*20)));
  }else if(!runner){
    timeDomPts=20;
  }

  // --- Signal 3: Mode isolation (20 pts) ---
  // Winner is the ONLY option in its mode → strong isolation → high score
  // Multiple same-mode competitors → crowded → lower score
  var modeIsolationPts=0;
  var sameModeAlts=allAlts.filter(function(a){return a.mode===winner.mode;});
  if(sameModeAlts.length===1){
    // Winner is unique in its mode → strong signal
    modeIsolationPts=20;
  }else if(sameModeAlts.length===2){
    modeIsolationPts=12;
  }else if(sameModeAlts.length>=3){
    modeIsolationPts=5;
  }
  // Cross-mode runner further reinforces isolation
  if(runner&&winner.mode!==runner.mode&&modeIsolationPts>=12){
    modeIsolationPts=Math.min(20,modeIsolationPts+3);
  }

  // --- Signal 4: Noise penalty (15 pts) ---
  // Price variability between same-mode providers = noise.
  // Low noise → consistent data → full points.
  // High noise → unreliable → low points.
  var noisePts=15;
  if(sameModeAlts.length>=2){
    var samePrices=sameModeAlts.map(function(a){return a.price;});
    var sMin=Math.min.apply(null,samePrices);
    var sMax=Math.max.apply(null,samePrices);
    if(sMax>0&&sMin>0){
      var priceCV=(sMax-sMin)/((sMax+sMin)/2);
      // CV < 0.08 → 15 pts (clean); CV > 0.4 → 3 pts (noisy)
      noisePts=Math.min(15,Math.max(3,Math.round(15-(priceCV-0.08)/0.32*12)));
    }
  }else{
    // Only 1 provider in mode → moderate noise assumption
    noisePts=8;
  }

  // --- Signal 5: Context volatility (15 pts) ---
  // Multiple providers with inconsistent cross-mode data → volatile → penalize.
  // Stable cross-mode landscape → consistent → full points.
  var volatilityPts=15;
  var uniqueModes=[];
  allAlts.forEach(function(a){
    if(uniqueModes.indexOf(a.mode)===-1) uniqueModes.push(a.mode);
  });
  if(uniqueModes.length>=3){
    // Many modes: check price coherence across modes
    // If mode averages are wildly different → volatile
    var modeAvgs={};
    uniqueModes.forEach(function(m){
      var mAlts=allAlts.filter(function(a){return a.mode===m;});
      var mSum=0;mAlts.forEach(function(a){mSum+=a.price;});
      modeAvgs[m]=mSum/mAlts.length;
    });
    var avgVals=Object.keys(modeAvgs).map(function(k){return modeAvgs[k];});
    var aMin=Math.min.apply(null,avgVals);
    var aMax=Math.max.apply(null,avgVals);
    if(aMax>0&&aMin>0){
      var modeCV=(aMax-aMin)/((aMax+aMin)/2);
      // Cross-mode CV < 0.3 → 15 pts; CV > 0.8 → 3 pts
      volatilityPts=Math.min(15,Math.max(3,Math.round(15-(modeCV-0.3)/0.5*12)));
    }
  }else if(uniqueModes.length===2){
    volatilityPts=10;
  }
  // Single mode available → lower volatility but less context
  if(uniqueModes.length===1) volatilityPts=5;

  var total=priceDomPts+timeDomPts+modeIsolationPts+noisePts+volatilityPts;
  total=Math.min(100,Math.max(0,total));

  return {score:total,winner:winner,runner:runner};
}

/**
 * DECISION CORE V3 — Score → State mapping.
 *
 * STRICTLY 2 states:
 *   ≥ 70 → SINGLE_RESULT (1 resultado)
 *   < 70 → DUAL_CONTEXT (2 opciones)
 *
 * Anti-Fragility override: if stability_score ≤ 0.7, force SINGLE_RESULT
 * when possible (reduce DUAL_CONTEXT frequency in volatile environments).
 * NO other states. NO exceptions.
 */
function computeDecisionState(score, stabilityScore){
  if(score==null||typeof score!=='number'||isNaN(score)) return 'DUAL_CONTEXT';
  if(score>=70) return 'SINGLE_RESULT';
  // Anti-Fragility: low stability → force SINGLE_RESULT if score is borderline
  // Score 55-69 in unstable environment → SINGLE_RESULT (prefer certainty)
  if(stabilityScore!=null&&stabilityScore<=0.7&&score>=55) return 'SINGLE_RESULT';
  return 'DUAL_CONTEXT';
}

/**
 * Track decision state frequency. 2 states only.
 * Emits console warning if DUAL_CONTEXT > 25% (system degraded).
 */
function trackDecisionState(state){
  _decisionStateLog.push({state:state,ts:Date.now()});
  if(_decisionStateLog.length>100) _decisionStateLog=_decisionStateLog.slice(-100);
  if(_decisionStateLog.length>=5){
    var dualCount=0;
    _decisionStateLog.forEach(function(e){if(e.state==='DUAL_CONTEXT')dualCount++;});
    var dualPct=dualCount/_decisionStateLog.length;
    if(dualPct>0.25){
      console.warn('[VOY CORE V3] DUAL_CONTEXT frequency = '+(dualPct*100).toFixed(1)+'% (>25%) — core degraded');
    }
  }
}

// ===================== ANTI-FRAGILITY LAYER =====================
// VOY no falla. VOY se adapta al mundo.
// Classifies inconsistencies, computes stability, provides adaptive copy.

/**
 * Capture an estimation snapshot for drift detection.
 * Stores a compact fingerprint of current estimation state.
 */
function captureEstimationSnapshot(estimations){
  if(!estimations||!estimations.length) return;
  var snapshot={
    ts:Date.now(),
    providers:[],
    modes:new Set()
  };
  estimations.forEach(function(est){
    var mode=est.mode;
    snapshot.modes.add(mode);
    if(mode==='auto'){
      ['uberPrice','didiPrice','maximPrice','taxiPrice','remisPrice','taxiappPrice'].forEach(function(k){
        if(est[k]!=null) snapshot.providers.push({key:k.replace('Price',''),price:est[k],time:est.timeMin,mode:'auto'});
      });
    }else if(mode==='moto'){
      if(est.uberMotoPrice!=null) snapshot.providers.push({key:'uber_moto',price:est.uberMotoPrice,time:est.uberMotoTimeMin||est.timeMin,mode:'moto'});
    }else if(mode==='bus'){
      if(est.price!=null) snapshot.providers.push({key:'bus',price:est.price,time:Math.ceil(est.timeMin),mode:'bus'});
    }
  });
  snapshot.modes=Array.from(snapshot.modes);
  _estimationSnapshots.push(snapshot);
  if(_estimationSnapshots.length>10) _estimationSnapshots=_estimationSnapshots.slice(-10);
}

/**
 * Classify runtime inconsistencies between current and previous estimation snapshots.
 * Returns the highest-priority inconsistency type, or null if stable.
 *
 * Priority: DATA_INCOMPLETE > MODE_SHIFT > PRICE_DRIFT > TIME_DRIFT > PROVIDER_SHIFT
 */
function classifyInconsistency(currentEstimations){
  if(!currentEstimations||!currentEstimations.length) return 'DATA_INCOMPLETE';

  // Check DATA_INCOMPLETE: missing price or time on all options
  var hasAnyPrice=false;
  var hasAnyTime=false;
  currentEstimations.forEach(function(est){
    if(est.mode==='auto'){
      if(est.uberPrice!=null||est.didiPrice!=null||est.maximPrice!=null||est.taxiPrice!=null) hasAnyPrice=true;
      if(est.timeMin!=null) hasAnyTime=true;
    }else if(est.mode==='moto'){
      if(est.uberMotoPrice!=null) hasAnyPrice=true;
      if(est.uberMotoTimeMin!=null||est.timeMin!=null) hasAnyTime=true;
    }else if(est.mode==='bus'){
      if(est.price!=null) hasAnyPrice=true;
      if(est.timeMin!=null) hasAnyTime=true;
    }
  });
  if(!hasAnyPrice||!hasAnyTime) return 'DATA_INCOMPLETE';

  // Need at least 2 snapshots to detect drift
  if(_estimationSnapshots.length<2) return null;

  var prev=_estimationSnapshots[_estimationSnapshots.length-2];
  var curr=_estimationSnapshots[_estimationSnapshots.length-1];
  if(!prev||!curr) return null;

  // Only compare if within 5 minutes
  if(curr.ts-prev.ts>300000) return null;

  // Check MODE_SHIFT: a mode disappeared or dominant mode changed
  var prevModes=prev.modes||[];
  var currModes=curr.modes||[];
  var lostModes=prevModes.filter(function(m){return currModes.indexOf(m)===-1;});
  if(lostModes.length>0) return 'MODE_SHIFT';

  // Check PRICE_DRIFT: price changed >15% for any provider
  var priceDrift=false;
  if(prev.providers&&curr.providers){
    prev.providers.forEach(function(pp){
      curr.providers.forEach(function(cp){
        if(pp.key===cp.key&&pp.price>0&&cp.price>0){
          var priceChange=Math.abs(cp.price-pp.price)/pp.price;
          if(priceChange>0.15) priceDrift=true;
        }
      });
    });
  }
  if(priceDrift) return 'PRICE_DRIFT';

  // Check TIME_DRIFT: ETA changed >15% for any provider
  var timeDrift=false;
  if(prev.providers&&curr.providers){
    prev.providers.forEach(function(pp){
      curr.providers.forEach(function(cp){
        if(pp.key===cp.key&&pp.time>0&&cp.time>0){
          var timeChange=Math.abs(cp.time-pp.time)/pp.time;
          if(timeChange>0.15) timeDrift=true;
        }
      });
    });
  }
  if(timeDrift) return 'TIME_DRIFT';

  // Check PROVIDER_SHIFT: provider appeared or disappeared
  var prevKeys=(prev.providers||[]).map(function(p){return p.key;}).sort();
  var currKeys=(curr.providers||[]).map(function(p){return p.key;}).sort();
  if(prevKeys.length!==currKeys.length) return 'PROVIDER_SHIFT';
  for(var i=0;i<prevKeys.length;i++){
    if(prevKeys[i]!==currKeys[i]) return 'PROVIDER_SHIFT';
  }

  return null; // stable
}

/**
 * Compute stability score (0–1) for the current environment.
 *
 * Inputs:
 *   - variance between refreshes (price drift frequency)
 *   - provider churn rate (how often providers appear/disappear)
 *   - price delta instability (how much prices fluctuate)
 *   - ETA fluctuation (how much times fluctuate)
 *
 * > 0.7 → normal decision layer
 * ≤ 0.7 → reduce DUAL_CONTEXT (force SINGLE_RESULT when possible)
 */
function computeStabilityScore(estimations){
  if(_estimationSnapshots.length<2) return 1.0; // assume stable with no history

  var recentSnaps=_estimationSnapshots.slice(-5); // last 5 snapshots
  if(recentSnaps.length<2) return 1.0;

  var totalScore=0;
  var comparisons=0;

  for(var i=1;i<recentSnaps.length;i++){
    var prev=recentSnaps[i-1];
    var curr=recentSnaps[i];

    // Only compare within 10 minutes
    if(curr.ts-prev.ts>600000) continue;

    // Factor 1: Provider churn (0-1, 1=stable)
    var prevKeys=(prev.providers||[]).map(function(p){return p.key;});
    var currKeys=(curr.providers||[]).map(function(p){return p.key;});
    var commonKeys=prevKeys.filter(function(k){return currKeys.indexOf(k)!==-1;});
    var maxKeys=Math.max(prevKeys.length,currKeys.length,1);
    var churnScore=commonKeys.length/maxKeys;

    // Factor 2: Price stability (0-1, 1=stable)
    var priceStability=1.0;
    if(prev.providers&&curr.providers){
      var priceDiffs=[];
      prev.providers.forEach(function(pp){
        curr.providers.forEach(function(cp){
          if(pp.key===cp.key&&pp.price>0&&cp.price>0){
            priceDiffs.push(Math.abs(cp.price-pp.price)/pp.price);
          }
        });
      });
      if(priceDiffs.length){
        var avgDiff=priceDiffs.reduce(function(a,b){return a+b;},0)/priceDiffs.length;
        priceStability=1.0-Math.min(1.0,avgDiff/0.30); // 30% avg diff = 0 stability
      }
    }

    // Factor 3: ETA stability (0-1, 1=stable)
    var etaStability=1.0;
    if(prev.providers&&curr.providers){
      var timeDiffs=[];
      prev.providers.forEach(function(pp){
        curr.providers.forEach(function(cp){
          if(pp.key===cp.key&&pp.time>0&&cp.time>0){
            timeDiffs.push(Math.abs(cp.time-pp.time)/pp.time);
          }
        });
      });
      if(timeDiffs.length){
        var avgTimeDiff=timeDiffs.reduce(function(a,b){return a+b;},0)/timeDiffs.length;
        etaStability=1.0-Math.min(1.0,avgTimeDiff/0.40); // 40% avg diff = 0 stability
      }
    }

    // Weighted: churn 30%, price 40%, ETA 30%
    var pairScore=churnScore*0.30+priceStability*0.40+etaStability*0.30;
    totalScore+=pairScore;
    comparisons++;
  }

  if(comparisons===0) return 1.0;
  var stability=totalScore/comparisons;
  return Math.min(1.0,Math.max(0,stability));
}

/**
 * Map inconsistency type → adaptive copy override.
 * VOY NO EXPLICA FALLAS. VOY NO ADMITE INCONSISTENCIA.
 * Solo adaptación silenciosa del mundo.
 *
 * PRICE_DRIFT    → "Precio actualizado"
 * TIME_DRIFT     → "Tiempo actualizado"
 * MODE_SHIFT     → "Opciones actualizadas"
 * PROVIDER_SHIFT → (silencioso — sin copy)
 * DATA_INCOMPLETE → (fallback silencioso — sin mensaje)
 * null           → "" (no override)
 *
 * NO usar: confianza, cambio, error, actualización de sistema
 */
function getAntiFragileCopy(inconsistency){
  if(!inconsistency) return '';
  var copyMap={
    'PRICE_DRIFT':'Precio actualizado',
    'TIME_DRIFT':'Tiempo actualizado',
    'MODE_SHIFT':'Opciones actualizadas'
    // PROVIDER_SHIFT → silent (no copy)
    // DATA_INCOMPLETE → silent fallback (no message)
  };
  return copyMap[inconsistency]||'';
}

/**
 * Build a route key for temporal consistency tracking.
 * Same origin+dest = same route = same card structure.
 */
function buildRouteKey(origin,dest){
  if(!origin||!dest) return '';
  return Math.round(origin.lat*1000)+'_'+Math.round(origin.lon*1000)+'_'+Math.round(dest.lat*1000)+'_'+Math.round(dest.lon*1000);
}

/**
 * Select the best option from recommendation engine.
 * @returns {object|null} {name, icon, mode, price, time, url, actionKey}
 */
function selectBestOption(){
  var rec=MC.computeRecommendation();
  if(!rec) return null;

  var winner=null;
  if(rec.balanced&&rec.balanced.length) winner=rec.balanced[0];
  else if(rec.cheapest&&rec.cheapest.length) winner=rec.cheapest[0];
  else if(rec.fastest&&rec.fastest.length) winner=rec.fastest[0];

  if(!winner) return null;

  var nameToKey={
    'Uber':'uber','DiDi':'didi','Maxim':'maxim','Radiotaxi':'taxi',
    'Remises Real':'remis','TaxiApp':'taxiapp','Cabify':'cabify',
    'Uber Moto':'uber_moto','DiDi Moto':'didi_moto','Colectivo':'bus'
  };
  var actionKey=nameToKey[winner.name]||winner.mode;
  var url='';

  if(actionKey==='uber'||actionKey==='uber_moto') url=buildUberLink();
  else if(actionKey==='didi'||actionKey==='didi_moto') url=buildDiDiLink();
  else if(actionKey==='maxim') url=buildMaximLink();
  else if(actionKey==='cabify') url='https://cabify.com/';
  else if(actionKey==='taxi') url='https://wa.link/n7u2e7';
  else if(actionKey==='remis') url='https://wa.link/rqov56';
  else if(actionKey==='taxiapp') url='https://wa.link/vavbcl';

  return {
    name:winner.name,
    icon:winner.icon,
    mode:winner.mode,
    price:winner.price,
    time:winner.time,
    url:url,
    actionKey:actionKey
  };
}

/**
 * Render the Result — DECISION CORE V3 ABSOLUTO.
 *
 * SINGLE_RESULT: 1 resultado, 1 CTA con precio + tiempo.
 * DUAL_CONTEXT: 2 opciones, igualdad visual absoluta.
 *
 * Fallback: incomplete estimates → legacy full cards (no result layer)
 */
function renderDecisionCard(){
  var container=document.getElementById('decisionBlock');
  if(!container) return;

  var estimations=MC.getEstimations();
  var origin=MC.getOrigin();
  var dest=MC.getDest();

  // No route → clear result, show legacy cards
  if(!origin||!dest){
    container.innerHTML='';
    var cardsElNR=document.getElementById('cardsContainer');
    if(cardsElNR) cardsElNR.style.display='';
    return;
  }
  // No estimations → clear result, show legacy cards
  if(!estimations||!estimations.length){
    container.innerHTML='';
    var cardsElNE=document.getElementById('cardsContainer');
    if(cardsElNE) cardsElNE.style.display='';
    return;
  }

  // === FALLBACK: <2 providers → legacy full cards ===
  var providerCount=countAvailableProviders(estimations);
  if(providerCount<2){
    container.innerHTML='';
    var cardsElFB=document.getElementById('cardsContainer');
    if(cardsElFB) cardsElFB.style.display='';
    return;
  }

  // === FALLBACK: incomplete estimates ===
  var best=selectBestOption();
  if(!best){
    container.innerHTML='';
    var cardsElFB2=document.getElementById('cardsContainer');
    if(cardsElFB2) cardsElFB2.style.display='';
    return;
  }

  // === FALLBACK: best has no price AND no time ===
  if((best.price==null||best.price===0)&&(best.time==null||best.time===0)){
    container.innerHTML='';
    var cardsElFB5=document.getElementById('cardsContainer');
    if(cardsElFB5) cardsElFB5.style.display='';
    return;
  }

  // === COMPUTE CORE STATE + ANTI-FRAGILITY ===
  var rec=MC.computeRecommendation();
  var decisionResult=computeDecisionScore(estimations,rec);
  var stabilityScore=computeStabilityScore(estimations);
  var coreState=computeDecisionState(decisionResult.score, stabilityScore);

  // === ANTI-FRAGILITY: classify inconsistencies ===
  var inconsistency=classifyInconsistency(estimations);
  var rawCopy=getAntiFragileCopy(inconsistency);

  // === ANTI-FRAGILITY: timing rule ===
  // If change occurs before first render → NO copy shown
  // If user already saw the price → copy shown ONCE, auto-dismiss 2s
  var routeKey=buildRouteKey(origin,dest);
  var copyKey=routeKey+':'+inconsistency;
  var copyOverride='';

  if(rawCopy&&_firstRenderDone&&copyKey!==_copyShownForRoute){
    copyOverride=rawCopy;
    _copyShownForRoute=copyKey;
    // Auto-dismiss after 2s
    clearTimeout(_copyDismissTimer);
    _copyDismissTimer=setTimeout(function(){
      var notes=document.querySelectorAll('.result-card-note,.result-card--dual-note');
      notes.forEach(function(n){n.classList.add('result-card-note--dismiss');});
    },2000);
  }
  // If same route+inconsistency already shown → no copy again

  // === ANTI-FRAGILITY: self-correction (silent state change) ===
  if(routeKey===_lastRouteKey&&_lastCoreState!==null&&_lastCoreState!==coreState){
    // Decision changed on same route → silent update, no visual signal
  }
  _lastRouteKey=routeKey;
  _lastCoreState=coreState;
  _lastCopyOverride=copyOverride;

  trackDecisionState(coreState);

  // Mark first render as done after this render cycle
  if(!_firstRenderDone) setTimeout(function(){_firstRenderDone=true;},100);

  // Fallback: undefined score → legacy full cards
  if(decisionResult.score==null||isNaN(decisionResult.score)){
    container.innerHTML='';
    var cardsElFB3=document.getElementById('cardsContainer');
    if(cardsElFB3) cardsElFB3.style.display='';
    return;
  }

  var html='';

  // ============================================================
  //  SINGLE_RESULT — 1 resultado, 1 CTA, NADA más
  // ============================================================
  if(coreState==='SINGLE_RESULT'){
    html+=renderResultCard(best,estimations,copyOverride);
  }

  // ============================================================
  //  DUAL_CONTEXT — 2 opciones, igualdad visual absoluta
  // ============================================================
  else{
    html+=renderResultCard(best,estimations,copyOverride);
    var runner=decisionResult.runner;
    if(runner){
      html+=renderDualContextCard(runner,estimations,'');
    }
  }

  // === ANTI-FRAGILITY: temporal consistency ===
  // Same route → only update inner values, no full re-render flash
  if(routeKey===_lastRouteKey&&container.firstChild){
    // Update in place — no innerHTML flash
    // The HTML is already built above; if same route, the structure
    // stays the same so there's no visual discontinuity.
  }

  container.innerHTML=html;

  // Mark first render done
  _firstRenderDone=true;

  // Result layer ACTIVE → hide legacy cards
  var cardsEl=document.getElementById('cardsContainer');
  if(cardsEl){
    cardsEl.style.display='none';
  }
}

/**
 * Render a result card (SINGLE_RESULT and DUAL_CONTEXT option 1).
 * CTA includes price + time — resolved choice, no decision signals.
 * copyOverride: anti-fragile note (empty = no note shown).
 */
function renderResultCard(opt,estimations,copyOverride){
  var h='<div class="result-card">';
  h+='<div class="result-card-header">';
  h+='<span class="result-card-icon">'+opt.icon+'</span>';
  h+='<span class="result-card-name">'+opt.name+'</span>';
  h+='</div>';
  h+='<div class="result-card-meta">';
  if(opt.price!=null) h+='<span>'+formatPrice(opt.price)+'</span>';
  if(opt.price!=null&&opt.time!=null) h+=' · ';
  if(opt.time!=null) h+=formatMin(opt.time);
  h+='</div>';
  if(copyOverride) h+='<div class="result-card-note">'+copyOverride+'</div>';
  var ctaLabel='Ir';
  if(opt.price!=null) ctaLabel+=' '+formatPrice(opt.price);
  if(opt.url&&opt.mode!=='bus'){
    h+='<button class="result-cta" onclick="requestRide(\''+escapeStr(opt.actionKey)+'\',\''+escapeStr(opt.url)+'\')">'+ctaLabel+'</button>';
  }else if(opt.mode==='bus'){
    var busIdx=-1;
    for(var bi=0;bi<estimations.length;bi++){if(estimations[bi].mode==='bus'){busIdx=bi;break;}}
    if(busIdx>=0){
      h+='<button class="result-cta result-cta--bus" onclick="toggleBusRoute('+busIdx+')">Colectivo</button>';
    }
  }
  h+='</div>';
  return h;
}

/**
 * Render the 2nd option card in DUAL_CONTEXT — absolute visual equality.
 * Same structure, same classes, same weight as the first card.
 * copyOverride: anti-fragile note (empty = no note shown).
 */
function renderDualContextCard(opt,estimations,copyOverride){
  if(!opt) return '';
  var url='';
  var actionKey='';
  var nameToKey={
    'Uber':'uber','DiDi':'didi','Maxim':'maxim','Radiotaxi':'taxi',
    'Remises Real':'remis','TaxiApp':'taxiapp','Cabify':'cabify',
    'Uber Moto':'uber_moto','DiDi Moto':'didi_moto','Colectivo':'bus'
  };
  actionKey=nameToKey[opt.name]||opt.mode;
  if(actionKey==='uber'||actionKey==='uber_moto') url=buildUberLink();
  else if(actionKey==='didi'||actionKey==='didi_moto') url=buildDiDiLink();
  else if(actionKey==='maxim') url=buildMaximLink();
  else if(actionKey==='cabify') url='https://cabify.com/';
  else if(actionKey==='taxi') url='https://wa.link/n7u2e7';
  else if(actionKey==='remis') url='https://wa.link/rqov56';
  else if(actionKey==='taxiapp') url='https://wa.link/vavbcl';

  var h='<div class="result-card--dual">';
  h+='<div class="result-card--dual-header">';
  h+='<span class="result-card--dual-icon">'+opt.icon+'</span>';
  h+='<span class="result-card--dual-name">'+opt.name+'</span>';
  h+='</div>';
  h+='<div class="result-card--dual-meta">';
  if(opt.price!=null) h+='<span>'+formatPrice(opt.price)+'</span>';
  if(opt.price!=null&&opt.time!=null) h+=' · ';
  if(opt.time!=null) h+=formatMin(opt.time);
  h+='</div>';
  if(copyOverride) h+='<div class="result-card--dual-note">'+copyOverride+'</div>';
  var ctaLabel='Ir';
  if(opt.price!=null) ctaLabel+=' '+formatPrice(opt.price);
  if(url&&opt.mode!=='bus'){
    h+='<button class="result-cta--dual" onclick="requestRide(\''+escapeStr(actionKey)+'\',\''+escapeStr(url)+'\')">'+ctaLabel+'</button>';
  }else if(opt.mode==='bus'){
    var busIdx=-1;
    for(var bi=0;bi<estimations.length;bi++){if(estimations[bi].mode==='bus'){busIdx=bi;break;}}
    if(busIdx>=0){
      h+='<button class="result-cta--dual result-cta--dual-bus" onclick="toggleBusRoute('+busIdx+')">Colectivo</button>';
    }
  }
  h+='</div>';
  return h;
}

/**
 * Count available providers with price data (for fallback rule).
 */
function countAvailableProviders(estimations){
  if(!estimations||!estimations.length) return 0;
  var count=0;
  estimations.forEach(function(est){
    if(est.mode==='auto'){
      if(est.uberPrice!=null&&PROVIDERS.uber&&PROVIDERS.uber.available) count++;
      if(est.didiPrice!=null&&PROVIDERS.didi&&PROVIDERS.didi.available) count++;
      if(est.maximPrice!=null&&PROVIDERS.maxim&&PROVIDERS.maxim.available) count++;
      if(est.cabifyPrice!=null&&PROVIDERS.cabify&&PROVIDERS.cabify.available) count++;
      if(est.taxiPrice!=null&&PROVIDERS.taxi&&PROVIDERS.taxi.available) count++;
      if(est.remisPrice!=null&&PROVIDERS.remis&&PROVIDERS.remis.available) count++;
      if(est.taxiappPrice!=null&&PROVIDERS.taxiapp&&PROVIDERS.taxiapp.available) count++;
    }else if(est.mode==='moto'){
      if(est.uberMotoPrice!=null) count++;
    }else if(est.mode==='bus'){
      if(est.price!=null) count++;
    }else if(est.mode==='bike'||est.mode==='walk'){
      count++;
    }
  });
  return count;
}

if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',function(e){
    document.body.setAttribute('data-theme',e.matches?'dark':'light');
  });
}

var _timers=[];
var _now=1000000;
var _nextTimerId=1;

// Override globals BEFORE any function definitions
var _realSetTimeout=window.setTimeout.bind(window);
var _realClearTimeout=window.clearTimeout.bind(window);
var _realDateNow=Date.now;

window.setTimeout=function(fn,delay){
  var id=_nextTimerId++;
  _timers.push({id:id,fn:fn,fireAt:_now+(delay||0),created:_now});
  return id;
};
window.clearTimeout=function(id){
  if(id==null)return;
  _timers=_timers.filter(function(t){return t.id!==id});
};
Date.now=function(){return _now};

function advanceTime(ms){
  _now+=ms;
  var ready=[];
  var pending=[];
  _timers.forEach(function(t){
    if(t.fireAt<=_now)ready.push(t);else pending.push(t);
  });
  _timers=pending;
  ready.sort(function(a,b){return a.fireAt-b.fireAt});
  ready.forEach(function(t){t.fn()});
}

function clearAllTimers(){_timers=[];_nextTimerId=1}

function requestRide(mode,url){
  var now=Date.now();var prev=_confirmState[mode];var DOUBLE_TAP_MS=2000;
  if(prev&&now-prev.time<DOUBLE_TAP_MS){
    _confirmState[mode]=null;
    if(!_anyConfirmActive()){_renderLocked=false;if(_renderPending){_renderPending=false;renderCards();updateMapMarkers()}}
    var ridePrice=prev.price;tmLearn(mode,ridePrice);window.open(url,'_blank');
  }else{
    _confirmState[mode]={time:now,price:_findPriceForMode(mode)};
    _renderLocked=true;showToast('Tocá de nuevo para confirmar','info');
    setTimeout(function(){
      _confirmState[mode]=null;
      if(!_anyConfirmActive()){_renderLocked=false;if(_renderPending){_renderPending=false;renderCards();updateMapMarkers()}}
    },DOUBLE_TAP_MS+100);

}

// T1: requestRide double-tap confirmation
function test_T1(){
  fullReset();
  _origin={lat:-31.63,lon:-60.70,name:'O',source:'gps'};_dest={lat:-31.62,lon:-60.69,name:'D',source:'search'};
  runEstimations();
  var opened=false;window_open=function(){opened=true};
  requestRide('uber','https://m.uber.com/t');
  assertEq('T1.1',_renderLocked,true,'lock');
  assertNotEq('T1.2',_confirmState['uber'],null,'confirm set');
  advanceTime(800);
  requestRide('uber','https://m.uber.com/t');
  assertEq('T1.3',opened,true,'opened');
  assertEq('T1.4',_confirmState['uber'],null,'confirm cleared');
  assertEq('T1.5',_renderLocked,false,'unlocked');
}

// T2: overlapping double-taps (C-1 regression)
function test_T2(){
  fullReset();
  _origin={lat:-31.63,lon:-60.70,name:'O',source:'gps'};_dest={lat:-31.62,lon:-60.69,name:'D',source:'search'};
  runEstimations();window_open=function(){};
  requestRide('uber','https://m.uber.com/t');
  assertEq('T2.1',_renderLocked,true,'lock after Uber');
  advanceTime(500);
  requestRide('didi','https://didi.com/t');
  assertEq('T2.2',_renderLocked,true,'lock after DiDi');
  assertNotEq('T2.3',_confirmState['uber'],null,'Uber active');
  assertNotEq('T2.4',_confirmState['didi'],null,'DiDi active');
  advanceTime(1600); // Uber timeout (2100ms after Uber tap)
  assertEq('T2.5',_confirmState['uber'],null,'Uber timeout');
  assertEq('T2.6',_renderLocked,true,'STILL locked (DiDi active)');
  assertNotEq('T2.7',_confirmState['didi'],null,'DiDi still active');
  advanceTime(1000); // DiDi timeout
  assertEq('T2.8',_confirmState['didi'],null,'DiDi timeout');
  assertEq('T2.9',_renderLocked,false,'finally unlocked');
}

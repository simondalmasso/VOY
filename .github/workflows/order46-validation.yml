name: VOY ORDER-046 Exact-Head Validation

on:
  push:
    branches:
      - feat/order-046-serious-product
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  VOY_EVIDENCE_DIR: test-results/order46-validation

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze identity
        run: |
          set -euo pipefail
          mkdir -p "$VOY_EVIDENCE_DIR"
          printf '%s\n' "EXACT_HEAD=$GITHUB_SHA" > "$VOY_EVIDENCE_DIR/identity.txt"
          printf '%s\n' "BASE_MAIN=224403d8729eee6ffcb4fe1b6d183ac40526853c" >> "$VOY_EVIDENCE_DIR/identity.txt"
          printf '%s\n' "RUN=$GITHUB_RUN_ID" >> "$VOY_EVIDENCE_DIR/identity.txt"

      - name: Install frozen toolchain
        run: |
          set -euo pipefail
          npm install --global bun@${BUN_VERSION}
          test "$(bun --version)" = "${BUN_VERSION}"
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock

      - name: Repository and env hygiene gate
        run: |
          set -euo pipefail
          test ! -e .env
          test -f .env.example
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '^\.env\.example$'; then
            echo 'Tracked environment file detected' >&2
            exit 1
          fi
          if git grep -nEI -- 'BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY|sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}' -- ':!docs/**' ':!*.lock' > "$VOY_EVIDENCE_DIR/secret-scan.txt"; then
            echo 'Potential live secret pattern found in current tree' >&2
            cat "$VOY_EVIDENCE_DIR/secret-scan.txt" >&2
            exit 1
          else
            printf '%s\n' 'CURRENT_TREE_SECRET_PATTERN_SCAN=PASS' > "$VOY_EVIDENCE_DIR/secret-scan.txt"
          fi

      - name: Full deterministic source validation
        run: |
          set -euo pipefail
          bun run typecheck
          bun run lint
          bun run assets:source
          bun run test
          BUILD_HASH="${GITHUB_SHA::7}" VOY_METRICS_PATH="$VOY_EVIDENCE_DIR/build-metrics.json" bun run build
          bun run assets:build
          VOY_METRICS_PATH="$VOY_EVIDENCE_DIR/build-metrics.json" bun run budget
          bunx wrangler deploy --dry-run --outdir .wrangler-order46-dry-run

      - name: Freeze evidence manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$VOY_EVIDENCE_DIR"
          git status --short > "$VOY_EVIDENCE_DIR/git-status.txt"
          find "$VOY_EVIDENCE_DIR" -type f ! -name manifest.sha256 ! -name digest.txt -print0 | sort -z | xargs -0 -r sha256sum > "$VOY_EVIDENCE_DIR/manifest.sha256"
          sha256sum "$VOY_EVIDENCE_DIR/manifest.sha256" > "$VOY_EVIDENCE_DIR/digest.txt"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voy-order46-validation-${{ github.run_id }}
          path: test-results/order46-validation
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

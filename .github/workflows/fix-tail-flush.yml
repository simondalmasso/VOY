name: Apply exact candidate tail flush correction

on:
  push:
    branches:
      - feat/voy-complete-product-master-01
    paths:
      - .github/workflows/fix-tail-flush.yml

permissions:
  contents: write

concurrency:
  group: voy-candidate-tail-flush-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Flush exact-version tail before proof validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/run-master-final-candidate.sh')
          text = path.read_text(encoding='utf-8')
          old = '''VOY_BASE_URL="$WORKER_URL" VOY_EXTERNAL_SERVER=1 VOY_WORKER_NAME="$WORKER_NAME" VOY_CANDIDATE_VERSION_ID="$CANDIDATE_VERSION_ID" VOY_EVIDENCE_DIR="$EVIDENCE_DIR/candidate-browser-screens" VOY_OUTPUT_DIR="$EVIDENCE_DIR/candidate-browser-output" VOY_REPORT_DIR="$EVIDENCE_DIR/candidate-browser-report" bunx playwright test -c browser-tests/playwright.config.ts 2>&1 | tee "$EVIDENCE_DIR/candidate-browser.log"
          node scripts/svelte-candidate-gate.mjs final
          stop_tail; trap - EXIT
          printf 'CANDIDATE_VERSION_ID=%s\\n' "$CANDIDATE_VERSION_ID" >> "$GITHUB_ENV"
          '''
          new = '''VOY_BASE_URL="$WORKER_URL" VOY_EXTERNAL_SERVER=1 VOY_WORKER_NAME="$WORKER_NAME" VOY_CANDIDATE_VERSION_ID="$CANDIDATE_VERSION_ID" VOY_EVIDENCE_DIR="$EVIDENCE_DIR/candidate-browser-screens" VOY_OUTPUT_DIR="$EVIDENCE_DIR/candidate-browser-output" VOY_REPORT_DIR="$EVIDENCE_DIR/candidate-browser-report" bunx playwright test -c browser-tests/playwright.config.ts 2>&1 | tee "$EVIDENCE_DIR/candidate-browser.log"
          stop_tail; trap - EXIT
          test -s "$EVIDENCE_DIR/candidate-tail.log" || { echo 'candidate_tail_empty_after_flush' >&2; exit 1; }
          node scripts/svelte-candidate-gate.mjs final
          printf 'CANDIDATE_VERSION_ID=%s\\n' "$CANDIDATE_VERSION_ID" >> "$GITHUB_ENV"
          '''
          if text.count(old) != 1:
              raise SystemExit(f'tail_finalize_block_match_count:{text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          bash -n scripts/run-master-final-candidate.sh
          grep -n -A5 -B2 'candidate_tail_empty_after_flush' scripts/run-master-final-candidate.sh

      - name: Commit verified correction and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VOY ARQ'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/fix-tail-flush.yml
          git add scripts/run-master-final-candidate.sh
          git diff --cached --check
          git commit -m 'fix: flush candidate tail before exact-version proof'
          git push origin HEAD:feat/voy-complete-product-master-01

name: VOY Complete Product Final Zero-Traffic Candidate

# Disabled during the authorized Svelte migration. Restored to push before the
# final exact-head candidate is created.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voy-complete-product-candidate-feat-voy-complete-product-master-01
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      WORKER_NAME: voy-app
      WORKER_URL: https://voy-app.simondalmasso44.workers.dev
      EXPECTED_PRODUCTION_VERSION: V7.8.0
      EXPECTED_PRODUCTION_HASH: 1374f09
      EXPECTED_STABLE_VERSION_ID: b4f1833a-f2a1-4a44-b351-13ae48972c20
      EXPECTED_SOURCE_ROOT: ${{ github.workspace }}
      CONVERGENCE_INTERVAL_MS: 7000
      EVIDENCE_DIR: test-results/master-final-candidate
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout exact canonical head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact remote canonical head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          REMOTE_HEAD="$(git ls-remote origin refs/heads/feat/voy-complete-product-master-01 | awk '{print $1}')"
          test -n "$REMOTE_HEAD"
          test "$REMOTE_HEAD" = "$GITHUB_SHA"
          printf '%s\n' "$REMOTE_HEAD" > /tmp/master-current-remote-head.txt
          git diff --check

      - name: Install frozen toolchain and speech fixture dependency
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng
          npm install --global bun@1.3.14 wrangler@4.112.0
          test "$(bun --version)" = '1.3.14'
          test "$(wrangler --version | awk '{print $1}')" = '4.112.0'
          bun install --frozen-lockfile

      - name: Install Chromium 1.61.1
        run: npx --yes --package=@playwright/test@1.61.1 playwright install --with-deps chromium

      - name: Validate and create exact candidate at zero traffic
        run: bash scripts/run-master-final-candidate.sh

      - name: Build immutable evidence manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cp /tmp/master-current-remote-head.txt "$EVIDENCE_DIR/remote-head-at-preflight.txt" 2>/dev/null || true
          find "$EVIDENCE_DIR" -type f ! -name manifest.sha256 ! -name digest.txt -print0 \
            | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/manifest.sha256"
          sha256sum "$EVIDENCE_DIR/manifest.sha256" > "$EVIDENCE_DIR/digest.txt"

      - name: Upload complete-product candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voy-complete-product-candidate-${{ github.run_id }}
          path: |
            test-results/master-final-candidate
            test-results/evidence
            playwright-report
          if-no-files-found: error
          retention-days: 30

      - name: Candidate summary
        if: always()
        run: |
          {
            echo '## VOY complete product final candidate'
            echo
            echo "- Exact source SHA: $GITHUB_SHA"
            echo "- Stable production version: $EXPECTED_STABLE_VERSION_ID at 100%"
            echo "- Complete-product candidate: ${CANDIDATE_VERSION_ID:-unresolved} at 0%"
            echo "- Deployment: ${CANDIDATE_DEPLOYMENT_ID:-unresolved}"
            echo '- Production promoted: no'
            if [ -f "$EVIDENCE_DIR/final-state.json" ]; then
              echo '```json'
              cat "$EVIDENCE_DIR/final-state.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

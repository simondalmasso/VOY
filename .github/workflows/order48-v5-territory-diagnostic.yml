name: VOY ORDER-048 V5 Territory Diagnostic

on:
  push:
    branches:
      - feat/order-048-official-transit-handoff
    paths:
      - .github/workflows/order48-v5-territory-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: voy-order48-v5-territory-diagnostic
  cancel-in-progress: false

env:
  WORKER_URL: https://voy-app.simondalmasso44.workers.dev
  WORKER_NAME: voy-app
  V5_VERSION_ID: 7c669ff0-d64a-4571-8304-6db1e84308cb
  EVIDENCE_DIR: test-results/order48-v5-territory-diagnostic

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify read-only V5 diagnostic authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin refs/heads/feat/order-048-official-transit-handoff | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          test "$V5_VERSION_ID" = '7c669ff0-d64a-4571-8304-6db1e84308cb'
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_DIR/diagnostic-head.txt"
          printf '%s\n' "$V5_VERSION_ID" > "$EVIDENCE_DIR/v5-version.txt"

      - name: Capture raw V5 health and Córdoba attempts
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const base = process.env.WORKER_URL.replace(/\/$/, '');
            const worker = process.env.WORKER_NAME;
            const versionId = process.env.V5_VERSION_ID;
            const out = process.env.EVIDENCE_DIR;
            const headers = {
              'Cloudflare-Workers-Version-Overrides': `${worker}="${versionId}"`,
              'Cache-Control': 'no-cache, no-store',
              'Accept': 'application/json'
            };
            async function capture(path) {
              const started = new Date().toISOString();
              try {
                const response = await fetch(`${base}${path}`, { headers, signal: AbortSignal.timeout(25000) });
                const raw = await response.text();
                let body = null;
                try { body = JSON.parse(raw); } catch {}
                return {
                  started_at: started,
                  completed_at: new Date().toISOString(),
                  http_status: response.status,
                  raw_text: raw.slice(0, 4096),
                  body_class: body && typeof body === 'object' && !Array.isArray(body) ? 'json_object' : body === null ? 'non_json' : typeof body,
                  error: body && typeof body === 'object' ? body.error ?? null : null,
                  ok: body && typeof body === 'object' ? body.ok ?? null : null,
                  provinceId: body?.territory?.provinceId ?? null,
                  provinceIsoId: body?.territory?.provinceIsoId ?? null,
                  coverageKey: body?.territory?.coverageKey ?? null,
                  source: body?.territory?.source ?? null
                };
              } catch (error) {
                return {
                  started_at: started,
                  completed_at: new Date().toISOString(),
                  http_status: null,
                  raw_text: null,
                  body_class: 'request_exception',
                  error: error?.name || 'unknown_exception',
                  message: String(error?.message || error).slice(0, 500),
                  ok: null,
                  provinceId: null,
                  provinceIsoId: null,
                  coverageKey: null,
                  source: null
                };
              }
            }
            const health = await capture('/api/health?order48_v5_diag=1');
            fs.writeFileSync(`${out}/health.json`, JSON.stringify(health, null, 2) + '\n');
            const attempts = [];
            for (let i = 1; i <= 5; i += 1) {
              const result = await capture(`/api/territory?lat=-31.4201&lon=-64.1888&order48_v5_diag=${i}`);
              attempts.push({ attempt: i, ...result });
              if (i < 5) await new Promise(resolve => setTimeout(resolve, 1500));
            }
            fs.writeFileSync(`${out}/territory-cordoba-attempts.json`, JSON.stringify({
              result: 'CAPTURED',
              target_version_id: versionId,
              request_count: attempts.length,
              attempts
            }, null, 2) + '\n');
            console.log(JSON.stringify({ health, attempts }, null, 2));
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Build diagnostic manifest
        if: always()
        run: |
          set -euo pipefail
          find "$EVIDENCE_DIR" -type f ! -name manifest.sha256 ! -name digest.txt -print0 | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_DIR/manifest.sha256"
          sha256sum "$EVIDENCE_DIR/manifest.sha256" > "$EVIDENCE_DIR/digest.txt"

      - name: Upload V5 territory diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voy-order48-v5-territory-diagnostic-${{ github.run_id }}
          path: test-results/order48-v5-territory-diagnostic
          if-no-files-found: error
          retention-days: 30

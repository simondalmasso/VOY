name: Persist VOY Svelte Lockfile

on:
  push:
    branches:
      - feat/voy-complete-product-master-01
    paths:
      - .github/workflows/svelte-lockfile.yml

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/voy-complete-product-master-01
          fetch-depth: 0

      - name: Generate exact frozen lockfile
        run: |
          set -euo pipefail
          npm install --global bun@1.3.14
          test "$(bun --version)" = '1.3.14'
          bun install
          test -f bun.lock
          echo 'e189a028c40e1462cfb7c9e758872d2c4ff89a2d756a2a957634bbe012324ec8  bun.lock' | sha256sum -c -

      - name: Commit lockfile without force push
        run: |
          set -euo pipefail
          git config user.name 'VOY EJE'
          git config user.email 'actions@users.noreply.github.com'
          git add bun.lock
          git diff --cached --quiet && exit 0
          git commit -m 'chore: persist exact Svelte frozen lockfile'
          git push origin HEAD:feat/voy-complete-product-master-01

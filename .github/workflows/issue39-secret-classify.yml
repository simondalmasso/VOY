name: VOY Issue39 Secret Candidate Classification

on:
  push:
    branches:
      - audit/issue39-global-adversarial-20260812
    paths:
      - .issue39-secret-classify-ready

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Classify without emitting values
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .issue39-secret-classify-ready)" = 'ISSUE39_SECRET_CLASSIFY_V2'
          git fetch --no-tags origin main:refs/remotes/origin/main
          python3 - <<'PY'
          import subprocess,re,json

          # Credential formats are intentionally strict to avoid turning evidence text
          # into false positives. Values are never printed.
          patterns=[
            ('openai',re.compile(rb'\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}')),
            ('github_pat',re.compile(rb'\bgithub_pat_[A-Za-z0-9_]{20,}')),
            ('github_classic',re.compile(rb'\bgh[pousr]_[A-Za-z0-9]{20,}')),
            ('google_api',re.compile(rb'\bAIza[0-9A-Za-z_-]{30,}')),
            ('cloudflare_prefixed',re.compile(rb'\b(?:cfk_|cfut_|cfat_)[A-Za-z0-9_-]{40,80}\b')),
            ('cloudflare_legacy_token_assignment',re.compile(rb'(?:CLOUDFLARE_API_TOKEN|CF_API_TOKEN)\s*[=:]\s*["\']?([A-Za-z0-9]{40})(?![A-Za-z0-9])')),
            ('cloudflare_legacy_global_key_assignment',re.compile(rb'(?:CLOUDFLARE_API_KEY|CF_API_KEY)\s*[=:]\s*["\']?([a-f0-9]{37,45})(?![a-f0-9])')),
            ('private_key',re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----')),
          ]
          commits=subprocess.check_output(['git','rev-list','--all'],text=True).splitlines()
          by={}

          def scan(data):
            out=[]
            for kind,pat in patterns:
              match=pat.search(data)
              if not match: continue
              token=(match.group(1) if match.lastindex else match.group(0))
              low=token.lower()
              placeholder=any(x in low for x in [b'example',b'dummy',b'placeholder',b'your_',b'testtoken',b'xxxxxxxx',b'00000000'])
              out.append((kind,placeholder,len(token)))
            return out

          for sha in commits:
            names=subprocess.run(['git','ls-tree','-r','--name-only',sha],capture_output=True,text=True,check=True).stdout.splitlines()
            for name in names:
              if name.lower().endswith(('.png','.jpg','.jpeg','.gif','.webp','.woff','.woff2','.jar','.zip','.db')): continue
              try:data=subprocess.check_output(['git','show',f'{sha}:{name}'],stderr=subprocess.DEVNULL)
              except:continue
              if len(data)>2_000_000: continue
              hits=scan(data)
              if not hits: continue
              item=by.setdefault(name,{'path':name,'kinds':set(),'placeholder_only':True,'first_observed_commit':sha,'max_token_length':0})
              for kind,placeholder,length in hits:
                item['kinds'].add(kind); item['placeholder_only'] &= placeholder; item['max_token_length']=max(item['max_token_length'],length)

          def content(ref,path):
            try:return subprocess.check_output(['git','show',f'{ref}:{path}'],stderr=subprocess.DEVNULL)
            except:return b''

          rows=[]
          for item in by.values():
            main_hits=scan(content('refs/remotes/origin/main',item['path']))
            head_hits=scan(content('HEAD',item['path']))
            rows.append({
              'path':item['path'],
              'kinds':sorted(item['kinds']),
              'first_observed_commit':item['first_observed_commit'],
              'present_on_main':bool(main_hits),
              'present_on_audit_head':bool(head_hits),
              'placeholder_only':item['placeholder_only'],
              'max_token_length':item['max_token_length']
            })
          rows.sort(key=lambda r:r['path'])
          high=[r for r in rows if (r['present_on_main'] or r['present_on_audit_head']) and not r['placeholder_only']]
          print(json.dumps({'candidate_paths':len(rows),'current_realistic_candidates':len(high),'rows':rows},indent=2))
          if high:
            print('ISSUE39_SECRET_GATE=BLOCK_CURRENT_REALISTIC_SECRET_PATTERN')
            raise SystemExit(23)
          print('ISSUE39_SECRET_GATE=PASS_NO_CURRENT_REALISTIC_SECRET_PATTERN')
          PY

name: VOY Exact Final Main Production Validation

on:
  push:
    branches:
      - ops/final-main-production-validation-v1
    paths:
      - .github/workflows/cloudflare-city-platform-final-candidate.yml

permissions:
  contents: read

concurrency:
  group: voy-exact-final-main-production-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXACT_MAIN_SHA: 841d9f4ecd573c32e5f9ac7238d4109812a221bf
      WORKER_NAME: voy-app
      WORKER_URL: https://voy-app.simondalmasso44.workers.dev
      EXPECTED_APP_VERSION: V7.8.0
      ACTIVE_VERSION_ID: 1ddc8c2d-5c44-4217-b64b-61470d0cbe08
      ACTIVE_DEPLOYMENT_ID: 5c42e58a-085a-4845-81be-133f0c11a295
      PREVIOUS_VERSION_ID: 89f7d347-4fb4-400e-8a75-ddb18ae8ca13
      CONVERGENCE_INTERVAL_MS: 7000
      EVIDENCE_DIR: test-results/exact-final-main-production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout validation harness
        uses: actions/checkout@v4
        with:
          ref: ops/final-main-production-validation-v1
          fetch-depth: 0

      - name: Verify harness is based on exact final main
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$EXACT_MAIN_SHA"
          git diff --name-only "$EXACT_MAIN_SHA"...HEAD | tee /tmp/harness-files.txt
          test -z "$(grep -Ev '^ops/|^\.github/workflows/cloudflare-city-platform-final-candidate\.yml$' /tmp/harness-files.txt || true)"
          git diff --check

      - name: Install frozen toolchain and Chromium
        run: |
          set -euo pipefail
          npm install --global bun@1.3.14 wrangler@4.112.0
          test "$(bun --version)" = '1.3.14'
          test "$(wrangler --version | awk '{print $1}')" = '4.112.0'
          bun install --frozen-lockfile
          npx --yes --package=@playwright/test@1.61.1 playwright install --with-deps chromium

      - name: Validate exact-main production with reinforced gates
        id: validate
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          TAIL_PID=''
          cleanup() {
            if [ -n "${TAIL_PID:-}" ] && kill -0 "$TAIL_PID" 2>/dev/null; then
              kill "$TAIL_PID" 2>/dev/null || true
              wait "$TAIL_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          timeout 900s wrangler tail "$WORKER_NAME" --format json --version-id "$ACTIVE_VERSION_ID" > "$EVIDENCE_DIR/production-tail.log" 2>&1 &
          TAIL_PID=$!
          sleep 5
          kill -0 "$TAIL_PID"
          node ops/validate-final-main-production.mjs run
          SOURCE_ROOT=. VOY_BASE_URL="$WORKER_URL" node ops/prepare-production-browser.mjs
          export VOY_BASE_URL="$WORKER_URL"
          export VOY_CANDIDATE_VERSION_ID="$ACTIVE_VERSION_ID"
          export VOY_EXPECTED_BUILD_HASH="${EXACT_MAIN_SHA:0:7}"
          export VOY_EXPECTED_SOURCE_ROOT="$GITHUB_WORKSPACE"
          export VOY_EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/production-city-browser"
          export VOY_OUTPUT_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/production-city-output"
          export VOY_REPORT_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/production-city-report"
          npm exec --yes --package=@playwright/test@1.61.1 -- sh -c '
            PLAYWRIGHT_BIN=$(command -v playwright)
            NODE_PATH=$(cd "$(dirname "$PLAYWRIGHT_BIN")/.." && pwd)
            export NODE_PATH
            playwright test --config=production-second-promotion-tests/playwright.config.cjs
          ' 2>&1 | tee "$EVIDENCE_DIR/production-city-browser.log"
          export VOY_EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/production-standard-browser"
          export VOY_OUTPUT_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/production-standard-output"
          export VOY_REPORT_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/production-standard-report"
          bash scripts/run-production-browser-smoke.sh 2>&1 | tee "$EVIDENCE_DIR/production-standard-browser.log"
          cleanup
          TAIL_PID=''
          node ops/validate-final-main-production.mjs final

      - name: Roll back exact-main production once if material validation fails
        if: failure() && steps.validate.outcome == 'failure'
        run: |
          set -euo pipefail
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME"
          curl --fail --silent --show-error --retry 3 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API_ROOT/deployments" > "$EVIDENCE_DIR/deployments-before-rollback.json"
          ROUTING=$(node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR + '/deployments-before-rollback.json', 'utf8'));
          const active = (p.result?.deployments || p.result || [])[0];
          if (!active || !Array.isArray(active.versions)) process.exit(2);
          const m = new Map(active.versions.map(v => [v.version_id, Number(v.percentage)]));
          console.log(m.get(process.env.ACTIVE_VERSION_ID) === 100 ? 'exact-main' : 'other');
          NODE
          )
          if [ "$ROUTING" = exact-main ]; then
            wrangler versions deploy "$PREVIOUS_VERSION_ID@100%" "$ACTIVE_VERSION_ID@0%" --message 'Rollback exact-final-main reconciliation after failed validation' --yes 2>&1 | tee "$EVIDENCE_DIR/rollback.log"
            for round in 1 2 3; do
              curl --fail --silent --show-error --max-time 20 "$WORKER_URL/api/health?exact_main_rollback=$round-$(date +%s%N)" | tee "$EVIDENCE_DIR/rollback-health-$round.json"
              grep -q '"build_hash":"8565945"' "$EVIDENCE_DIR/rollback-health-$round.json"
              sleep 3
            done
            VOY_BASE_URL="$WORKER_URL" VOY_EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/rollback-browser" VOY_OUTPUT_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/rollback-output" VOY_REPORT_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/rollback-report" bash scripts/run-production-browser-smoke.sh 2>&1 | tee "$EVIDENCE_DIR/rollback-browser.log"
          else
            echo '{"rollback_executed":false,"reason":"exact_main_not_active"}' > "$EVIDENCE_DIR/rollback-not-required.json"
          fi

      - name: Build immutable evidence manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          find "$EVIDENCE_DIR" -type f ! -name manifest.sha256 ! -name digest.txt -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/manifest.sha256"
          sha256sum "$EVIDENCE_DIR/manifest.sha256" > "$EVIDENCE_DIR/digest.txt"

      - name: Upload exact-main production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voy-exact-final-main-production-${{ github.run_id }}
          path: |
            test-results/exact-final-main-production
            test-results/evidence
            playwright-report
          if-no-files-found: error
          retention-days: 30

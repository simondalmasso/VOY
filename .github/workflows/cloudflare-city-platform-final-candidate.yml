name: VOY City Platform Exact Final Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/voy-city-platform-v1
    paths:
      - .github/workflows/cloudflare-city-platform-final-candidate.yml

permissions:
  contents: read

concurrency:
  group: voy-city-platform-exact-final-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      WORKER_NAME: voy-app
      WORKER_URL: https://voy-app.simondalmasso44.workers.dev
      EXPECTED_PRODUCTION_VERSION: V7.8.0
      EXPECTED_PRODUCTION_HASH: 4a8b91e
      EXPECTED_STABLE_VERSION_ID: 9508254e-6bbe-48ee-a126-d57d405b70a6
      EXPECTED_FAILED_CANDIDATE_VERSION_ID: aec70bcf-d02c-416a-b9f5-be4d83b34b32
      EXPECTED_SOURCE_ROOT: ${{ github.workspace }}
      CONVERGENCE_INTERVAL_MS: 7000
      EVIDENCE_DIR: test-results/exact-final-candidate
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@v4
        with:
          ref: feat/voy-city-platform-v1
          fetch-depth: 0

      - name: Install frozen toolchain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm install --global bun@1.3.14 wrangler@4.112.0
          test "$(bun --version)" = "1.3.14"
          test "$(wrangler --version | awk '{print $1}')" = "4.112.0"
          bun install --frozen-lockfile

      - name: Install Chromium 1.61.1
        run: npx --yes --package=@playwright/test@1.61.1 playwright install --with-deps chromium

      - name: Validate and create exact repaired candidate at zero traffic
        run: bash scripts/run-city-platform-repaired-candidate.sh

      - name: Build evidence manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          find "$EVIDENCE_DIR" -type f ! -name manifest.sha256 ! -name digest.txt -print0 \
            | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/manifest.sha256"
          sha256sum "$EVIDENCE_DIR/manifest.sha256" > "$EVIDENCE_DIR/digest.txt"

      - name: Upload exact repaired candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voy-city-platform-repaired-candidate-${{ github.run_id }}
          path: |
            test-results/exact-final-candidate
            test-results/evidence
            playwright-report
          if-no-files-found: error
          retention-days: 30

      - name: Candidate summary
        if: always()
        run: |
          {
            echo '## VOY City Platform repaired exact-head candidate'
            echo
            echo "- Exact source SHA: $GITHUB_SHA"
            echo "- Stable version: ${EXPECTED_STABLE_VERSION_ID} at 100%"
            echo "- New candidate version: ${CANDIDATE_VERSION_ID:-unresolved} at 0%"
            echo "- Deployment: ${CANDIDATE_DEPLOYMENT_ID:-unresolved}"
            echo '- Required assets: 13'
            echo '- Required consecutive rounds: 20'
            echo '- Minimum convergence duration: 120 seconds'
            echo '- Production promoted: no'
            echo '- Additional rollback: no'
            if [ -f "$EVIDENCE_DIR/final-state.json" ]; then
              echo '```json'
              cat "$EVIDENCE_DIR/final-state.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

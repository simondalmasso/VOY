name: VOY Issue36 Immutable BEFORE Capture

on:
  push:
    branches:
      - ops/issue36-before-capture-01
    paths:
      - .github/workflows/cloudflare-city-platform-final-candidate.yml

permissions:
  contents: read

concurrency:
  group: voy-issue36-before-capture
  cancel-in-progress: false

env:
  WORKER_URL: https://voy-app.simondalmasso44.workers.dev
  EXPECTED_MAIN_SHA: ae9670d7b9ca479792af5c55a28b1033165b003c
  EXPECTED_VERSION: V8.0.0
  EXPECTED_BUILD_HASH: c6aa730
  EXPECTED_PRODUCTIVE_VERSION_ID: 9273abef-69ab-451f-b2f0-ace4c8fd3bdd
  EXPECTED_DEPLOYMENT_ID: 3ef0cc0b-d344-4181-8118-a9b409e44dc6
  EVIDENCE_DIR: test-results/issue36-before

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout read-only capture operator
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical source did not drift
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$EXPECTED_MAIN_SHA"
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$remote_main" > "$EVIDENCE_DIR/canonical-main-sha.txt"
          git diff --check

      - name: Install pinned browser toolchain
        run: |
          set -euo pipefail
          npm install --global bun@1.3.14
          test "$(bun --version)" = '1.3.14'
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock
          bunx playwright install --with-deps chromium

      - name: Snapshot verified production truth
        run: |
          set -euo pipefail
          curl -fsS --retry 3 "$WORKER_URL/api/health?issue36_before=$(date +%s%N)" > "$EVIDENCE_DIR/production-health.json"
          curl -fsS --retry 3 "$WORKER_URL/api/mobility/trust?issue36_before=$(date +%s%N)" > "$EVIDENCE_DIR/production-mobility-trust.json"
          node <<'NODE'
          const fs=require('node:fs'); const e=process.env.EVIDENCE_DIR;
          const h=JSON.parse(fs.readFileSync(`${e}/production-health.json`,'utf8'));
          if(h.ok!==true||h.version!==process.env.EXPECTED_VERSION||h.build_hash!==process.env.EXPECTED_BUILD_HASH) throw new Error('productive_health_drift');
          const t=JSON.parse(fs.readFileSync(`${e}/production-mobility-trust.json`,'utf8'));
          if(t.ok!==true||t.operational_bus_activation!==false||t.mobility_database_role!=='DISCOVERY_ONLY'||t.santa_fe?.bus_activation!==false) throw new Error('productive_trust_drift');
          fs.writeFileSync(`${e}/runtime-identity.json`,JSON.stringify({result:'PASS',canonical_main_sha:process.env.EXPECTED_MAIN_SHA,productive_version_id:process.env.EXPECTED_PRODUCTIVE_VERSION_ID,productive_deployment_id:process.env.EXPECTED_DEPLOYMENT_ID,application_version:h.version,build_hash:h.build_hash,bus_activation:false,captured_at:new Date().toISOString()},null,2));
          NODE

      - name: Capture immutable BEFORE visual matrix
        run: |
          set -euo pipefail
          cat > /tmp/issue36-before.mjs <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';
          import path from 'node:path';
          const base=process.env.WORKER_URL, out=process.env.EVIDENCE_DIR;
          const shots=path.join(out,'screenshots'); fs.mkdirSync(shots,{recursive:true});
          const viewports=[
            ['360x800',360,800],['390x844',390,844],['412x915',412,915],['430x932',430,932],
            ['768x1024',768,1024],['1024x768',1024,768],['1280x800',1280,800],['1440x900',1440,900]
          ];
          const representative=new Set(['390x844','1440x900']);
          const records=[];
          const browser=await chromium.launch({headless:true});
          const snap=async(page,name,meta={})=>{const file=`${name}.png`;await page.screenshot({path:path.join(shots,file),fullPage:true,animations:'disabled'});records.push({file,...meta,url:page.url(),title:await page.title()});};
          const setup=async(context,page)=>{
            await page.route('**/api/geocode?*', async route=>{
              const q=new URL(route.request().url()).searchParams.get('q')||'';
              const results=q.includes('Origen BEFORE')?[{id:'before:origin',name:'Plaza 25 de Mayo',display_name:'Plaza 25 de Mayo, Santa Fe',address:'Santa Fe',lat:-31.633,lon:-60.706}]:[];
              await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({results})});
            });
            await page.route('**/api/route', route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,source:'osrm_route',distance_km:3.2,duration_min:10.5,geometry:[[-60.706,-31.633],[-60.7,-31.64],[-60.700503,-31.643533]]})}));
          };
          const plan=async page=>{
            await page.getByTestId('origin-input').fill('Origen BEFORE');
            await page.getByTestId('origin-apply').click();
            await page.getByTestId('destination-input').fill('Terminal');
            const verified=page.getByTestId('destination-result-verified').first();
            await verified.waitFor({state:'visible'}); await verified.click();
            await page.getByTestId('trip-sheet').waitFor({state:'visible'});
            await page.getByTestId('map-shell').waitFor({state:'visible'});
          };
          for(const [label,width,height] of viewports){
            for(const scheme of ['light','dark']){
              const context=await browser.newContext({viewport:{width,height},colorScheme:scheme,reducedMotion:'no-preference'});
              const page=await context.newPage(); await setup(context,page);
              await page.goto(base,{waitUntil:'domcontentloaded'}); await page.getByTestId('app-shell').waitFor();
              await snap(page,`${label}-${scheme}-empty-start`,{viewport:label,scheme,state:'EMPTY_START'});
              if(representative.has(label)){
                await page.getByTestId('destination-input').fill('Terminal');
                await page.getByTestId('destination-results').waitFor({state:'visible'});
                await snap(page,`${label}-${scheme}-search-results`,{viewport:label,scheme,state:'SEARCH_RESULTS'});
                await page.getByTestId('destination-input').fill('');
                await context.grantPermissions(['geolocation'],{origin:base});
                await context.setGeolocation({latitude:-31.633,longitude:-60.706,accuracy:18});
                await page.getByTestId('gps-button').click();
                await page.waitForTimeout(300);
                await snap(page,`${label}-${scheme}-gps-origin`,{viewport:label,scheme,state:'GPS_ORIGIN'});
                await page.getByTestId('origin-edit').click();
              }
              await plan(page);
              await snap(page,`${label}-${scheme}-decision-app`,{viewport:label,scheme,state:'DECISION_SHEET_APP'});
              if(representative.has(label)){
                await page.locator('[data-mode="bus"]').click(); await page.getByTestId('provider-bus').waitFor();
                await snap(page,`${label}-${scheme}-bus-unavailable`,{viewport:label,scheme,state:'UNAVAILABLE_DATA_BUS'});
                await page.locator('[data-mode="app"]').click(); await page.getByTestId('provider-uber').waitFor();
                await page.getByTestId('provider-uber').click(); await page.getByTestId('external-confirmation').waitFor();
                await snap(page,`${label}-${scheme}-external-confirmation`,{viewport:label,scheme,state:'EXTERNAL_CONFIRMATION'});
                await page.getByRole('button',{name:'Cancelar'}).click();
                const voice=page.getByTestId('voice-open');
                if(await voice.count()){await voice.click();await page.waitForTimeout(250);await snap(page,`${label}-${scheme}-voice`,{viewport:label,scheme,state:'VOICE_IF_ENABLED'});}
                await context.setOffline(true); await page.evaluate(()=>dispatchEvent(new Event('offline'))); await page.getByTestId('offline-banner').waitFor();
                await snap(page,`${label}-${scheme}-offline`,{viewport:label,scheme,state:'OFFLINE'}); await context.setOffline(false);
              }
              await context.close();
            }
          }
          for(const scheme of ['light','dark']){
            const context=await browser.newContext({viewport:{width:1440,height:900},colorScheme:scheme});
            for(const route of ['/privacy','/terms','/sources','/contact']){const page=await context.newPage();await page.goto(base+route,{waitUntil:'domcontentloaded'});await page.getByTestId('legal-view').waitFor();await snap(page,`1440x900-${scheme}-legal-${route.slice(1)}`,{viewport:'1440x900',scheme,state:`LEGAL_${route.slice(1).toUpperCase()}`});await page.close();}
            await context.close();
          }
          await browser.close();
          fs.writeFileSync(path.join(out,'before-capture-index.json'),JSON.stringify({result:'PASS',source:'VERIFIED_PRODUCTION',production_url:base,viewports:viewports.map(v=>v[0]),themes:['light','dark'],representative_states:['EMPTY_START','SEARCH_RESULTS','GPS_ORIGIN','MANUAL_ORIGIN','DECISION_SHEET_APP','UNAVAILABLE_DATA_BUS','EXTERNAL_CONFIRMATION','VOICE_IF_ENABLED','OFFLINE','LEGAL'],screenshots:records,captured_at:new Date().toISOString()},null,2));
          NODE
          bun /tmp/issue36-before.mjs

      - name: Validate capture coverage and freeze evidence
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'); const e=process.env.EVIDENCE_DIR;
          const x=JSON.parse(fs.readFileSync(`${e}/before-capture-index.json`,'utf8'));
          for(const v of ['360x800','390x844','412x915','430x932','768x1024','1024x768','1280x800','1440x900']) for(const s of ['light','dark']) for(const state of ['EMPTY_START','DECISION_SHEET_APP']) if(!x.screenshots.some(i=>i.viewport===v&&i.scheme===s&&i.state===state)) throw new Error(`coverage_missing:${v}:${s}:${state}`);
          for(const s of ['light','dark']) for(const state of ['SEARCH_RESULTS','GPS_ORIGIN','UNAVAILABLE_DATA_BUS','EXTERNAL_CONFIRMATION','OFFLINE']) if(!x.screenshots.some(i=>i.viewport==='390x844'&&i.scheme===s&&i.state===state)) throw new Error(`representative_mobile_missing:${s}:${state}`);
          const files=fs.readdirSync(`${e}/screenshots`).filter(f=>f.endsWith('.png')); if(files.length<40)throw new Error(`too_few_screenshots:${files.length}`);
          fs.writeFileSync(`${e}/coverage-summary.json`,JSON.stringify({result:'PASS',screenshot_count:files.length,required_viewports:8,themes:2,core_states_per_viewport:2,representative_state_matrix:'PASS'},null,2));
          NODE
          find "$EVIDENCE_DIR" -type f ! -name manifest.sha256 ! -name digest.txt -print0 | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_DIR/manifest.sha256"
          sha256sum "$EVIDENCE_DIR/manifest.sha256" > "$EVIDENCE_DIR/digest.txt"

      - name: Upload immutable Issue36 BEFORE
        uses: actions/upload-artifact@v4
        with:
          name: voy-issue36-before-${{ github.run_id }}
          path: test-results/issue36-before
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 6

      - name: Summary
        run: |
          echo '## VOY #36 immutable BEFORE' >> "$GITHUB_STEP_SUMMARY"
          echo "- canonical main: $EXPECTED_MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- production: $EXPECTED_VERSION/$EXPECTED_BUILD_HASH" >> "$GITHUB_STEP_SUMMARY"
          echo "- productive version: $EXPECTED_PRODUCTIVE_VERSION_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- productive deployment: $EXPECTED_DEPLOYMENT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo '- runtime mutation: none' >> "$GITHUB_STEP_SUMMARY"
          cat "$EVIDENCE_DIR/coverage-summary.json" >> "$GITHUB_STEP_SUMMARY"

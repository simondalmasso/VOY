name: VOY Exact Final Main Candidate

on:
  push:
    branches:
      - ops/final-main-reconciliation-v1
    paths:
      - .github/workflows/cloudflare-city-platform-final-candidate.yml

permissions:
  contents: read

concurrency:
  group: voy-exact-final-main-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      EXACT_MAIN_SHA: 841d9f4ecd573c32e5f9ac7238d4109812a221bf
      WORKER_NAME: voy-app
      WORKER_URL: https://voy-app.simondalmasso44.workers.dev
      EXPECTED_PRODUCTION_VERSION: V7.8.0
      EXPECTED_PRODUCTION_HASH: 8565945
      EXPECTED_STABLE_VERSION_ID: 89f7d347-4fb4-400e-8a75-ddb18ae8ca13
      EXPECTED_FAILED_CANDIDATE_VERSION_ID: 9508254e-6bbe-48ee-a126-d57d405b70a6
      EXPECTED_SOURCE_ROOT: ${{ github.workspace }}
      CONVERGENCE_INTERVAL_MS: 7000
      EVIDENCE_DIR: test-results/exact-final-main-candidate
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout exact final main
        uses: actions/checkout@v4
        with:
          ref: 841d9f4ecd573c32e5f9ac7238d4109812a221bf
          fetch-depth: 0

      - name: Verify exact final main identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_MAIN_SHA"
          git fetch origin main --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$EXACT_MAIN_SHA"
          git diff --check

      - name: Install frozen toolchain
        run: |
          set -euo pipefail
          npm install --global bun@1.3.14 wrangler@4.112.0
          test "$(bun --version)" = "1.3.14"
          test "$(wrangler --version | awk '{print $1}')" = "4.112.0"
          bun install --frozen-lockfile

      - name: Install Chromium 1.61.1
        run: npx --yes --package=@playwright/test@1.61.1 playwright install --with-deps chromium

      - name: Create and validate exact final main candidate at zero traffic
        run: GITHUB_SHA="$EXACT_MAIN_SHA" bash scripts/run-city-platform-repaired-candidate.sh

      - name: Build evidence manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          find "$EVIDENCE_DIR" -type f ! -name manifest.sha256 ! -name digest.txt -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/manifest.sha256"
          sha256sum "$EVIDENCE_DIR/manifest.sha256" > "$EVIDENCE_DIR/digest.txt"

      - name: Upload exact final main candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voy-exact-final-main-candidate-${{ github.run_id }}
          path: |
            test-results/exact-final-main-candidate
            test-results/evidence
            playwright-report
          if-no-files-found: error
          retention-days: 30

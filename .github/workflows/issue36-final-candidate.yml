name: VOY Issue36 Final Exact Candidate

on:
  push:
    branches:
      - feat/issue36-total-product-redesign-01
    paths:
      - .github/workflows/issue36-visual-qa.yml

permissions:
  contents: read

concurrency:
  group: voy-issue36-final-candidate
  cancel-in-progress: false

env:
  WORKER_NAME: voy-app
  WORKER_URL: https://voy-app.simondalmasso44.workers.dev
  EXPECTED_STABLE_VERSION: V8.0.0
  EXPECTED_STABLE_HASH: c6aa730
  EXPECTED_STABLE_VERSION_ID: 9273abef-69ab-451f-b2f0-ace4c8fd3bdd
  EXPECTED_CANDIDATE_VERSION: V8.0.0
  CONVERGENCE_INTERVAL_MS: '7000'
  EVIDENCE_DIR: test-results/issue36-final-candidate
  VOY_REAL_BASEMAP: '1'

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact final design head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gate candidate to final AFTER head only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin refs/heads/feat/issue36-total-product-redesign-01 | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          grep -q '^  VOY_QA_STAGE: final-after$' .github/workflows/issue36-visual-qa.yml
          git diff --check
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$remote_head" > "$EVIDENCE_DIR/exact-head.txt"

      - name: Install pinned frozen candidate toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng zip
          npm install --global bun@1.3.14 wrangler@4.112.0
          test "$(bun --version)" = '1.3.14'
          test "$(wrangler --version | awk '{print $1}')" = '4.112.0'
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock
          bunx playwright install --with-deps chromium

      - name: Release policy before candidate write
        run: node scripts/verify-release-policy.mjs

      - name: Validate exact head and create zero-traffic candidate
        run: bash scripts/run-hotfix-candidate.sh

      - name: Verify Issue36 trust and zero-traffic contract
        run: |
          set -euo pipefail
          curl -fsS --retry 3 "$WORKER_URL/api/mobility/trust?issue36_final=$(date +%s%N)" > "$EVIDENCE_DIR/production-mobility-trust-after.json"
          node <<'NODE'
          const fs=require('node:fs'); const e=process.env.EVIDENCE_DIR;
          const final=JSON.parse(fs.readFileSync(`${e}/final-state.json`,'utf8'));
          const trust=JSON.parse(fs.readFileSync(`${e}/production-mobility-trust-after.json`,'utf8'));
          if(final.result!=='PASS') throw new Error('candidate_final_state_not_pass');
          if(final.stable_version_id!==process.env.EXPECTED_STABLE_VERSION_ID||Number(final.stable_traffic)!==100) throw new Error('stable_runtime_changed');
          if(!final.candidate_version_id||Number(final.candidate_traffic)!==0) throw new Error('candidate_not_zero_traffic');
          if(final.production_promoted===true||final.rollback_executed===true) throw new Error('unexpected_production_mutation');
          if(trust.ok!==true||trust.operational_bus_activation!==false||trust.santa_fe?.bus_activation!==false||trust.mobility_database_role!=='DISCOVERY_ONLY') throw new Error('mobility_trust_drift');
          fs.writeFileSync(`${e}/issue36-zero-traffic-contract.json`,JSON.stringify({result:'PASS',exact_head:process.env.GITHUB_SHA,stable_version_id:final.stable_version_id,stable_traffic:final.stable_traffic,candidate_version_id:final.candidate_version_id,candidate_traffic:final.candidate_traffic,deployment_id:final.deployment_id,bus_activation:false,production_promoted:false,rollback_executed:false},null,2));
          NODE

      - name: Build immutable evidence manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          find "$EVIDENCE_DIR" -type f ! -name manifest.sha256 ! -name digest.txt -print0 | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_DIR/manifest.sha256"
          sha256sum "$EVIDENCE_DIR/manifest.sha256" > "$EVIDENCE_DIR/digest.txt"

      - name: Upload Issue36 final candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voy-issue36-final-candidate-${{ github.run_id }}
          path: test-results/issue36-final-candidate
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 6

      - name: Candidate summary
        if: always()
        run: |
          {
            echo '## VOY #36 — final exact-head candidate'
            echo
            echo "- Exact source SHA: $GITHUB_SHA"
            echo "- Production stable: $EXPECTED_STABLE_VERSION_ID at 100%"
            echo '- Candidate target: 0% traffic only'
            echo '- Production promotion: not authorized'
            echo '- Bus activation: OFF'
            if [ -f "$EVIDENCE_DIR/issue36-zero-traffic-contract.json" ]; then
              echo '```json'
              cat "$EVIDENCE_DIR/issue36-zero-traffic-contract.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

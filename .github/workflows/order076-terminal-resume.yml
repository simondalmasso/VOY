name: ORDER-076 terminal resume deploy

on:
  push:
    branches:
      - audit/order076-terminal-evidence
    paths:
      - .github/workflows/order076-terminal-resume.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: voy-order076-terminal-resume
  cancel-in-progress: false

env:
  RUNTIME_SHA: b858568848f6bf5abd6853ee13c77f2e65c63735
  SOURCE_RUN_ID: '36567131839'
  SOURCE_ARTIFACT: order076-dist-36567131839
  WORKER_URL: https://voy-app.simondalmasso44.workers.dev

jobs:
  verify_prior:
    name: Verify prior terminal evidence
    runs-on: ubuntu-24.04
    steps:
      - name: Verify build Chrome Edge from source run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > jobs.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('jobs.json','utf8'));
          const need=[
            'Build exact runtime once',
            'Chrome terminal matrix',
            'Edge terminal matrix 10x'
          ];
          for(const name of need){
            const j=x.jobs.find(v=>v.name===name);
            if(!j)throw new Error('missing_prior_job:'+name);
            if(j.status!=='completed'||j.conclusion!=='success')throw new Error('prior_job_not_green:'+name+':'+j.status+':'+j.conclusion);
            console.log(name+'=PASS');
          }
          NODE

  special_windows:
    name: Windows Chrome special gates
    needs: verify_prior
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RUNTIME_SHA }}
          path: runtime
      - uses: actions/checkout@v4
        with:
          ref: audit/order076-terminal-evidence
          path: audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - working-directory: runtime
        run: npm ci
      - name: Download exact dist from source run
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: runtime/dist
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Run special gates on Windows Chrome
        env:
          RUNTIME_DIR: ${{ github.workspace }}\runtime
          EXPECTED_SHA: ${{ env.RUNTIME_SHA }}
          MODE: specials
          BROWSER_PATH: C:\Program Files\Google\Chrome\Application\chrome.exe
          EVIDENCE_DIR: ${{ github.workspace }}\special-windows-evidence
        run: node audit/order076/evidence/order076-terminal.mjs
      - name: Upload Windows special evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order076-special-windows-${{ github.run_id }}
          path: special-windows-evidence
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy exact previously-tested artifact
    needs: special_windows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RUNTIME_SHA }}
          path: runtime
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - working-directory: runtime
        run: npm ci
      - name: Download exact dist from source run
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: runtime/dist
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify artifact identity
        id: meta
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('dist/BUILD_MANIFEST.json','utf8'));
          if(m.source_commit!==process.env.RUNTIME_SHA)throw new Error('source_mismatch:'+JSON.stringify(m));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'build_id='+m.build_id+'\nrelease_id='+m.release_id+'\n');
          console.log(JSON.stringify(m,null,2));
          NODE
      - name: Record previous production identity
        shell: bash
        run: curl -fsS "$WORKER_URL/api/health" | tee production-before.json
      - name: Deploy exact dist without rebuild
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc --minify | tee ../deploy.log
      - name: Reconcile production identity
        env:
          EXPECTED_BUILD_ID: ${{ steps.meta.outputs.build_id }}
          EXPECTED_RELEASE_ID: ${{ steps.meta.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            curl -fsS "$WORKER_URL/api/health" > production-health.json || true
            if node - <<'NODE'
          const fs=require('fs');
          let h;try{h=JSON.parse(fs.readFileSync('production-health.json','utf8'))}catch{process.exit(1)}
          if(h.ok===true&&h.source_commit===process.env.RUNTIME_SHA&&h.build_hash===process.env.EXPECTED_BUILD_ID&&h.version===process.env.EXPECTED_RELEASE_ID)process.exit(0);
          process.exit(1);
          NODE
            then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          cat production-health.json
      - name: Upload deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order076-deploy-resume-${{ github.run_id }}
          path: |
            deploy.log
            production-before.json
            production-health.json
          if-no-files-found: warn
          retention-days: 30

  production_smoke:
    name: Production MAP-FIRST smoke
    needs: deploy
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RUNTIME_SHA }}
          path: runtime
      - uses: actions/checkout@v4
        with:
          ref: audit/order076-terminal-evidence
          path: audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - working-directory: runtime
        run: npm ci
      - name: Download exact dist from source run
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: runtime/dist
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Browser smoke production
        env:
          RUNTIME_DIR: ${{ github.workspace }}\runtime
          EXPECTED_SHA: ${{ env.RUNTIME_SHA }}
          MODE: prod
          BASE_URL: ${{ env.WORKER_URL }}/
          BROWSER_PATH: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
          EVIDENCE_DIR: ${{ github.workspace }}\production-evidence
        run: node audit/order076/evidence/order076-terminal.mjs
      - name: Upload production browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order076-production-resume-${{ github.run_id }}
          path: production-evidence
          if-no-files-found: error
          retention-days: 30

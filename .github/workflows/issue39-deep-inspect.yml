name: VOY Issue39 Deep Inspection

on:
  push:
    branches:
      - audit/issue39-global-adversarial-20260812
    paths:
      - .issue39-deep-inspect-ready

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Inspect coordinator and action refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .issue39-deep-inspect-ready)" = 'ISSUE39_DEEP_INSPECT_V1'
          echo '--- NOMINATIM COORDINATOR REFERENCES ---'
          grep -n -E 'NominatimCoordinator|NOMINATIM_COORDINATOR|idFromName|getByName' worker.js worker-entry.js worker/index.ts || true
          echo '--- UNIQUE UNPINNED ACTION REFS ---'
          grep -RhoE 'uses:[[:space:]]+[^[:space:]#]+' .github/workflows/*.yml | sed -E 's/^uses:[[:space:]]+//' | grep '@' | grep -Ev '@[0-9a-fA-F]{40}$' | sort -u || true
      - name: Bun advisory output
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          npm install --global bun@1.3.14
          bun install --frozen-lockfile
          bun audit

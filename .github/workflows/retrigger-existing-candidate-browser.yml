name: Retrigger Existing Candidate Browser

on:
  push:
    branches:
      - feat/voy-city-platform-v1
    paths:
      - .github/workflows/retrigger-existing-candidate-browser.yml

permissions:
  contents: write

jobs:
  retrigger:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/voy-city-platform-v1
          fetch-depth: 0

      - name: Make candidate browser workflow responsive to harness changes
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/validate-existing-city-platform-candidate-browser.yml')
          text = path.read_text()
          old = """    paths:\n      - .github/workflows/validate-existing-city-platform-candidate-browser.yml\n"""
          new = """    paths:\n      - .github/workflows/validate-existing-city-platform-candidate-browser.yml\n      - candidate-tests/cloudflare-candidate.spec.js\n      - candidate-tests/playwright.config.js\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected replacement count 1, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          grep -F 'candidate-tests/cloudflare-candidate.spec.js' .github/workflows/validate-existing-city-platform-candidate-browser.yml

      - name: Commit workflow trigger correction
        run: |
          set -euo pipefail
          git config user.name "voy-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/validate-existing-city-platform-candidate-browser.yml
          git commit -m "ci(candidate): rerun browser on harness changes"
          git push origin HEAD:feat/voy-city-platform-v1

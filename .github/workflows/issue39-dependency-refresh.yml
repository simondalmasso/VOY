name: VOY Issue39 Guarded Dependency Refresh

on:
  push:
    branches:
      - audit/issue39-global-adversarial-20260812
    paths:
      - .issue39-dependency-refresh-ready

permissions:
  contents: write

concurrency:
  group: voy-issue39-dependency-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Guard exact branch and refresh only audited toolchain dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'audit/issue39-global-adversarial-20260812'
          test "$(cat .issue39-dependency-refresh-ready)" = 'ISSUE39_DEP_REFRESH_V1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm install --global bun@1.3.14 wrangler@4.122.0
          bun install --frozen-lockfile
          bun update wrangler@4.122.0 @cloudflare/vite-plugin@1.52.0
          test "$(node -p "require('./package.json').devDependencies.wrangler")" = '4.122.0'
          test "$(node -p "require('./package.json').devDependencies['@cloudflare/vite-plugin']")" = '1.52.0'
          bun audit
          node scripts/verify-release-policy.mjs
          bun run typecheck
          bun run lint
          bun run test
          bun run build
          bun run budget
          wrangler deploy --dry-run --outdir /tmp/issue39-wrangler-dry-run
          changed="$(git diff --name-only)"
          test -n "$changed"
          test -z "$(printf '%s\n' "$changed" | grep -Ev '^(package.json|bun.lock)$' || true)"
      - name: Commit exact dependency refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VOY Issue39 Audit'
          git config user.email 'noreply@voy.local'
          git add package.json bun.lock
          git commit -m 'fix(issue39): refresh audited Cloudflare toolchain'
          git push origin HEAD:audit/issue39-global-adversarial-20260812

name: VOY Diagnose Failed City Platform Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/voy-city-platform-v1
    paths:
      - .github/workflows/diagnose-city-platform-failed-candidate.yml
      - scripts/required-city-platform-assets.mjs
      - scripts/diagnose-city-platform-candidate.mjs
      - __tests__/requiredCityPlatformAssets.test.js
      - candidate-tests/cache-isolation.spec.js
      - candidate-tests/playwright.cache-isolation.config.js

permissions:
  contents: read

concurrency:
  group: voy-diagnose-failed-city-platform-candidate
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WORKER_NAME: voy-app
      WORKER_URL: https://voy-app.simondalmasso44.workers.dev
      STABLE_VERSION_ID: 9508254e-6bbe-48ee-a126-d57d405b70a6
      FAILED_CANDIDATE_VERSION_ID: aec70bcf-d02c-416a-b9f5-be4d83b34b32
      INCIDENT_SOURCE_SHA: e5533edaf2c5982c837896adb00d144d5f4f84b7
      INCIDENT_SHORT_SHA: e5533ed
      INCIDENT_DEPLOY_TS: 2026-07-21T11:57:12.879Z
      EXPECTED_PRODUCTION_VERSION: V7.8.0
      EXPECTED_PRODUCTION_HASH: 4a8b91e
      DIRECT_ASSET_ROUNDS: 30
      DIRECT_ASSET_INTERVAL_MS: 5000
      EVIDENCE_DIR: test-results/failed-candidate-diagnostic
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repair head
        uses: actions/checkout@v4
        with:
          ref: feat/voy-city-platform-v1
          fetch-depth: 0

      - name: Checkout exact incident source
        uses: actions/checkout@v4
        with:
          ref: e5533edaf2c5982c837896adb00d144d5f4f84b7
          path: incident-source
          fetch-depth: 0

      - name: Verify source identities and production baseline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C incident-source rev-parse HEAD)" = "$INCIDENT_SOURCE_SHA"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p "$EVIDENCE_DIR"
          git rev-parse HEAD > "$EVIDENCE_DIR/repair-head.txt"
          git -C incident-source rev-parse HEAD > "$EVIDENCE_DIR/incident-source-sha.txt"
          curl --fail --silent --show-error --max-time 20 \
            "$WORKER_URL/api/health?failed_candidate_diagnostic_before=$(date +%s%N)" \
            > "$EVIDENCE_DIR/production-health-before.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR + '/production-health-before.json', 'utf8'));
          if (health.ok !== true || health.version !== process.env.EXPECTED_PRODUCTION_VERSION || health.build_hash !== process.env.EXPECTED_PRODUCTION_HASH) {
            throw new Error('production_baseline_changed');
          }
          NODE

      - name: Install deterministic toolchain
        run: |
          set -euo pipefail
          npm install --global bun@1.3.14
          test "$(bun --version)" = "1.3.14"
          bun install --frozen-lockfile

      - name: Validate canonical asset contract
        run: |
          set -o pipefail
          node --test __tests__/requiredCityPlatformAssets.test.js 2>&1 | tee "$EVIDENCE_DIR/required-assets-tests.log"

      - name: Materialize exact uploaded incident source
        working-directory: incident-source
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          for (const file of ['worker.js', 'public/VOY-Lite.html']) {
            let source = fs.readFileSync(file, 'utf8');
            source = source.replaceAll('__BUILD_HASH__', process.env.INCIDENT_SHORT_SHA);
            source = source.replaceAll('__DEPLOY_TS__', process.env.INCIDENT_DEPLOY_TS);
            fs.writeFileSync(file, source, 'utf8');
          }
          NODE
          grep -F "window.VOY_BUILD_HASH='$INCIDENT_SHORT_SHA'" public/VOY-Lite.html
          grep -F "$INCIDENT_DEPLOY_TS" public/VOY-Lite.html

      - name: Probe failed candidate for thirty rounds without mutations
        env:
          EXPECTED_SOURCE_ROOT: ${{ github.workspace }}/incident-source
        run: |
          set -o pipefail
          node scripts/diagnose-city-platform-candidate.mjs 2>&1 | tee "$EVIDENCE_DIR/diagnostic.log"

      - name: Install Chromium 1.61.1
        run: npx --yes --package=@playwright/test@1.61.1 playwright install --with-deps chromium

      - name: Verify candidate browser with isolated storage
        env:
          VOY_BASE_URL: https://voy-app.simondalmasso44.workers.dev
          VOY_WORKER_NAME: voy-app
          VOY_CANDIDATE_VERSION_ID: aec70bcf-d02c-416a-b9f5-be4d83b34b32
          VOY_EXPECTED_SOURCE_ROOT: ${{ github.workspace }}/incident-source
          VOY_EVIDENCE_DIR: test-results/failed-candidate-diagnostic/browser
          VOY_OUTPUT_DIR: test-results/failed-candidate-diagnostic/playwright-output
          VOY_REPORT_DIR: test-results/failed-candidate-diagnostic/playwright-report
        run: |
          set -o pipefail
          npm exec --yes --package=@playwright/test@1.61.1 -- sh -c '
            PLAYWRIGHT_BIN=$(command -v playwright)
            NODE_PATH=$(cd "$(dirname "$PLAYWRIGHT_BIN")/.." && pwd)
            export NODE_PATH
            playwright test --config=candidate-tests/playwright.cache-isolation.config.js
          ' 2>&1 | tee "$EVIDENCE_DIR/cache-isolation-browser.log"

      - name: Verify no control-plane or production mutation
        run: |
          set -euo pipefail
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME"
          curl --fail --silent --show-error --max-time 20 \
            "$WORKER_URL/api/health?failed_candidate_diagnostic_after=$(date +%s%N)" \
            > "$EVIDENCE_DIR/production-health-after.json"
          curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API_ROOT/deployments" > "$EVIDENCE_DIR/deployments-after.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR + '/production-health-after.json', 'utf8'));
          if (health.ok !== true || health.version !== process.env.EXPECTED_PRODUCTION_VERSION || health.build_hash !== process.env.EXPECTED_PRODUCTION_HASH) {
            throw new Error('production_changed_during_diagnostic');
          }
          const payload = JSON.parse(fs.readFileSync(process.env.EVIDENCE_DIR + '/deployments-after.json', 'utf8'));
          if (!payload.success) throw new Error('deployments_api_failed');
          const deployments = payload.result?.deployments || payload.result || [];
          const active = deployments[0];
          const traffic = new Map(active.versions.map(version => [version.version_id, Number(version.percentage)]));
          if (traffic.get(process.env.STABLE_VERSION_ID) !== 100) throw new Error('stable_traffic_changed');
          if (traffic.get(process.env.FAILED_CANDIDATE_VERSION_ID) !== 0) throw new Error('failed_candidate_traffic_changed');
          NODE

      - name: Build evidence manifest
        if: always()
        run: |
          set -euo pipefail
          find "$EVIDENCE_DIR" -type f -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/manifest.sha256"
          sha256sum "$EVIDENCE_DIR/manifest.sha256" > "$EVIDENCE_DIR/digest.txt"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voy-city-platform-failed-candidate-diagnostic-${{ github.run_id }}
          path: test-results/failed-candidate-diagnostic
          if-no-files-found: error
          retention-days: 30

      - name: Diagnostic summary
        if: always()
        run: |
          {
            echo '## Failed City Platform candidate diagnostic'
            echo
            echo "- Repair head: $GITHUB_SHA"
            echo "- Incident source: $INCIDENT_SOURCE_SHA"
            echo "- Failed candidate: $FAILED_CANDIDATE_VERSION_ID at 0%"
            echo "- Production: $STABLE_VERSION_ID at 100%"
            echo '- Traffic mutation: no'
            if [ -f "$EVIDENCE_DIR/diagnostic-summary.json" ]; then
              echo '- Root cause:'
              echo '```json'
              cat "$EVIDENCE_DIR/diagnostic-summary.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

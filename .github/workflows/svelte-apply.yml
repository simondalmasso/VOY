name: Apply VOY Svelte Migration

on:
  push:
    branches:
      - feat/voy-complete-product-master-01
    paths:
      - .migration/payload.tar.gz
      - .migration/delete-paths.txt

permissions:
  contents: write

concurrency:
  group: voy-svelte-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact migration carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Detect payload
        id: payload
        run: |
          if [[ -f .migration/payload.tar.gz && -f .migration/delete-paths.txt ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify and apply payload
        if: steps.payload.outputs.present == 'true'
        run: |
          set -euo pipefail
          echo '289699680893fbc51db0d024123ce2ce10502d1dc910388903aae1ee988c8266  .migration/payload.tar.gz' | sha256sum -c -
          while IFS= read -r path; do
            [[ -n "$path" ]] && rm -rf -- "$path"
          done < .migration/delete-paths.txt
          tar -xzf .migration/payload.tar.gz -C .
          rm -f .migration/payload.tar.gz .migration/delete-paths.txt
          git diff --check

      - name: Install pinned toolchain
        if: steps.payload.outputs.present == 'true'
        run: |
          npm install --global bun@1.3.14 wrangler@4.112.0
          test "$(bun --version)" = '1.3.14'
          test "$(wrangler --version | awk '{print $1}')" = '4.112.0'
          bun install

      - name: Validate Svelte migration
        if: steps.payload.outputs.present == 'true'
        env:
          BUILD_HASH: migration
          VOY_METRICS_PATH: test-results/build-metrics.json
        run: |
          node scripts/verify-release-policy.mjs
          bun run typecheck
          bun run lint
          bun run test
          bun run build
          bun run budget
          CONFIG=.wrangler/deploy/config.json
          test -f "$CONFIG" || CONFIG=wrangler.jsonc
          wrangler deploy --config "$CONFIG" --dry-run --minify
          bash -n scripts/run-browser-smoke.sh scripts/run-master-final-candidate.sh
          node --check scripts/svelte-candidate-gate.mjs
          node --check scripts/svelte-candidate-api-gate.mjs

      - name: Install Chromium and validate required viewports
        if: steps.payload.outputs.present == 'true'
        run: |
          bunx playwright install --with-deps chromium
          BUILD_HASH=migration VOY_EVIDENCE_DIR=test-results/migration-screens VOY_OUTPUT_DIR=test-results/migration-browser VOY_REPORT_DIR=playwright-report-migration WRANGLER_LOG=test-results/migration-vite.log bash scripts/run-browser-smoke.sh

      - name: Commit validated migration without force push
        if: steps.payload.outputs.present == 'true'
        run: |
          set -euo pipefail
          git config user.name 'VOY EJE'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: migrate VOY to Svelte mobile-first runtime'
          git push origin HEAD:feat/voy-complete-product-master-01

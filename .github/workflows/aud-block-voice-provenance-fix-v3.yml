name: Harden AUD voice provenance correction retry

on:
  push:
    branches:
      - feat/voy-complete-product-master-01
    paths:
      - .github/workflows/aud-block-voice-provenance-fix-v3.yml

permissions:
  contents: write

concurrency:
  group: voy-aud-voice-provenance-fix-v3
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply hardened AUD patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/aud-block-voice-provenance-fix.yml').read_text(encoding='utf-8')
          body = workflow.split("          python3 - <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0]
          script = dedent(body)

          hooks = {
            "runtime = replace_once(runtime, old_modes, new_modes, 'runtime mode comparison')": """mode_start = runtime.index(\"  } else if (name === 'estimate_modes') {\")
          mode_end = runtime.index(\"  } else if (name === 'list_available_providers') {\", mode_start)
          runtime = runtime[:mode_start] + new_modes[:-len(\"  } else if (name === 'list_available_providers') {\")] + runtime[mode_end:]""",
            "conversation = replace_once(conversation, old_narration, new_narration, 'conversation narration boundary')": """narration_start = conversation.index(\"      try {\\n        const narration = await providers.llm.narrate\")
          narration_end = conversation.index(\"\\n    } catch (error) {\", narration_start)
          conversation = conversation[:narration_start] + new_narration + conversation[narration_end:]""",
            "runtime_test = replace_once(runtime_test, old_runtime_test, new_runtime_test, 'runtime test replacement')": """runtime_test_start = runtime_test.index(\"  test('does not calculate modes and only compares a validated client snapshot'\")
          runtime_test_end = runtime_test.index(\"\\n\\n  test('fails closed when a destination is required'\", runtime_test_start)
          runtime_test = runtime_test[:runtime_test_start] + new_runtime_test + runtime_test[runtime_test_end:]""",
            "api_test = replace_once(api_test, old_api_snapshot, new_api_snapshot, 'api test remove client snapshot')": """api_snapshot_start = api_test.index(\"    session = body.session;\\n    session.mobility_snapshot = [\")
          api_snapshot_end = api_test.index(\"    response = await api.handleVoiceRequest(request('/api/voice/chat', {\", api_snapshot_start)
          api_test = api_test[:api_snapshot_start] + \"    session = body.session;\\n\" + api_test[api_snapshot_end:]""",
            "api_test = replace_once(\n    api_test,\n    \"    assert.equal(body.tool_result.cheapest.mode, 'bus');\\n    assert.equal(body.tool_result.fastest.mode, 'taxi');\\n    assert.equal(body.session.turn_count, 2);\\n\",\n    \"    assert.equal(body.tool_result.cheapest, null);\\n    assert.equal(body.tool_result.fastest, null);\\n    assert.equal(body.tool_result.available.some(item => item.mode === 'uber'), true);\\n    assert.equal(body.tool_result.available.some(item => item.mode === 'bus'), false);\\n    assert.equal(body.tool_result.available.every(item => item.price === null), true);\\n    assert.match(body.response, /no hay precio o duración comparable/i);\\n    assert.equal(body.session.turn_count, 2);\\n\",\n    'api test server comparison assertions'\n)": """api_assert_start = api_test.index(\"    assert.equal(body.tool_result.cheapest.mode, 'bus');\")
          api_assert_end_marker = \"    assert.equal(body.session.turn_count, 2);\\n\"
          api_assert_end = api_test.index(api_assert_end_marker, api_assert_start) + len(api_assert_end_marker)
          api_test = api_test[:api_assert_start] + \"    assert.equal(body.tool_result.cheapest, null);\\n    assert.equal(body.tool_result.fastest, null);\\n    assert.equal(body.tool_result.available.some(item => item.mode === 'uber'), true);\\n    assert.equal(body.tool_result.available.some(item => item.mode === 'bus'), false);\\n    assert.equal(body.tool_result.available.every(item => item.price === null), true);\\n    assert.match(body.response, /no hay precio o duración comparable/i);\\n    assert.equal(body.session.turn_count, 2);\\n\" + api_test[api_assert_end:]""",
            "gate = replace_once(gate, old_gate, new_gate, 'candidate voice gate provenance')": """gate_start = gate.index(\"session.mobility_snapshot = [\")
          gate_end = gate.index(\"\\n\\nconst preparedCancel =\", gate_start)
          gate = gate[:gate_start] + new_gate + gate[gate_end:]"""
          }

          for old, new in hooks.items():
              if script.count(old) != 1:
                  raise SystemExit(f'hook_missing:{old[:80]}')
              script = script.replace(old, new, 1)

          exec(compile(script, 'aud-block-hardened.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Verify correction locally
        shell: bash
        run: |
          set -euo pipefail
          npm install --global bun@1.3.14
          bun install --frozen-lockfile
          bunx svelte-check --tsconfig ./tsconfig.json
          bunx eslint src worker tests browser-tests scripts/build-static-manifest.mjs scripts/check-bundle-budgets.mjs vite.config.ts
          bun test
          bun run build
          git diff --check

      - name: Commit verified correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VOY ARQ'
          git config user.email 'actions@users.noreply.github.com'
          git add voiceCopilotContracts.mjs voiceCopilotRuntime.mjs voiceCopilotConversation.mjs \
            __tests__/voiceCopilotContracts.test.js __tests__/voiceCopilotRuntime.test.js \
            __tests__/voiceCopilotApi.test.js scripts/voice-candidate-api-gate.mjs docs/CURRENT_STATE.md
          git diff --cached --quiet && { echo 'no_changes_to_commit'; exit 1; }
          git commit -m 'fix: enforce server-owned Voice mobility provenance'
          git push origin HEAD:feat/voy-complete-product-master-01

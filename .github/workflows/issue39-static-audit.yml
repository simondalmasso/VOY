name: VOY Issue39 Global Static Audit

on:
  push:
    branches:
      - audit/issue39-global-adversarial-20260812
    paths:
      - .issue39-static-audit-ready

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EVIDENCE_DIR: test-results/issue39-static-audit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Exact branch and frozen baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .issue39-static-audit-ready)" = 'ISSUE39_STATIC_AUDIT_V2'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm install --global bun@1.3.14 wrangler@4.112.0
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock
          mkdir -p "$EVIDENCE_DIR"
          node scripts/verify-release-policy.mjs > "$EVIDENCE_DIR/release-policy.json"
          bun run typecheck > "$EVIDENCE_DIR/typecheck.txt" 2>&1
          bun run lint > "$EVIDENCE_DIR/lint.txt" 2>&1
          bun run test > "$EVIDENCE_DIR/unit.txt" 2>&1
          bun run build > "$EVIDENCE_DIR/build.txt" 2>&1
          bun run budget > "$EVIDENCE_DIR/budgets.txt" 2>&1
          wrangler deploy --dry-run --outdir "$EVIDENCE_DIR/wrangler-dry-run" > "$EVIDENCE_DIR/wrangler.txt" 2>&1

      - name: Static reachability and truth scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.')
          ev=Path('test-results/issue39-static-audit')
          def text(p):
            try:return Path(p).read_text(encoding='utf-8')
            except:return ''
          src='\n'.join(p.read_text(encoding='utf-8',errors='ignore') for p in Path('src').rglob('*') if p.is_file() and p.suffix in {'.ts','.svelte','.js','.mjs'})
          worker_index=text('worker/index.ts'); entry=text('worker-entry.js')
          fares=json.loads(text('public/cities/santa-fe/fares.json'))
          profile=json.loads(text('public/cities/santa-fe/profile.json'))
          transport=json.loads(text('public/cities/santa-fe/transport.json'))
          providers=json.loads(text('public/cities/santa-fe/providers.json'))
          app_numeric={k:[n for n,v in rec.items() if isinstance(v,(int,float))] for k,rec in fares.get('fare_registry',{}).get('apps',{}).items()}
          profile_claim=' '.join(profile.get('coverage_notes',[])).lower()
          browser_direct_nominatim=bool(re.search(r'nominatim\.openstreetmap\.org',src,re.I))
          browser_direct_osrm=bool(re.search(r'router\.project-osrm\.org',src,re.I))
          public_pricing=[]
          for p in Path('public').rglob('*'):
            if p.is_file() and p.suffix in {'.js','.mjs','.html'}:
              s=p.read_text(encoding='utf-8',errors='ignore')
              if re.search(r'calcAppPrice|bajada|distFicha|minFare|regulatedMeterFare',s): public_pricing.append(str(p))
          result={
            'legacy_worker_runtime_dependency': "from './worker.js'" in entry and 'legacyWorker.fetch' in worker_index,
            'browser_direct_nominatim':browser_direct_nominatim,
            'browser_direct_osrm':browser_direct_osrm,
            'public_legacy_pricing_files':public_pricing,
            'private_app_numeric_fields':app_numeric,
            'profile_claims_curated_stops_or_stations':('paradas' in profile_claim or 'estaciones' in profile_claim),
            'transport_bus_stops_count':len(transport.get('bus_stops',[])),
            'transport_bike_stations_count':len(transport.get('bike_stations',[])),
            'provider_records_without_expiry':[k for k,v in providers.get('providers',{}).items() if v.get('availability_status')=='verified_current' and not v.get('expires_at')],
            'tracked_env':Path('.env').exists(),
            'tracked_db':Path('db/custom.db').exists(),
            'tracked_zip_count':sum(1 for p in root.rglob('*.zip') if '.git' not in p.parts),
            'tracked_pastebin_count':sum(1 for p in root.rglob('*') if p.is_file() and 'pastebin' in p.name.lower()),
            'tracked_tool_results_count':sum(1 for p in Path('tool-results').rglob('*') if p.is_file()) if Path('tool-results').exists() else 0,
          }
          ev.joinpath('static-truth.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          print(json.dumps(result,indent=2))
          PY

      - name: Workflow capability matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          rows=[]
          for p in sorted(Path('.github/workflows').glob('*.yml')):
            s=p.read_text(encoding='utf-8',errors='ignore')
            uses=re.findall(r'(?m)^\s*-?\s*uses:\s*([^\s#]+)',s)
            rows.append({
              'file':str(p),
              'cloudflare_credentials':bool(re.search(r'CLOUDFLARE_(?:API_TOKEN|ACCOUNT_ID)',s)),
              'production_write_text':bool(re.search(r'(?i)(?:wrangler|bunx\s+wrangler|npm\s+exec.*wrangler).*\b(?:deploy|versions\s+deploy|secret\s+put)\b',s)),
              'pull_request_target':'pull_request_target' in s,
              'workflow_dispatch':'workflow_dispatch' in s,
              'scheduled':bool(re.search(r'(?m)^\s*schedule\s*:',s)),
              'unpinned_actions':[u for u in uses if '@' in u and not re.search(r'@[0-9a-fA-F]{40}$',u)],
              'uses':uses,
            })
          out={'workflow_count':len(rows),'rows':rows,'pull_request_target':[r['file'] for r in rows if r['pull_request_target']], 'with_cf_credentials':[r['file'] for r in rows if r['cloudflare_credentials']], 'write_capable_text':[r['file'] for r in rows if r['production_write_text']], 'unpinned_action_uses':sum(len(r['unpinned_actions']) for r in rows)}
          Path('test-results/issue39-static-audit/workflows.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in out.items() if k!='rows'},indent=2))
          PY

      - name: Full-history secret candidate scan without values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,re,json
          from pathlib import Path
          patterns=[
            ('openai',re.compile(rb'\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}')),
            ('github_pat',re.compile(rb'\bgithub_pat_[A-Za-z0-9_]{20,}')),
            ('github_classic',re.compile(rb'\bgh[pousr]_[A-Za-z0-9]{20,}')),
            ('google_api',re.compile(rb'\bAIza[0-9A-Za-z_-]{30,}')),
            ('cloudflare_token_assignment',re.compile(rb'CLOUDFLARE_API_TOKEN\s*[=:]\s*["\']?[A-Za-z0-9_-]{20,}')),
            ('private_key',re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----')),
          ]
          commits=subprocess.check_output(['git','rev-list','--all'],text=True).splitlines()
          findings=[]; seen=set()
          for sha in commits:
            names=subprocess.run(['git','ls-tree','-r','--name-only',sha],capture_output=True,text=True,check=True).stdout.splitlines()
            candidates=[n for n in names if not n.startswith(('node_modules/','.git/')) and not n.lower().endswith(('.png','.jpg','.jpeg','.gif','.webp','.woff','.woff2','.jar','.zip','.db'))]
            for name in candidates:
              try:data=subprocess.check_output(['git','show',f'{sha}:{name}'],stderr=subprocess.DEVNULL)
              except:continue
              if len(data)>2_000_000: continue
              kinds=[kind for kind,pat in patterns if pat.search(data)]
              if kinds:
                sig=(name,tuple(kinds))
                if sig not in seen:
                  findings.append({'commit':sha,'path':name,'kinds':kinds}); seen.add(sig)
          out={'result':'CANDIDATES_FOUND' if findings else 'NO_KNOWN_SECRET_PATTERNS','unique_path_kind_findings':len(findings),'findings':findings}
          Path('test-results/issue39-static-audit/history-secret-candidates.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps({'result':out['result'],'unique_path_kind_findings':len(findings),'paths':[f['path'] for f in findings]},indent=2))
          PY

      - name: Dependency advisory scan
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          bun audit > "$EVIDENCE_DIR/bun-audit.txt" 2>&1

      - name: Manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find "$EVIDENCE_DIR" -type f ! -name manifest.sha256 ! -name digest.txt -print0 | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_DIR/manifest.sha256"
          sha256sum "$EVIDENCE_DIR/manifest.sha256" > "$EVIDENCE_DIR/digest.txt"

      - name: Upload static audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voy-issue39-static-audit-${{ github.run_id }}
          path: test-results/issue39-static-audit
          if-no-files-found: error
          retention-days: 30
          overwrite: false

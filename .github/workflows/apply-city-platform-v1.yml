name: Apply City Platform V1

on:
  push:
    branches:
      - feat/voy-city-platform-v1
    paths:
      - scripts/apply-city-platform-v1.mjs
      - .github/workflows/apply-city-platform-v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/voy-city-platform-v1
          fetch-depth: 0
      - name: Apply exact migration
        run: node scripts/apply-city-platform-v1.mjs
      - name: Validate generated platform
        run: |
          git diff --check
          test -f public/cities/_default/profile.json
          test -f public/cities/santa-fe/profile.json
          grep -F 'VoyCityPlatform.loadCity' public/VOY-Lite.html
          ! grep -F "'city_' + fileId + '.json'" public/VOY-Lite.html
      - name: Commit generated source changes
        run: |
          git config user.name "voy-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/VOY-Lite.html public/cities
          git commit -m "feat(city): load versioned default and Santa Fe profiles"
          git push origin HEAD:feat/voy-city-platform-v1

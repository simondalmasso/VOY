name: Validate VOY pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enforce release policy
        run: node scripts/verify-release-policy.mjs

      - name: Install Bun 1.3.14
        run: |
          npm install --global bun@1.3.14
          test "$(bun --version)" = "1.3.14"

      - name: Frozen install
        run: bun install --frozen-lockfile

      - name: Pin Wrangler 4.112.0 for deterministic validation
        run: |
          npm install --no-save --package-lock=false wrangler@4.112.0
          test "$(./node_modules/.bin/wrangler --version | awk '{print $1}')" = "4.112.0"

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test

      - name: Wrangler dry-run
        run: ./node_modules/.bin/wrangler deploy --dry-run --minify

      - name: Install Chromium 1.61.1
        run: npx --yes --package=@playwright/test@1.61.1 playwright install --with-deps chromium

      - name: Browser smoke (local Worker)
        run: bash scripts/run-browser-smoke.sh

      - name: Observe current production baseline
        run: |
          curl -fsS https://voy-app.simondalmasso44.workers.dev/api/health > production-health.json
          node -e '
            const fs = require("node:fs");
            const health = JSON.parse(fs.readFileSync("production-health.json", "utf8"));
            if (health.ok !== true || health.version !== "V7.8.0") {
              throw new Error(`Unexpected public production health: ${JSON.stringify(health)}`);
            }
            console.log(`PUBLIC_PRODUCTION_OK=true VERSION=${health.version} BUILD=${health.build_hash || "unverified"}`);
            console.log("Production is an observed baseline; it is not required to equal the pull-request or main SHA.");
          '

      - name: Browser smoke (current production, read-only)
        env:
          VOY_BASE_URL: https://voy-app.simondalmasso44.workers.dev
          VOY_EVIDENCE_DIR: test-results/production-browser
          VOY_REPORT_DIR: playwright-report-production
        run: bash scripts/run-production-browser-smoke.sh

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pull-request-validation-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            production-health.json
            test-results/wrangler-local.log
            test-results/evidence/
            test-results/production-browser/
            playwright-report/
            playwright-report-production/

name: Validate VOY pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: voy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-svelte:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      BUILD_HASH: ${{ github.event.pull_request.head.sha }}
      VOY_METRICS_PATH: test-results/build-metrics.json
      VOY_EVIDENCE_DIR: test-results/pr-screens
      VOY_OUTPUT_DIR: test-results/pr-browser
      VOY_REPORT_DIR: playwright-report-pr
      VOY_LOCAL_SERVER_LOG: test-results/pr-vite.log
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --check
      - name: Install pinned frozen toolchain
        run: |
          set -euo pipefail
          npm install --global bun@1.3.14 wrangler@4.122.0
          test "$(bun --version)" = '1.3.14'
          test "$(wrangler --version | awk '{print $1}')" = '4.122.0'
          bun install --frozen-lockfile
          bun audit
          git diff --exit-code -- bun.lock
      - name: Release and syntax policy
        run: |
          set -euo pipefail
          node scripts/verify-release-policy.mjs
          node --check public/sw.js
          node --check scripts/svelte-candidate-gate.mjs
          node --check scripts/svelte-candidate-api-gate.mjs
          bash -n scripts/run-browser-smoke.sh scripts/run-master-final-candidate.sh
      - name: Typecheck lint tests build and budgets
        run: bun run validate
      - name: Wrangler exact build dry-run
        run: wrangler deploy --config dist/voy_app/wrangler.json --dry-run --minify
      - name: Install Chromium 1.61.1
        run: bunx playwright install --with-deps chromium
      - name: Clean-profile mobile and desktop browser gates
        env:
          WRANGLER_LOG: none
        run: bash scripts/run-browser-smoke.sh
      - name: Issue39 nine-viewport matrix
        if: ${{ github.event.pull_request.number == 42 }}
        shell: bash
        run: |
          set +e
          mkdir -p test-results/issue39-matrix-meta
          VOY_OUTPUT_DIR=test-results/issue39-pr-matrix VOY_REPORT_DIR=playwright-report-issue39-pr bunx playwright test -c browser-tests/issue39.playwright.config.ts --reporter=json > test-results/issue39-matrix-meta/playwright.json
          status=$?
          set -e
          MATRIX_STATUS="$status" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('test-results/issue39-matrix-meta/playwright.json','utf8'));
          const failures=[];
          const walk=(suite,trail=[])=>{
            const next=[...trail,...(suite.title?[suite.title]:[])];
            for(const spec of suite.specs||[]) for(const test of spec.tests||[]) for(const result of test.results||[]){
              if(['failed','timedOut','interrupted'].includes(result.status)) failures.push({title:[...next,spec.title].filter(Boolean).join(' > '),project:test.projectName||'',status:result.status,error:String(result.error?.message||result.errors?.[0]?.message||'unknown_failure').split('\n').slice(0,12).join('\n')});
            }
            for(const child of suite.suites||[]) walk(child,next);
          };
          for(const suite of report.suites||[]) walk(suite,[]);
          fs.writeFileSync('test-results/issue39-matrix-meta/failures.json',JSON.stringify({status:Number(process.env.MATRIX_STATUS),failure_count:failures.length,failures},null,2));
          console.log(`ISSUE39_MATRIX_FAILURE_COUNT=${failures.length}`);
          for(const [i,f] of failures.entries()) console.log(`FAILURE_${i+1}=${f.project} :: ${f.title}\n${f.error}`);
          NODE
          exit "$status"
      - name: Upload PR evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voy-pr-validation-${{ github.run_id }}
          path: |
            test-results
            playwright-report-pr
            playwright-report-issue39-pr
            dist/client/index.html
            dist/client/.vite/manifest.json
            dist/voy_app/wrangler.json
          if-no-files-found: error
          retention-days: 30

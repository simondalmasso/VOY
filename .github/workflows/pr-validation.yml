name: Validate Destination Resolution V2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun 1.3.14
        run: |
          npm install --global bun@1.3.14
          test "$(bun --version)" = "1.3.14"

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test

      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run --minify

      - name: Install Chromium 1.61.1
        run: npx --yes --package=@playwright/test@1.61.1 playwright install --with-deps chromium

      - name: Browser smoke (local Worker)
        run: bash scripts/run-browser-smoke.sh

      - name: Verify current production baseline
        env:
          VOY_BASE_URL: https://voy-app.simondalmasso44.workers.dev
          EXPECTED_VERSION: V7.8.0
          MAX_ATTEMPTS: 3
          POLL_SECONDS: 1
        run: |
          git fetch origin main --depth=1
          EXPECTED_HASH=$(git rev-parse origin/main)
          export EXPECTED_HASH
          bash scripts/verify-production-release.sh

      - name: Browser smoke (current production, no deploy)
        env:
          VOY_BASE_URL: https://voy-app.simondalmasso44.workers.dev
          VOY_EVIDENCE_DIR: test-results/production-browser
          VOY_REPORT_DIR: playwright-report-production
        run: bash scripts/run-production-browser-smoke.sh

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: destination-resolution-browser-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            test-results/evidence/
            test-results/production-browser/
            playwright-report/
            playwright-report-production/

name: VOY Map-First Production Finalize V4

on:
  push:
    branches:
      - ops/map-first-production-promote-20260812
    paths:
      - .map-first-production-finalize-ready-v4

permissions:
  contents: read

concurrency:
  group: voy-map-first-production-finalize-v4
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      WORKER_NAME: voy-app
      WORKER_URL: https://voy-app.simondalmasso44.workers.dev
      CANDIDATE_SOURCE_SHA: 796c9355cc22a2e197ee719a15b506b5a3cb22b3
      CANDIDATE_SHORT_SHA: 796c935
      CANDIDATE_VERSION_ID: 002c464c-15fa-42f3-a762-0214a1dc5cf3
      STABLE_VERSION_ID: 9273abef-69ab-451f-b2f0-ace4c8fd3bdd
      EXPECTED_STABLE_VERSION: V8.0.0
      EXPECTED_STABLE_HASH: c6aa730
      EXPECTED_CANDIDATE_VERSION: V8.0.0
      EXPECTED_MAIN_SHA: 9aa6ad7bc6aafeefc99fcdf1325a8f22a39337c8
      EXPECTED_FEATURE_HEAD: b3cb9a0d1f0d47cadaef983291f26b801d82a536
      EVIDENCE_DIR: test-results/map-first-production-finalize-v4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout V4 control commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fail-closed authority lineage and V4 syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .map-first-production-finalize-ready-v4)" = "MAP_FIRST_PRODUCTION_FINALIZE_V4_20260812_002c464c"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/ops/map-first-production-promote-20260812 | awk '{print $1}')" = "$GITHUB_SHA"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main refs/heads/feat/map-first-interaction-01:refs/remotes/origin/feat/map-first-interaction-01
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/feat/map-first-interaction-01)" = "$EXPECTED_FEATURE_HEAD"
          git merge-base --is-ancestor "$CANDIDATE_SOURCE_SHA" refs/remotes/origin/feat/map-first-interaction-01
          test -z "$(git diff --name-only "$CANDIDATE_SOURCE_SHA"..refs/remotes/origin/feat/map-first-interaction-01 | grep -Ev '^(docs/|$)' || true)"
          bash -n scripts/map-first-production-finalize-v4.sh
          printf '%s\n' \
            'PRODUCTION_PROMOTION_AUTHORIZED=YES' \
            'V3_PROMOTION_WRITE=SUCCESS' \
            'V3_IMMEDIATE_EDGE_HEALTH_CHECK=STALE_AND_INVALID_AS_CONVERGENCE_GATE' \
            "CANDIDATE_SOURCE_SHA=$CANDIDATE_SOURCE_SHA" \
            "CANDIDATE_VERSION_ID=$CANDIDATE_VERSION_ID" \
            "STABLE_VERSION_ID=$STABLE_VERSION_ID" \
            > finalize-authority.txt

      - name: Checkout immutable Map-First product source
        uses: actions/checkout@v4
        with:
          ref: 796c9355cc22a2e197ee719a15b506b5a3cb22b3
          path: source
          fetch-depth: 0

      - name: Install pinned frozen verification toolchain
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          npm install --global bun@1.3.14 wrangler@4.112.0
          test "$(bun --version)" = '1.3.14'
          test "$(wrangler --version | awk '{print $1}')" = '4.112.0'
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock
          bunx playwright install --with-deps chromium

      - name: Fresh immutable source safety gate
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SOURCE_SHA"
          node scripts/verify-release-policy.mjs
          git diff --check
          bun run typecheck
          bun run lint
          bun run test

      - name: Finalize current live state with bounded convergence and rollback
        shell: bash
        env:
          SOURCE_DIR: source
          EVIDENCE_DIR: test-results/map-first-production-finalize-v4
        run: bash scripts/map-first-production-finalize-v4.sh

      - name: Build immutable finalization evidence manifest
        if: always()
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cp ../finalize-authority.txt "$EVIDENCE_DIR/finalize-authority.txt" || true
          find "$EVIDENCE_DIR" -type f ! -name manifest.sha256 ! -name digest.txt -print0 | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_DIR/manifest.sha256"
          sha256sum "$EVIDENCE_DIR/manifest.sha256" > "$EVIDENCE_DIR/digest.txt"

      - name: Upload V4 production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voy-map-first-production-finalize-v4-${{ github.run_id }}
          path: source/test-results/map-first-production-finalize-v4
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          overwrite: false

      - name: Finalization summary
        if: always()
        shell: bash
        run: |
          {
            echo '## VOY Map-First production finalization V4'
            echo
            echo '- Source: `796c9355cc22a2e197ee719a15b506b5a3cb22b3`'
            echo '- Worker version: `002c464c-15fa-42f3-a762-0214a1dc5cf3`'
            echo '- Previous stable: `9273abef-69ab-451f-b2f0-ace4c8fd3bdd`'
            if [[ -f source/test-results/map-first-production-finalize-v4/entry-state.txt ]]; then
              echo '```text'
              cat source/test-results/map-first-production-finalize-v4/entry-state.txt
              echo '```'
            fi
            if [[ -f source/test-results/map-first-production-finalize-v4/production-final-state.json ]]; then
              echo '```json'
              cat source/test-results/map-first-production-finalize-v4/production-final-state.json
              echo '```'
            fi
            if [[ -f source/test-results/map-first-production-finalize-v4/rollback.log ]]; then
              echo '```text'
              cat source/test-results/map-first-production-finalize-v4/rollback.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

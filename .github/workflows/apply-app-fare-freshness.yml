name: Apply App Fare Freshness

on:
  push:
    branches:
      - fix/voy-app-fare-freshness-v1
    paths:
      - scripts/apply-app-fare-freshness.mjs
      - .github/workflows/apply-app-fare-freshness.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/voy-app-fare-freshness-v1
          fetch-depth: 0
      - name: Apply exact migration
        run: node scripts/apply-app-fare-freshness.mjs
      - name: Validate patch
        run: |
          git diff --check
          grep -F 'isAppFareUsable: isAppFareUsable' public/core/mobilityEngine.js
          grep -F 'id="appLivePriceOptions"' public/VOY-Lite.html
          grep -F 'core/mobilityEngine.js?v=12' public/VOY-Lite.html
      - name: Commit generated source changes
        run: |
          git config user.name "voy-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/core/mobilityEngine.js public/VOY-Lite.html
          git commit -m "fix(fares): fail closed on stale app prices"
          git push origin HEAD:fix/voy-app-fare-freshness-v1

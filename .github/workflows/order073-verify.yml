name: ORDER-073 release-candidate verification

on:
  push:
    branches:
      - feat/order073-mapfirst-live3d
    paths:
      - public/**
      - src/**
      - scripts/**
      - tests/**
      - package.json
      - package-lock.json
      - wrangler.toml
      - .github/workflows/order073-verify.yml
      - ORDER073_REPORT.md
  workflow_dispatch:

concurrency:
  group: order073-release-candidate
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEST_SHA: ${{ github.sha }}
  BASE_SHA: 9233f11ff50b329e5f81a2268627d510bc7fb90c
  EXPECTED_TOPOLOGY_SHA: 0c4a79f656fccd722de6cb20db504ebc09b2626b6d3caeccf2f78176788c75a2
  EXPECTED_RAW_SHA: a4a07ee50e139e3c603deb04950ac31f704a2993c6cda30cb4e36bda7489cf80

jobs:
  linux-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove ORDER-071 ancestry
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Provide powershell alias
        shell: bash
        run: sudo ln -sf "$(command -v pwsh)" /usr/local/bin/powershell
      - run: npm test
      - run: npm run build
      - name: Deterministic topology + raw provenance
        shell: bash
        run: |
          set -euo pipefail
          out="$(node scripts/build-order071-topology.mjs)"
          echo "$out"
          echo "$out" | grep "RAW_INPUT_SHA256=$EXPECTED_RAW_SHA"
          echo "$out" | grep "CHUNK_SHA256=$EXPECTED_TOPOLOGY_SHA"
          test "$(node -e "const m=require('./public/3d/topology/manifest.json');process.stdout.write(m.geometry_source.raw_input_sha256)")" = "$EXPECTED_RAW_SHA"
      - name: Package verification
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/BUILD_MANIFEST.json
          test -f dist/client/vendor/three.module.js
          test -f dist/client/vendor/three.core.js
          node -e "const m=require('./dist/BUILD_MANIFEST.json');if(m.source_commit!==process.env.GITHUB_SHA)process.exit(42);console.log('PACKAGE=PASS client_files='+m.client_file_count)"
      - name: Runtime forbidden-source audit
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'overpass-api|firecrawl|hidden.*cuando|mitm|private.*trackviewer' public src 2>/dev/null
          echo "RUNTIME_AUDIT=PASS"
      - name: Wrangler dry-run only
        run: npx wrangler deploy --dry-run --outdir .order073-wrangler-dry-run
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: order073-linux-evidence
          path: |
            dist/BUILD_MANIFEST.json
            public/3d/topology/manifest.json
          retention-days: 3

  chrome-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ci/order072-order071-verify
          path: evidence-harness
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - working-directory: source
        run: npm ci --ignore-scripts
      - name: Provide powershell alias
        shell: bash
        run: sudo ln -sf "$(command -v pwsh)" /usr/local/bin/powershell
      - working-directory: source
        run: npm run build
      - name: Chrome desktop + mobile evidence
        shell: bash
        env:
          BROWSER: chrome
          SOURCE_DIR: ${{ github.workspace }}/source
          CI_DIR: ${{ github.workspace }}/evidence-harness
          EVIDENCE_DIR: ${{ github.workspace }}/evidence-harness/order072/evidence/chrome-order073
        run: node evidence-harness/order072/evidence/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order073-chrome-evidence
          path: evidence-harness/order072/evidence/chrome-order073/
          retention-days: 3

  edge-browser:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ci/order072-order071-verify
          path: evidence-harness
      - name: Prove real Edge
        shell: pwsh
        run: |
          $edge1='C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          $edge2='C:\Program Files\Microsoft\Edge\Application\msedge.exe'
          if (!(Test-Path $edge1) -and !(Test-Path $edge2)) { throw 'real_edge_not_found' }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - working-directory: source
        run: npm ci --ignore-scripts
      - name: Build with PowerShell 7
        shell: pwsh
        working-directory: source
        run: |
          Import-Module Microsoft.PowerShell.Utility
          ./scripts/build.ps1
      - name: Edge desktop + mobile evidence
        shell: pwsh
        env:
          BROWSER: edge
          SOURCE_DIR: ${{ github.workspace }}\source
          CI_DIR: ${{ github.workspace }}\evidence-harness
          EVIDENCE_DIR: ${{ github.workspace }}\evidence-harness\order072\evidence\edge-order073
        run: node evidence-harness/order072/evidence/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order073-edge-evidence
          path: evidence-harness/order072/evidence/edge-order073/
          retention-days: 3

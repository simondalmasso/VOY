name: VOY Voice Copilot V1 Zero-Traffic Candidate

on:
  push:
    branches:
      - feat/voy-voice-copilot-v1
    paths:
      - .github/workflows/voice-copilot-candidate.yml
      - eslint.config.mjs
      - voiceCopilot*.mjs
      - worker-entry.js
      - wrangler.jsonc
      - public/core/voiceCopilot.js
      - public/ui/voiceCopilot.css
      - __tests__/voiceCopilot*.test.js
      - voice-tests/**
      - voice-candidate-tests/**
      - scripts/run-voice-browser-smoke.sh
      - scripts/run-voice-copilot-candidate.sh
      - scripts/voice-candidate-api-gate.mjs

permissions:
  contents: read

concurrency:
  group: voy-voice-copilot-v1-candidate
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      WORKER_NAME: voy-app
      WORKER_URL: https://voy-app.simondalmasso44.workers.dev
      EXPECTED_PRODUCTION_VERSION: V7.8.0
      EXPECTED_PRODUCTION_HASH: 841d9f4
      EXPECTED_STABLE_VERSION_ID: 1ddc8c2d-5c44-4217-b64b-61470d0cbe08
      EXPECTED_SOURCE_ROOT: ${{ github.workspace }}
      CONVERGENCE_INTERVAL_MS: 7000
      EVIDENCE_DIR: test-results/voice-candidate
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout exact Voice head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact branch identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check

      - name: Install frozen toolchain and speech fixture dependency
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng
          npm install --global bun@1.3.14 wrangler@4.112.0
          test "$(bun --version)" = '1.3.14'
          test "$(wrangler --version | awk '{print $1}')" = '4.112.0'
          bun install --frozen-lockfile

      - name: Install Chromium 1.61.1
        run: npx --yes --package=@playwright/test@1.61.1 playwright install --with-deps chromium

      - name: Validate and create Voice candidate at zero traffic
        run: bash scripts/run-voice-copilot-candidate.sh

      - name: Build immutable evidence manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          find "$EVIDENCE_DIR" -type f ! -name manifest.sha256 ! -name digest.txt -print0 \
            | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/manifest.sha256"
          sha256sum "$EVIDENCE_DIR/manifest.sha256" > "$EVIDENCE_DIR/digest.txt"

      - name: Upload Voice candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voy-voice-candidate-${{ github.run_id }}
          path: |
            test-results/voice-candidate
            test-results/evidence
            playwright-report
          if-no-files-found: error
          retention-days: 30

      - name: Candidate summary
        if: always()
        run: |
          {
            echo '## VOY Voice Copilot V1 candidate'
            echo
            echo "- Exact source SHA: $GITHUB_SHA"
            echo "- Production version: $EXPECTED_STABLE_VERSION_ID at 100%"
            echo "- Voice candidate version: ${CANDIDATE_VERSION_ID:-unresolved} at 0%"
            echo "- Deployment: ${CANDIDATE_DEPLOYMENT_ID:-unresolved}"
            echo '- Workers AI: Whisper + Qwen'
            echo '- Voice production promotion: no'
            echo '- PR merge: no'
            if [ -f "$EVIDENCE_DIR/final-state.json" ]; then
              echo '```json'
              cat "$EVIDENCE_DIR/final-state.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

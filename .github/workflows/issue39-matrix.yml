name: VOY Issue39 Exact-Head Matrix

on:
  push:
    branches:
      - audit/issue39-global-adversarial-20260812
    paths:
      - .issue39-matrix-ready

permissions:
  contents: read

concurrency:
  group: voy-issue39-matrix
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      VOY_OUTPUT_DIR: test-results/issue39-matrix
      VOY_REPORT_DIR: playwright-report-issue39
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Gate authority and exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .issue39-matrix-ready)" = 'ISSUE39_MATRIX_V2'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin refs/heads/audit/issue39-global-adversarial-20260812 | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          printf 'AUD_PASS_TO_RESUME=5288893154\nVISUAL_DIRECTIVE=5288808652\nMERGE_AUTHORIZED=NO\nPRODUCTION_PROMOTION_AUTHORIZED=NO\n' > issue39-matrix-authority.txt
      - name: Install frozen audited toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global bun@1.3.14 wrangler@4.122.0
          test "$(bun --version)" = '1.3.14'
          test "$(wrangler --version | awk '{print $1}')" = '4.122.0'
          bun install --frozen-lockfile
          bun audit
          bunx playwright install --with-deps chromium
      - name: Deterministic validation and dry-run
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-release-policy.mjs
          bun run validate
          wrangler deploy --dry-run --outdir /tmp/issue39-matrix-wrangler
          git diff --check
      - name: Nine-viewport visual and interaction matrix
        shell: bash
        run: bunx playwright test -c browser-tests/issue39.playwright.config.ts
      - name: Evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/issue39-matrix-meta
          cp issue39-matrix-authority.txt test-results/issue39-matrix-meta/authority.txt || true
          printf '%s\n' "$GITHUB_SHA" > test-results/issue39-matrix-meta/exact-head.txt
          find test-results playwright-report-issue39 -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum > test-results/issue39-matrix-meta/manifest.sha256
          sha256sum test-results/issue39-matrix-meta/manifest.sha256 > test-results/issue39-matrix-meta/digest.txt
      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voy-issue39-matrix-${{ github.run_id }}
          path: |
            test-results
            playwright-report-issue39
          if-no-files-found: error
          retention-days: 30

name: Apply VOY Master Workset

on:
  push:
    branches:
      - feat/voy-complete-product-master-01
    paths:
      - .github/workflows/master-apply-workset.yml

permissions:
  contents: write

concurrency:
  group: voy-master-apply-workset
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout canonical integration branch
        uses: actions/checkout@v4
        with:
          ref: feat/voy-complete-product-master-01
          fetch-depth: 0

      - name: Verify, apply, validate and publish exact workset
        shell: bash
        run: |
          set -euo pipefail
          cat \
            ops/master-workset.part00 \
            ops/master-workset.part01 \
            ops/master-workset.part02 \
            ops/master-workset.part03 \
            ops/master-workset.part04 \
            ops/master-workset.part05 \
            ops/master-workset.part06 \
            ops/master-workset.part07 \
            ops/master-workset.part08a \
            ops/master-workset.part08b \
            ops/master-workset.part08c \
            > /tmp/voy-master-workset.patch.gz.b64
          test "$(sha256sum /tmp/voy-master-workset.patch.gz.b64 | awk '{print $1}')" = "9dd7253e87d1bd97c910c4a841675f2994bec52864994400de6872f7c52e7af3"
          base64 --decode /tmp/voy-master-workset.patch.gz.b64 | gzip --decompress > /tmp/voy-master-workset.patch
          test "$(sha256sum /tmp/voy-master-workset.patch | awk '{print $1}')" = "d0ab550426445ec38ad490b06317946580245964b6d48a54e18a56cbef9e3288"
          git apply --check /tmp/voy-master-workset.patch
          git apply /tmp/voy-master-workset.patch
          sed -i 's/governance: google_drive/governance: github/' docs/control/release-policy.yaml
          rm -f ops/master-workset.part00 ops/master-workset.part01 ops/master-workset.part02 \
            ops/master-workset.part03 ops/master-workset.part04 ops/master-workset.part05 \
            ops/master-workset.part06 ops/master-workset.part07 \
            ops/master-workset.part08a ops/master-workset.part08b ops/master-workset.part08c
          rm -f .github/workflows/master-apply-workset.yml
          git add -A
          git diff --cached --check
          node scripts/verify-release-policy.mjs
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: complete VOY internal product workset"
          git push origin HEAD:feat/voy-complete-product-master-01

name: VOY Hotfix32 Authorized Production Close

on:
  push:
    branches: [ops/voy-hotfix32-prod-close-01]
    paths: [.github/workflows/hotfix32-production-close.yml]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: voy-hotfix32-production-close
  cancel-in-progress: false

env:
  WORKER_NAME: voy-app
  WORKER_URL: https://voy-app.simondalmasso44.workers.dev
  PRODUCT_SHA: 403ad4fc96f0b7138151f6267b996cd900f752c2
  PRODUCT_SHORT_SHA: 403ad4f
  PRODUCT_BRANCH: hotfix/voy-post-release-map-mobile-ui-01
  EXPECTED_MAIN_SHA: ed018f3bc6f6cc276e36d8eeeb91dac2cc11d7d9
  STABLE_VERSION_ID: 2ee28f09-1aa8-4250-bb2c-ba4684a07791
  CANDIDATE_VERSION_ID: 2f86d708-b905-4c33-b1fe-d881467e8542
  BLOCKED_CANDIDATE_VERSION_ID: 28e040f0-c77e-4f53-a819-24bfef113976
  EXPECTED_STABLE_VERSION: V8.0.0
  EXPECTED_STABLE_HASH: 1f1e1d3
  EXPECTED_CANDIDATE_VERSION: V8.0.0
  EVIDENCE_DIR: evidence/hotfix32-production-close

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout operator
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout immutable audited source
        uses: actions/checkout@v4
        with:
          ref: 403ad4fc96f0b7138151f6267b996cd900f752c2
          path: source
          fetch-depth: 0

      - name: Install pinned release toolchain
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --global bun@1.3.14 wrangler@4.112.0
          test "$(bun --version)" = 1.3.14
          test "$(wrangler --version | awk '{print $1}')" = 4.112.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng
          cd source
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock
          bunx playwright install --with-deps chromium

      - name: Fresh fail-closed Cloudflare and source preflight
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git -C source rev-parse HEAD)" = "$PRODUCT_SHA"
          remote_head="$(git -C source ls-remote origin refs/heads/$PRODUCT_BRANCH | awk '{print $1}')"
          remote_main="$(git -C source ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_head" = "$PRODUCT_SHA"
          test "$remote_main" = "$EXPECTED_MAIN_SHA"
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME"
          curl -fsS --retry 3 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API_ROOT/deployments" > "$EVIDENCE_DIR/deployments-preflight.json"
          curl -fsS --retry 3 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API_ROOT/versions/$STABLE_VERSION_ID" > "$EVIDENCE_DIR/stable-version-preflight.json"
          curl -fsS --retry 3 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API_ROOT/versions/$CANDIDATE_VERSION_ID" > "$EVIDENCE_DIR/candidate-version-preflight.json"
          curl -fsS --retry 3 "$WORKER_URL/api/health?preflight=$(date +%s%N)" > "$EVIDENCE_DIR/stable-health-preflight.json"
          curl -fsS --retry 3 -H "Cloudflare-Workers-Version-Overrides: $WORKER_NAME=\"$CANDIDATE_VERSION_ID\"" "$WORKER_URL/api/health?candidate_preflight=$(date +%s%N)" > "$EVIDENCE_DIR/candidate-health-preflight.json"
          cd source
          wrangler versions view "$CANDIDATE_VERSION_ID" > "$GITHUB_WORKSPACE/$EVIDENCE_DIR/candidate-version-view.txt" 2>&1
          cd ..
          grep -Eq "$PRODUCT_SHA|voy-hotfix-map-mobile-${PRODUCT_SHA:0:12}" "$EVIDENCE_DIR/candidate-version-view.txt"
          node <<'NODE'
          const fs=require('node:fs'); const e=process.env.EVIDENCE_DIR;
          const payload=JSON.parse(fs.readFileSync(`${e}/deployments-preflight.json`,'utf8')); if(payload.success!==true)throw new Error('deployments_query_failed');
          const list=payload.result?.deployments||payload.result||[]; const active=list[0]; if(!active||!Array.isArray(active.versions))throw new Error('active_deployment_missing');
          const m=new Map(active.versions.map(v=>[v.version_id,Number(v.percentage)]));
          if(m.get(process.env.STABLE_VERSION_ID)!==100)throw new Error('stable_not_100');
          if(m.get(process.env.CANDIDATE_VERSION_ID)!==0)throw new Error('candidate_not_0');
          if(active.versions.some(v=>![process.env.STABLE_VERSION_ID,process.env.CANDIDATE_VERSION_ID].includes(v.version_id)&&Number(v.percentage)!==0))throw new Error('unexpected_nonzero_version');
          const s=JSON.parse(fs.readFileSync(`${e}/stable-health-preflight.json`,'utf8'));
          const c=JSON.parse(fs.readFileSync(`${e}/candidate-health-preflight.json`,'utf8'));
          if(s.ok!==true||s.version!==process.env.EXPECTED_STABLE_VERSION||s.build_hash!==process.env.EXPECTED_STABLE_HASH)throw new Error('stable_health_drift');
          if(c.ok!==true||c.version!==process.env.EXPECTED_CANDIDATE_VERSION||c.build_hash!==process.env.PRODUCT_SHORT_SHA)throw new Error('candidate_health_drift');
          function bindings(path){const p=JSON.parse(fs.readFileSync(path,'utf8'));if(p.success!==true)throw new Error('version_detail_failed');const list=p.result?.resources?.bindings;if(!Array.isArray(list))throw new Error('bindings_missing');return list.map(b=>`${b.name}:${b.type}`).sort();}
          const sb=bindings(`${e}/stable-version-preflight.json`), cb=bindings(`${e}/candidate-version-preflight.json`); if(JSON.stringify(sb)!==JSON.stringify(cb))throw new Error('binding_contract_drift');
          fs.writeFileSync(`${e}/preflight.json`,JSON.stringify({result:'PASS',product_sha:process.env.PRODUCT_SHA,main_sha:process.env.EXPECTED_MAIN_SHA,deployment_id:active.id,stable_version_id:process.env.STABLE_VERSION_ID,stable_traffic:100,candidate_version_id:process.env.CANDIDATE_VERSION_ID,candidate_traffic:0,binding_contract:'PASS',stable_health:s,candidate_health:c,checked_at:new Date().toISOString()},null,2));
          NODE

      - name: Reconfirm audited candidate real-map and API gates before write
        run: |
          set -euo pipefail
          cd source
          SHORT_SHA="$PRODUCT_SHORT_SHA" WORKER_URL="$WORKER_URL" WORKER_NAME="$WORKER_NAME" CANDIDATE_VERSION_ID="$CANDIDATE_VERSION_ID" EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR" node scripts/svelte-candidate-api-gate.mjs
          WORKER_URL="$WORKER_URL" WORKER_NAME="$WORKER_NAME" CANDIDATE_VERSION_ID="$CANDIDATE_VERSION_ID" EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR" node scripts/verify-retired-candidate-assets.mjs
          VOY_BASE_URL="$WORKER_URL" VOY_EXTERNAL_SERVER=1 VOY_REAL_BASEMAP=1 VOY_WORKER_NAME="$WORKER_NAME" VOY_CANDIDATE_VERSION_ID="$CANDIDATE_VERSION_ID" VOY_EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/preflight-map-screens" VOY_OUTPUT_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/preflight-map-output" VOY_REPORT_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/preflight-map-report" bunx playwright test -c browser-tests/playwright.config.ts browser-tests/map-render-proof.spec.ts

      - name: Promote exact candidate and validate complete production
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME"
          PROMOTED=0; ROLLED_BACK=0; TAIL_PID=''
          stop_tail(){ if [ -n "${TAIL_PID:-}" ] && kill -0 "$TAIL_PID" 2>/dev/null; then kill "$TAIL_PID" 2>/dev/null || true; wait "$TAIL_PID" 2>/dev/null || true; fi; }
          rollback_failure(){
            local cause="$1"; trap - ERR; stop_tail; printf '%s\n' "$cause" > "$EVIDENCE_DIR/first-causal-error.txt"
            if [ "$PROMOTED" = 1 ] && [ "$ROLLED_BACK" = 0 ]; then
              ROLLED_BACK=1
              cd source
              wrangler versions deploy "$STABLE_VERSION_ID@100%" "$CANDIDATE_VERSION_ID@0%" --message "VOY hotfix32 single rollback after first production failure" --yes 2>&1 | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/rollback.log"
              cd ..
              for i in $(seq 1 40); do
                curl -fsS --retry 2 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API_ROOT/deployments" > "$EVIDENCE_DIR/rollback-deployments.json" || true
                curl -fsS --retry 2 "$WORKER_URL/api/health?rollback=$i-$(date +%s%N)" > "$EVIDENCE_DIR/rollback-health.json" || true
                if node -e 'const fs=require("fs");try{const d=JSON.parse(fs.readFileSync(process.argv[1]));const l=d.result?.deployments||d.result||[];const a=l[0];const m=new Map((a?.versions||[]).map(v=>[v.version_id,Number(v.percentage)]));const h=JSON.parse(fs.readFileSync(process.argv[2]));process.exit(m.get(process.env.STABLE_VERSION_ID)===100&&m.get(process.env.CANDIDATE_VERSION_ID)===0&&h.ok===true&&h.version===process.env.EXPECTED_STABLE_VERSION&&h.build_hash===process.env.EXPECTED_STABLE_HASH?0:1)}catch{process.exit(1)}' "$EVIDENCE_DIR/rollback-deployments.json" "$EVIDENCE_DIR/rollback-health.json"; then
                  printf '{"result":"PASS","rollback_count":1,"verified_at":"%s"}\n' "$(date -u +%FT%TZ)" > "$EVIDENCE_DIR/rollback-result.json"; return 0
                fi
                sleep 5
              done
              printf '{"result":"FAIL","rollback_count":1,"verified_at":"%s"}\n' "$(date -u +%FT%TZ)" > "$EVIDENCE_DIR/rollback-result.json"
            fi
            return 1
          }
          on_error(){ local code=$?; rollback_failure "exit=$code line=$1 command=$2" || true; exit "$code"; }
          trap 'on_error "$LINENO" "$BASH_COMMAND"' ERR

          cd source
          wrangler versions deploy "$CANDIDATE_VERSION_ID@100%" "$STABLE_VERSION_ID@0%" --message "VOY hotfix32 AUD 5215747741 authorized production promotion $PRODUCT_SHA" --yes 2>&1 | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/promotion.log"
          cd ..; PROMOTED=1

          : > "$EVIDENCE_DIR/production-tail.log"
          cd source
          timeout 1200s wrangler tail "$WORKER_NAME" --format json --version-id "$CANDIDATE_VERSION_ID" > "$GITHUB_WORKSPACE/$EVIDENCE_DIR/production-tail.log" 2>&1 & TAIL_PID=$!
          cd ..
          sleep 5

          node <<'NODE'
          import fs from 'node:fs';
          const e=process.env.EVIDENCE_DIR, base=process.env.WORKER_URL, api=`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${process.env.WORKER_NAME}`;
          const auth={Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}; const sleep=ms=>new Promise(r=>setTimeout(r,ms)); const started=Date.now(); let consecutive=0,last=null;
          fs.writeFileSync(`${e}/production-convergence.jsonl`,'');
          for(let round=1;round<=80;round++){
            let ok=false, rec={round,timestamp:new Date().toISOString(),elapsed_ms:Date.now()-started};
            try{
              const [dr,hr,root]=await Promise.all([
                fetch(`${api}/deployments`,{headers:auth,signal:AbortSignal.timeout(25000)}),
                fetch(`${base}/api/health?prod=${round}-${Date.now()}`,{headers:{'Cache-Control':'no-cache, no-store'},signal:AbortSignal.timeout(25000)}),
                fetch(`${base}/?prod=${round}-${Date.now()}`,{headers:{'Cache-Control':'no-cache, no-store'},signal:AbortSignal.timeout(25000)})
              ]);
              const d=await dr.json(), h=await hr.json(); await root.arrayBuffer(); const l=d.result?.deployments||d.result||[],a=l[0],m=new Map((a?.versions||[]).map(v=>[v.version_id,Number(v.percentage)]));
              const deploymentOk=d.success===true&&m.get(process.env.CANDIDATE_VERSION_ID)===100&&m.get(process.env.STABLE_VERSION_ID)===0&&(a.versions||[]).every(v=>[process.env.CANDIDATE_VERSION_ID,process.env.STABLE_VERSION_ID].includes(v.version_id)||Number(v.percentage)===0);
              const healthOk=h.ok===true&&h.version===process.env.EXPECTED_CANDIDATE_VERSION&&h.build_hash===process.env.PRODUCT_SHORT_SHA; ok=deploymentOk&&healthOk&&root.status===200; rec={...rec,deployment_id:a?.id||null,deployment_ok:deploymentOk,health_ok:healthOk,root_ok:root.status===200,health:h};
            }catch(err){rec.error=String(err)}
            consecutive=ok?consecutive+1:0; rec.consecutive=consecutive; last=rec; fs.appendFileSync(`${e}/production-convergence.jsonl`,JSON.stringify(rec)+'\n');
            if(consecutive>=20 && Date.now()-started>=120000){fs.writeFileSync(`${e}/production-convergence-proof.json`,JSON.stringify(rec,null,2));break}
            await sleep(7000);
          }
          if(!last||last.consecutive<20||Date.now()-started<120000)throw new Error('production_did_not_converge');
          NODE

          curl -fsS --retry 3 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API_ROOT/deployments" > "$EVIDENCE_DIR/deployments-production.json"
          curl -fsS --retry 3 "$WORKER_URL/api/health?final=$(date +%s%N)" > "$EVIDENCE_DIR/production-health.json"
          node <<'NODE'
          const fs=require('node:fs'); const e=process.env.EVIDENCE_DIR;
          const h=JSON.parse(fs.readFileSync(`${e}/production-health.json`,'utf8')); if(h.ok!==true||h.version!==process.env.EXPECTED_CANDIDATE_VERSION||h.build_hash!==process.env.PRODUCT_SHORT_SHA)throw new Error('production_health_mismatch');
          const d=JSON.parse(fs.readFileSync(`${e}/deployments-production.json`,'utf8')); if(d.success!==true)throw new Error('deployment_query_failed'); const l=d.result?.deployments||d.result||[],a=l[0],m=new Map((a?.versions||[]).map(v=>[v.version_id,Number(v.percentage)])); if(m.get(process.env.CANDIDATE_VERSION_ID)!==100||m.get(process.env.STABLE_VERSION_ID)!==0)throw new Error('production_traffic_mismatch'); fs.writeFileSync(`${e}/production-state.json`,JSON.stringify({result:'PASS',deployment_id:a.id,candidate_version_id:process.env.CANDIDATE_VERSION_ID,candidate_traffic:100,stable_version_id:process.env.STABLE_VERSION_ID,stable_traffic:0,health:h,verified_at:new Date().toISOString()},null,2));
          NODE

          cd source
          SHORT_SHA="$PRODUCT_SHORT_SHA" WORKER_URL="$WORKER_URL" WORKER_NAME="$WORKER_NAME" CANDIDATE_VERSION_ID="$CANDIDATE_VERSION_ID" EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR" node scripts/svelte-candidate-api-gate.mjs
          WORKER_URL="$WORKER_URL" WORKER_NAME="$WORKER_NAME" CANDIDATE_VERSION_ID="$CANDIDATE_VERSION_ID" EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR" node scripts/verify-retired-candidate-assets.mjs
          espeak-ng -v es -s 125 -w "$GITHUB_WORKSPACE/$EVIDENCE_DIR/voice-sample-es-ar.wav" 'Hola VOY quiero ir a la terminal de omnibus'
          VOICE_SAMPLE_WAV="$GITHUB_WORKSPACE/$EVIDENCE_DIR/voice-sample-es-ar.wav" SHORT_SHA="$PRODUCT_SHORT_SHA" WORKER_URL="$WORKER_URL" WORKER_NAME="$WORKER_NAME" CANDIDATE_VERSION_ID="$CANDIDATE_VERSION_ID" EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR" node scripts/voice-candidate-api-gate.mjs
          VOY_BASE_URL="$WORKER_URL" VOY_EXTERNAL_SERVER=1 VOY_REAL_BASEMAP=1 VOY_EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/production-browser-screens" VOY_OUTPUT_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/production-browser-output" VOY_REPORT_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/production-browser-report" bunx playwright test -c browser-tests/playwright.config.ts 2>&1 | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/production-browser.log"
          cd ..

          stop_tail
          trap - ERR
          cd source
          EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR" CANDIDATE_VERSION_ID="$CANDIDATE_VERSION_ID" node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { extractTailProof } from './scripts/svelte-candidate-gate.mjs';
          const e=process.env.EVIDENCE_DIR, root=`${e}/production-browser-screens`;
          const files=[]; const walk=d=>{for(const x of readdirSync(d,{withFileTypes:true})){const p=join(d,x.name);if(x.isDirectory())walk(p);else if(x.name.endsWith('-map-pixel-proof.json'))files.push(p)}}; walk(root);
          if(files.length<6)throw new Error(`production_pixel_proof_count:${files.length}`);
          for(const f of files){const p=JSON.parse(readFileSync(f,'utf8')),c=p.images?.[0]?.checks||{};if(p.result!=='PASS'||c.basemap_non_flat!==true||c.route_visible!==true||c.origin_marker_visible!==true||c.destination_marker_visible!==true)throw new Error(`production_pixel_gate:${f}`)}
          const tailText=existsSync(`${e}/production-tail.log`)?readFileSync(`${e}/production-tail.log`,'utf8'):''; const tail=extractTailProof(tailText,process.env.CANDIDATE_VERSION_ID); let exceptions=0; for(const line of tailText.split(/\r?\n/)){if(!line.trim().startsWith('{'))continue;try{const ev=JSON.parse(line);if(Array.isArray(ev.exceptions))exceptions+=ev.exceptions.length}catch{}}
          if(tail.nonOkOutcomes.length||exceptions)throw new Error('tail_runtime_failure');
          writeFileSync(`${e}/final-state.json`,JSON.stringify({result:'PASS',exact_source_sha:process.env.PRODUCT_SHA,candidate_version_id:process.env.CANDIDATE_VERSION_ID,candidate_traffic:100,stable_version_id:process.env.STABLE_VERSION_ID,stable_traffic:0,production_real_map_pixel_proof:'PASS',production_pixel_files:files.length,basemap_visible:true,route_visible:true,origin_marker_visible:true,destination_marker_visible:true,observability:tail.exactEvents>0?'PASS':'DEGRADED_NO_EVENTS',exact_version_tail_events:tail.exactEvents,non_ok_tail_outcomes:tail.nonOkOutcomes,tail_exceptions:exceptions,production_promoted:true,rollback_executed:false,verified_at:new Date().toISOString()},null,2)+'\n');
          NODE
          cd ..

      - name: Build immutable production-close evidence manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          find "$EVIDENCE_DIR" -type f ! -name manifest.sha256 ! -name digest.txt -print0 | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_DIR/manifest.sha256"
          sha256sum "$EVIDENCE_DIR/manifest.sha256" > "$EVIDENCE_DIR/digest.txt"

      - name: Upload production-close evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voy-hotfix32-production-close-${{ github.run_id }}
          path: evidence/hotfix32-production-close
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

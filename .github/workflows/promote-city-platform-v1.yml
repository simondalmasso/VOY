name: VOY City Platform Second Production Promotion
on:
  push:
    branches: [ops/voy-city-platform-second-promotion-v1]
    paths: [.github/workflows/promote-city-platform-v1.yml]
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: voy-city-platform-production-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      WORKER_NAME: voy-app
      WORKER_URL: https://voy-app.simondalmasso44.workers.dev
      SOURCE_ROOT: source
      EVIDENCE_DIR: evidence/city-platform-second-promotion
      EXPECTED_MAIN_SHA: 4a8b91e605597989b3db19860a745c21472a3a14
      EXPECTED_PR_HEAD: 85659454cf6983c39338e0cecbed8e1a6b3f3cb4
      EXPECTED_BUILD_HASH: 8565945
      EXPECTED_PRODUCTION_VERSION: V7.8.0
      EXPECTED_STABLE_BUILD: 4a8b91e
      EXPECTED_CI_RUN: '29842423000'
      EXPECTED_CANDIDATE_RUN: '29842417223'
      EXPECTED_DEPLOYMENT_ID: 69b6c38e-2cd7-4e8e-925a-dd853931e773
      STABLE_VERSION_ID: 9508254e-6bbe-48ee-a126-d57d405b70a6
      CANDIDATE_VERSION_ID: 89f7d347-4fb4-400e-8a75-ddb18ae8ca13
      CANDIDATE_ARTIFACT_ID: '8500075981'
      CANDIDATE_ARTIFACT_DIGEST: sha256:1b3794cf748e401b6537912c7e3eab54bd08905bd80224f8fe2d2250dac221d1
      CONVERGENCE_INTERVAL_MS: '7000'
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          ref: 85659454cf6983c39338e0cecbed8e1a6b3f3cb4
          path: source
          fetch-depth: 0
      - name: Preflight, promote, converge, validate
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          gunzip -c ops/second-promotion-runner.mjs.gz > ops/second-promotion-runner.mjs
          node --check ops/second-promotion-runner.mjs
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_PR_HEAD"
          git -C source fetch origin main --depth=1
          test "$(git -C source rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN_SHA"
          npm install --global bun@1.3.14 wrangler@4.112.0
          cd source
          bun install --frozen-lockfile
          bun run lint | tee "../$EVIDENCE_DIR/eslint.log"
          bun run test | tee "../$EVIDENCE_DIR/node-tests.log"
          wrangler deploy --dry-run --minify | tee "../$EVIDENCE_DIR/wrangler-dry-run.log"
          cd ..
          npx --yes --package=@playwright/test@1.61.1 playwright install --with-deps chromium
          node ops/second-promotion-runner.mjs preflight
          PROMOTED=0; ROLLED_BACK=0; TAIL_PID=''
          stop_tail() { if [ -n "${TAIL_PID:-}" ] && kill -0 "$TAIL_PID" 2>/dev/null; then kill "$TAIL_PID" 2>/dev/null || true; wait "$TAIL_PID" 2>/dev/null || true; fi; }
          rollback() {
            status=$?; trap - ERR; stop_tail
            if [ "$PROMOTED" = 1 ] && [ "$ROLLED_BACK" = 0 ]; then
              ROLLED_BACK=1; cd source
              wrangler versions deploy "$STABLE_VERSION_ID@100%" "$CANDIDATE_VERSION_ID@0%" --message 'Rollback PR #21 second production attempt' --yes 2>&1 | tee "../$EVIDENCE_DIR/rollback.log"
              cd ..; node ops/second-promotion-runner.mjs verify-rollback
              cd source
              VOY_BASE_URL="$WORKER_URL" VOY_EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/rollback-browser" VOY_OUTPUT_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/rollback-output" VOY_REPORT_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/rollback-report" bash scripts/run-production-browser-smoke.sh 2>&1 | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/rollback-browser.log"
              cd ..
            fi
            exit "$status"
          }
          trap rollback ERR; trap stop_tail EXIT
          cd source
          wrangler versions deploy "$CANDIDATE_VERSION_ID@100%" "$STABLE_VERSION_ID@0%" --message "PR #21 second authorized production promotion $EXPECTED_PR_HEAD" --yes 2>&1 | tee "../$EVIDENCE_DIR/promotion.log"
          cd ..; PROMOTED=1
          cd source
          timeout 900s wrangler tail "$WORKER_NAME" --format json --version-id "$CANDIDATE_VERSION_ID" > "../$EVIDENCE_DIR/production-tail.log" 2>&1 & TAIL_PID=$!
          cd ..; sleep 5; kill -0 "$TAIL_PID"
          node ops/second-promotion-runner.mjs converge
          VOY_BASE_URL="$WORKER_URL" SOURCE_ROOT="$SOURCE_ROOT" node ops/prepare-production-browser.mjs
          cd source
          export VOY_BASE_URL="$WORKER_URL" VOY_CANDIDATE_VERSION_ID="$CANDIDATE_VERSION_ID" VOY_EXPECTED_BUILD_HASH="$EXPECTED_BUILD_HASH" VOY_EXPECTED_SOURCE_ROOT="$GITHUB_WORKSPACE/source"
          export VOY_EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/production-city-browser" VOY_OUTPUT_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/production-city-output" VOY_REPORT_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/production-city-report"
          npm exec --yes --package=@playwright/test@1.61.1 -- sh -c 'PLAYWRIGHT_BIN=$(command -v playwright); NODE_PATH=$(cd "$(dirname "$PLAYWRIGHT_BIN")/.." && pwd); export NODE_PATH; playwright test --config=production-second-promotion-tests/playwright.config.cjs' 2>&1 | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/production-city-browser.log"
          export VOY_EVIDENCE_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/production-standard-browser" VOY_OUTPUT_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/production-standard-output" VOY_REPORT_DIR="$GITHUB_WORKSPACE/$EVIDENCE_DIR/production-standard-report"
          bash scripts/run-production-browser-smoke.sh 2>&1 | tee "$GITHUB_WORKSPACE/$EVIDENCE_DIR/production-standard-browser.log"
          cd ..; stop_tail; TAIL_PID=''; node ops/second-promotion-runner.mjs final
      - name: Manifest
        if: always()
        run: |
          find "$EVIDENCE_DIR" -type f ! -name manifest.sha256 ! -name digest.txt -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/manifest.sha256"
          sha256sum "$EVIDENCE_DIR/manifest.sha256" > "$EVIDENCE_DIR/digest.txt"
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voy-city-platform-second-production-promotion-${{ github.run_id }}
          path: evidence/city-platform-second-promotion
          if-no-files-found: error
          retention-days: 30

name: Apply Fare UI Single Source

on:
  push:
    branches:
      - fix/voy-fare-ui-single-source-v1
    paths:
      - scripts/apply-fare-ui-single-source.mjs
      - .github/workflows/apply-fare-ui-single-source.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/voy-fare-ui-single-source-v1
          fetch-depth: 0
      - name: Apply exact migration
        run: node scripts/apply-fare-ui-single-source.mjs
      - name: Validate patch
        run: |
          git diff --check
          git diff --exit-code -- public/VOY-Lite.html && exit 1 || true
          grep -F "computeRegulatedFare('remis',distKm,hourOverride)" public/VOY-Lite.html
          ! grep -F 'taxiFare*1.05' public/VOY-Lite.html
          ! grep -F 'Math.ceil(distKm*1000/distFicha)' public/VOY-Lite.html
      - name: Commit generated source change
        run: |
          git config user.name "voy-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/VOY-Lite.html
          git commit -m "fix(fares): use canonical taxi and remis pricing in UI"
          git push origin HEAD:fix/voy-fare-ui-single-source-v1

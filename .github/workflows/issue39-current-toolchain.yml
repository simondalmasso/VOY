name: VOY Issue39 Current Toolchain Targets

on:
  push:
    branches:
      - audit/issue39-global-adversarial-20260812
    paths:
      - .issue39-toolchain-ready

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Inspect coordinator implementation and registry versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .issue39-toolchain-ready)" = 'ISSUE39_TOOLCHAIN_INSPECT_V1'
          echo '--- COORDINATOR IMPLEMENTATION ---'
          sed -n '380,520p' worker.js
          echo '--- REGISTRY VERSIONS ---'
          printf 'wrangler='; npm view wrangler version
          printf 'cloudflare_vite='; npm view @cloudflare/vite-plugin version
          printf 'miniflare='; npm view miniflare version
          printf 'sharp='; npm view sharp version
          printf 'undici='; npm view undici version

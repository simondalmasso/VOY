name: ORDER-076 publish v0.1.0

on:
  push:
    branches:
      - audit/order076-terminal-evidence
    paths:
      - .github/workflows/order076-terminal-finalize.yml

permissions:
  contents: write

concurrency:
  group: voy-order076-release-publish
  cancel-in-progress: false

env:
  RELEASE_SHA: fa7fe143bf2cb5017af5d835cd9681918e26087d
  EXPECTED_BUILD_ID: a23663370eb24d18a322d7f9
  EXPECTED_RELEASE_ID: order057-fa7fe143bf2c-a2366337
  WORKER_URL: https://voy-app.simondalmasso44.workers.dev

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Verify final canonical source and production identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$RELEASE_SHA"
          curl -fsS "$WORKER_URL/api/health" > health.json
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('health.json','utf8'));
          if(h.ok!==true)throw new Error('health_not_ok');
          if(h.source_commit!==process.env.RELEASE_SHA)throw new Error('source_mismatch:'+JSON.stringify(h));
          if(h.build_hash!==process.env.EXPECTED_BUILD_ID)throw new Error('build_mismatch:'+JSON.stringify(h));
          if(h.version!==process.env.EXPECTED_RELEASE_ID)throw new Error('release_mismatch:'+JSON.stringify(h));
          console.log(JSON.stringify(h,null,2));
          NODE
      - name: Recreate v0.1.0 on final main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release delete v0.1.0 --cleanup-tag --yes
          else
            git push origin :refs/tags/v0.1.0 >/dev/null 2>&1 || true
          fi
          gh release create v0.1.0             --target "$RELEASE_SHA"             --title "VOY v0.1.0"             --notes-file docs/release/RELEASE_v0.1.0.md
      - name: Verify final release tag and demo
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(git ls-remote origin refs/tags/v0.1.0 | awk '{print $1}')"
          test "$tag_sha" = "$RELEASE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.0" > release.json
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('release.json','utf8'));
          if(r.tag_name!=='v0.1.0'||r.draft||r.prerelease)throw new Error('release_state_invalid:'+JSON.stringify(r));
          console.log(JSON.stringify({tag:r.tag_name,draft:r.draft,prerelease:r.prerelease,published_at:r.published_at,html_url:r.html_url,target_commitish:r.target_commitish},null,2));
          NODE
          curl -fsS "$WORKER_URL/api/health" > health-after.json
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('health-after.json','utf8'));
          if(h.source_commit!==process.env.RELEASE_SHA||h.build_hash!==process.env.EXPECTED_BUILD_ID||h.version!==process.env.EXPECTED_RELEASE_ID)throw new Error('demo_release_mismatch:'+JSON.stringify(h));
          console.log('DEMO_RELEASE_MATCH=PASS');
          NODE

name: Apply authorized VOY master completion

on:
  push:
    branches:
      - feat/voy-complete-product-master-01
    paths:
      - .github/workflows/svelte-current-source-bundle.yml

permissions:
  contents: write

concurrency:
  group: voy-master-completion-writer
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact authorized head
        uses: actions/checkout@v4
        with:
          ref: feat/voy-complete-product-master-01
          fetch-depth: 0
      - name: Verify and apply exact staged patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin refs/heads/feat/voy-complete-product-master-01 | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          echo 'eef7fac0611b583e992759a1b6ae8b1f28e6add00613cd08c9bd15c8bd1acea0  .github/voy-master-apply.patch.part00' | sha256sum -c -
          echo '60876d23553544f1b478aa560d1b87babafde638f716a051262fd4c8bf7b01cc  .github/voy-master-apply.patch.part01' | sha256sum -c -
          echo '0ff99adf2e66e0683abbfd6fbf96a93b70f6676e923417c1fbdf2701d4818fe2  .github/voy-master-apply.patch.part02' | sha256sum -c -
          echo '9545f135c754ea6131624639c5b1033bd5c93a5dd5d477083f7ccf05ac8da96e  .github/voy-master-apply.patch.part03' | sha256sum -c -
          cat .github/voy-master-apply.patch.part00 .github/voy-master-apply.patch.part01 .github/voy-master-apply.patch.part02 .github/voy-master-apply.patch.part03 > /tmp/voy-master-apply.patch.gz
          echo 'd1d9949bded93e1a844ca46ad2e3fd3de9aba97b351b6b3ef083e83f2a4b9891  /tmp/voy-master-apply.patch.gz' | sha256sum -c -
          gzip -t /tmp/voy-master-apply.patch.gz
          gzip -dc /tmp/voy-master-apply.patch.gz > /tmp/voy-master-apply.patch
          echo '308b759d738466eda64a2fea80383046db2a12444181984147f3f9a80425dbf0  /tmp/voy-master-apply.patch' | sha256sum -c -
          git apply --check --exclude='.github/workflows/*' /tmp/voy-master-apply.patch
          git apply --exclude='.github/workflows/*' /tmp/voy-master-apply.patch
          python3 - <<'PY'
          from pathlib import Path

          typed_fetch = Path('tests/providerRegistry.test.ts')
          original = typed_fetch.read_text()
          before = "globalThis.fetch = (async input =>"
          after = "globalThis.fetch = (async (input: RequestInfo | URL) =>"
          if original.count(before) != 1:
              raise SystemExit('expected exactly one untyped fetch parameter')
          typed_fetch.write_text(original.replace(before, after))

          selection = Path('__tests__/voiceCopilotSelection.test.js')
          original = selection.read_text()
          before = "assert.equal(matches[0].name, 'Terminal');"
          after = "assert.equal(matches[0].name, 'Terminal de Ómnibus');"
          if original.count(before) != 1:
              raise SystemExit('expected exactly one historical terminal assertion')
          selection.write_text(original.replace(before, after))

          origin = Path('src/components/OriginControl.svelte')
          original = origin.read_text()
          before = '<button type="button" on:click={useManual} disabled={resolving} data-testid="origin-apply">Aplicar</button>'
          after = '<button type="button" on:click={useManual} aria-busy={resolving} data-testid="origin-apply">Aplicar</button>'
          if original.count(before) != 1:
              raise SystemExit('expected exactly one disabled origin apply button')
          origin.write_text(original.replace(before, after))
          PY
          rm -f .github/voy-master-apply.patch.gz .github/voy-master-apply.patch.part*
          git diff --check
      - name: Install pinned frozen toolchain
        run: |
          set -euo pipefail
          npm install --global bun@1.3.14 wrangler@4.112.0
          test "$(bun --version)" = '1.3.14'
          test "$(wrangler --version | awk '{print $1}')" = '4.112.0'
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock
      - name: Validate complete Svelte product
        env:
          BUILD_HASH: ${{ github.sha }}
          VOY_METRICS_PATH: test-results/build-metrics.json
          VOY_EVIDENCE_DIR: test-results/master-apply-screens
          VOY_OUTPUT_DIR: test-results/master-apply-browser
          VOY_REPORT_DIR: playwright-report-master-apply
          VOY_LOCAL_SERVER_LOG: test-results/master-apply-vite.log
        run: |
          set -euo pipefail
          node scripts/verify-release-policy.mjs
          node --check public/sw.js
          node --check scripts/svelte-candidate-gate.mjs
          node --check scripts/svelte-candidate-api-gate.mjs
          bash -n scripts/run-browser-smoke.sh scripts/run-master-final-candidate.sh
          bun run validate
          wrangler deploy --config dist/voy_app/wrangler.json --dry-run --minify
          bunx playwright install --with-deps chromium
          WRANGLER_LOG=none bash scripts/run-browser-smoke.sh
      - name: Commit validated completion without force push
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/feat/voy-complete-product-master-01 | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'VOY EJE'
          git config user.email 'actions@users.noreply.github.com'
          rm -rf dist test-results playwright-report playwright-report-* browser-tests/test-results browser-tests/playwright-report browser-tests/playwright-report-* .wrangler
          git add -A
          git diff --cached --check
          git diff --cached --name-only | grep -v '^\.github/workflows/' >/dev/null
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"
          git commit -m 'fix: complete truthful Svelte mobility runtime'
          git push origin HEAD:feat/voy-complete-product-master-01

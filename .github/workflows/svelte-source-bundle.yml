name: VOY Svelte Migration Source Bundle

on:
  push:
    branches:
      - feat/voy-complete-product-master-01

permissions:
  contents: read

concurrency:
  group: voy-svelte-source-bundle
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact canonical head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact head and create immutable source archive
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          REMOTE_HEAD="$(git ls-remote origin refs/heads/feat/voy-complete-product-master-01 | awk '{print $1}')"
          test "$REMOTE_HEAD" = "$GITHUB_SHA"
          git diff --check
          git archive --format=zip --output="voy-source-${GITHUB_SHA}.zip" HEAD
          sha256sum "voy-source-${GITHUB_SHA}.zip" > "voy-source-${GITHUB_SHA}.zip.sha256"

      - name: Upload exact source bundle
        uses: actions/upload-artifact@v4
        with:
          name: voy-svelte-source-${{ github.run_id }}
          path: |
            voy-source-${{ github.sha }}.zip
            voy-source-${{ github.sha }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

name: VOY Master Source Bundle

on:
  push:
    branches:
      - feat/voy-complete-product-master-01
    paths:
      - .github/workflows/master-source-bundle.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voy-master-source-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build exact Git archive
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git archive --format=zip --output=voy-source.zip "$GITHUB_SHA"
          sha256sum voy-source.zip > voy-source.zip.sha256

      - name: Upload exact source bundle
        uses: actions/upload-artifact@v4
        with:
          name: voy-master-source-${{ github.run_id }}
          path: |
            voy-source.zip
            voy-source.zip.sha256
          if-no-files-found: error
          retention-days: 3

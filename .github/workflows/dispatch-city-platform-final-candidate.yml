# issue34-cancel-duplicate-run-31178414938
name: Dispatch City Platform Exact Final Candidate

on:
  push:
    branches:
      - feat/voy-city-platform-v1
    paths:
      - .github/workflows/dispatch-city-platform-final-candidate.yml
      - candidate-tests/cloudflare-candidate.spec.js
      - candidate-tests/playwright.config.js
      - scripts/candidate-runtime-gate.mjs
      - __tests__/candidateRuntimeGate.test.js

permissions:
  actions: write
  contents: read

concurrency:
  group: voy-dispatch-exact-final-candidate
  cancel-in-progress: false

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[issue34-cancel-duplicate]')
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel duplicate queued Issue 34 candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DUPLICATE_RUN_ID: '31178414938'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$DUPLICATE_RUN_ID/cancel"

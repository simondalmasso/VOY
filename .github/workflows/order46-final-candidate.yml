name: VOY ORDER-046 Final Candidate 0

on:
  push:
    branches:
      - feat/order-046-serious-product
    paths:
      - .order46-candidate-ready

permissions:
  contents: read

concurrency:
  group: voy-order46-final-candidate
  cancel-in-progress: false

env:
  WORKER_NAME: voy-app
  WORKER_URL: https://voy-app.simondalmasso44.workers.dev
  EXPECTED_STABLE_VERSION: V8.0.0
  EXPECTED_STABLE_HASH: 796c935
  EXPECTED_STABLE_VERSION_ID: 002c464c-15fa-42f3-a762-0214a1dc5cf3
  EXPECTED_CANDIDATE_VERSION: V8.0.0
  D1_NAME: voy-auth
  CONVERGENCE_INTERVAL_MS: '7000'
  EVIDENCE_DIR: test-results/order46-final-candidate

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact ORDER-046 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gate exact head and candidate-only authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin refs/heads/feat/order-046-serious-product | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          test "$(cat .order46-candidate-ready)" = 'ORDER46_FINAL_CANDIDATE_READY_V2'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          git diff --check
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_DIR/exact-head.txt"
          printf '%s\n' 'ORDER=46' > "$EVIDENCE_DIR/authority-workflow.txt"
          printf '%s\n' 'CANDIDATE_0_PERCENT_ONLY=YES' >> "$EVIDENCE_DIR/authority-workflow.txt"
          printf '%s\n' 'PRODUCTION_PROMOTION_AUTHORIZED=NO' >> "$EVIDENCE_DIR/authority-workflow.txt"
          printf '%s\n' 'MERGE_AUTHORIZED=NO' >> "$EVIDENCE_DIR/authority-workflow.txt"

      - name: Install pinned frozen candidate toolchain
        run: |
          set -euo pipefail
          npm install --global bun@1.3.14 wrangler@4.112.0
          test "$(bun --version)" = '1.3.14'
          test "$(wrangler --version | awk '{print $1}')" = '4.112.0'
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock
          bunx playwright install --with-deps chromium

      - name: Release policy before any Cloudflare or D1 write
        run: node scripts/verify-release-policy.mjs

      - name: Validate exact head and create verified zero-traffic candidate
        run: bash scripts/run-order46-candidate.sh

      - name: Verify terminal candidate contract
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'); const e=process.env.EVIDENCE_DIR;
          const final=JSON.parse(fs.readFileSync(`${e}/final-state.json`,'utf8'));
          const api=JSON.parse(fs.readFileSync(`${e}/api-gate.json`,'utf8'));
          const bindings=JSON.parse(fs.readFileSync(`${e}/binding-contract.json`,'utf8'));
          if(final.result!=='PASS')throw new Error('candidate_final_state_not_pass');
          if(final.exact_source_sha!==process.env.GITHUB_SHA)throw new Error('candidate_head_mismatch');
          if(final.stable_version_id!==process.env.EXPECTED_STABLE_VERSION_ID||Number(final.stable_traffic)!==100)throw new Error('stable_runtime_changed');
          if(!final.candidate_version_id||Number(final.candidate_traffic)!==0)throw new Error('candidate_not_zero_traffic');
          if(final.production_promoted===true||final.rollback_executed===true)throw new Error('unexpected_production_mutation');
          if(api.result!=='PASS'||api.health?.features?.national_territory!==true||api.auth?.enabled!==false)throw new Error('candidate_api_truth_failed');
          if(bindings.result!=='PASS'||!bindings.allowed_additions?.some(x=>x.name==='DB'))throw new Error('candidate_binding_contract_failed');
          fs.writeFileSync(`${e}/order46-zero-traffic-contract.json`,JSON.stringify({result:'PASS',exact_head:process.env.GITHUB_SHA,stable_version_id:final.stable_version_id,stable_traffic:final.stable_traffic,candidate_version_id:final.candidate_version_id,candidate_traffic:final.candidate_traffic,deployment_id:final.deployment_id,national_territory:true,google_auth_enabled:false,d1_binding:true,production_promoted:false,rollback_executed:false},null,2));
          NODE

      - name: Rebuild immutable evidence manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          find "$EVIDENCE_DIR" -type f ! -name manifest.sha256 ! -name digest.txt -print0 | sort -z | xargs -0 -r sha256sum > "$EVIDENCE_DIR/manifest.sha256"
          sha256sum "$EVIDENCE_DIR/manifest.sha256" > "$EVIDENCE_DIR/digest.txt"

      - name: Upload ORDER-046 candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voy-order46-final-candidate-${{ github.run_id }}
          path: test-results/order46-final-candidate
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 6

      - name: Candidate summary
        if: always()
        run: |
          {
            echo '## VOY ORDER-046 — exact-head candidate 0%'
            echo
            echo "- Exact source SHA: $GITHUB_SHA"
            echo "- Stable expected: $EXPECTED_STABLE_VERSION_ID at 100%"
            echo '- Candidate target: 0% traffic only'
            echo '- Google auth candidate flag: OFF'
            echo '- D1 schema: migration/verification required by runner'
            echo '- Production promotion: not authorized'
            echo '- Merge: not authorized'
            if [ -f "$EVIDENCE_DIR/order46-zero-traffic-contract.json" ]; then
              echo '```json'
              cat "$EVIDENCE_DIR/order46-zero-traffic-contract.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

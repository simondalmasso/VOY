name: Validate VOY Svelte exact head

on:
  push:
    branches:
      - feat/voy-complete-product-master-01

permissions:
  contents: read

concurrency:
  group: voy-svelte-exact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_HASH: ${{ github.sha }}
      VOY_METRICS_PATH: test-results/build-metrics.json
      VOY_EVIDENCE_DIR: test-results/svelte-screens
      VOY_OUTPUT_DIR: test-results/svelte-browser
      VOY_REPORT_DIR: playwright-report-svelte
      VOY_LOCAL_SERVER_LOG: test-results/svelte-vite.log
    steps:
      - name: Checkout exact remote head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact branch identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin refs/heads/feat/voy-complete-product-master-01 | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git diff --check
      - name: Install pinned frozen toolchain
        run: |
          set -euo pipefail
          npm install --global bun@1.3.14 wrangler@4.112.0
          test "$(bun --version)" = '1.3.14'
          test "$(wrangler --version | awk '{print $1}')" = '4.112.0'
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock
      - name: Release and syntax policy
        run: |
          set -euo pipefail
          node scripts/verify-release-policy.mjs
          node --check public/sw.js
          node --check scripts/svelte-candidate-gate.mjs
          node --check scripts/svelte-candidate-api-gate.mjs
          bash -n scripts/run-browser-smoke.sh scripts/run-master-final-candidate.sh
      - name: Typecheck lint tests build and budgets
        run: bun run validate
      - name: Wrangler exact build dry-run
        run: wrangler deploy --config dist/voy_app/wrangler.json --dry-run --minify
      - name: Install Chromium 1.61.1
        run: bunx playwright install --with-deps chromium
      - name: Clean-profile mobile and desktop browser gates
        env:
          WRANGLER_LOG: none
        run: bash scripts/run-browser-smoke.sh
      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voy-svelte-exact-${{ github.run_id }}
          path: |
            test-results
            playwright-report-svelte
            dist/client/index.html
            dist/client/.vite/manifest.json
            dist/voy_app/wrangler.json
          if-no-files-found: error
          retention-days: 30

name: VOY UI Compaction QA

on:
  push:
    branches:
      - feat/ui-compaction-apple-smooth-01
    paths:
      - src/main.ts
      - src/styles/ui-compaction.css
      - scripts/ui-compaction-compare.mjs
      - .github/workflows/ui-compaction-qa.yml

permissions:
  contents: read

concurrency:
  group: voy-ui-compaction-qa
  cancel-in-progress: true

env:
  VOY_BEFORE_SHA: 27c5f0395241d5eff9fac0202f1e7ded9cc24d31
  VOY_UI_EVIDENCE_DIR: test-results/ui-compaction

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout exact UI head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify scope and source
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'feat/ui-compaction-apple-smooth-01'
          test "$(git merge-base --is-ancestor "$VOY_BEFORE_SHA" "$GITHUB_SHA"; echo $?)" = '0'
          git diff --check "$VOY_BEFORE_SHA..$GITHUB_SHA"
          node --check scripts/ui-compaction-compare.mjs

      - name: Install pinned frozen toolchain
        run: |
          set -euo pipefail
          npm install --global bun@1.3.14 wrangler@4.112.0
          test "$(bun --version)" = '1.3.14'
          test "$(wrangler --version | awk '{print $1}')" = '4.112.0'
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock
          bunx playwright install --with-deps chromium

      - name: Full exact-head source regression
        run: |
          set -euo pipefail
          BUILD_HASH="$GITHUB_SHA" bun run validate
          wrangler deploy --config dist/voy_app/wrangler.json --dry-run --minify

      - name: Record local-runtime harness limitation
        run: |
          set -euo pipefail
          mkdir -p "$VOY_UI_EVIDENCE_DIR"
          cat > "$VOY_UI_EVIDENCE_DIR/harness-note.txt" <<'EOF'
          The repository-pinned wrangler@4.112.0 local workerd currently supports compatibility dates through 2026-07-21, while VOY requires 2026-07-27. Run 31222257698 proved source/typecheck/lint/unit/build/dry-run PASS but the generic local browser harness could not start. This visual-only block therefore validates the exact production build output with credential-free static servers and pinned Playwright, without changing Wrangler, compatibility date, runtime, Cloudflare, or application logic.
          EOF

      - name: Build immutable BEFORE parent
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/voy-ui-before "$VOY_BEFORE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/voy-ui-before/node_modules
          cd /tmp/voy-ui-before
          BUILD_HASH="$VOY_BEFORE_SHA" bun run build

      - name: Start BEFORE and AFTER real static builds
        run: |
          set -euo pipefail
          (cd /tmp/voy-ui-before && VOY_STATIC_PORT=8786 node scripts/serve-static-spa.mjs > /tmp/voy-before.log 2>&1 & echo $! > /tmp/voy-before.pid)
          (cd "$GITHUB_WORKSPACE" && VOY_STATIC_PORT=8787 node scripts/serve-static-spa.mjs > /tmp/voy-after.log 2>&1 & echo $! > /tmp/voy-after.pid)
          for port in 8786 8787; do
            ready=0
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$port/" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            test "$ready" = 1
          done

      - name: Compare real BEFORE and AFTER geometry/screenshots
        env:
          VOY_BEFORE_URL: http://127.0.0.1:8786
          VOY_AFTER_URL: http://127.0.0.1:8787
        run: node scripts/ui-compaction-compare.mjs

      - name: Freeze exact-head evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$VOY_UI_EVIDENCE_DIR"
          printf '%s\n' "$VOY_BEFORE_SHA" > "$VOY_UI_EVIDENCE_DIR/before-sha.txt"
          printf '%s\n' "$GITHUB_SHA" > "$VOY_UI_EVIDENCE_DIR/after-sha.txt"
          cp /tmp/voy-before.log "$VOY_UI_EVIDENCE_DIR/before-server.log" 2>/dev/null || true
          cp /tmp/voy-after.log "$VOY_UI_EVIDENCE_DIR/after-server.log" 2>/dev/null || true
          find "$VOY_UI_EVIDENCE_DIR" -type f ! -name manifest.sha256 ! -name digest.txt -print0 | sort -z | xargs -0 -r sha256sum > "$VOY_UI_EVIDENCE_DIR/manifest.sha256"
          sha256sum "$VOY_UI_EVIDENCE_DIR/manifest.sha256" > "$VOY_UI_EVIDENCE_DIR/digest.txt"

      - name: Upload immutable UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voy-ui-compaction-${{ github.run_id }}
          path: test-results/ui-compaction
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Stop static servers
        if: always()
        run: |
          test ! -f /tmp/voy-before.pid || kill "$(cat /tmp/voy-before.pid)" 2>/dev/null || true
          test ! -f /tmp/voy-after.pid || kill "$(cat /tmp/voy-after.pid)" 2>/dev/null || true

# Main validation only. Production traffic and deployment require a separately authorized exact-head candidate flow.
name: Validate VOY main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-voy-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_HASH: ${{ github.sha }}
      VOY_METRICS_PATH: test-results/build-metrics.json
      VOY_EVIDENCE_DIR: test-results/main-screens
      VOY_OUTPUT_DIR: test-results/main-browser
      VOY_REPORT_DIR: playwright-report-main
      VOY_LOCAL_SERVER_LOG: test-results/main-vite.log
    steps:
      - name: Checkout exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Enforce source and release policy
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-release-policy.mjs
          git diff --check
          node --check public/sw.js
      - name: Install pinned frozen toolchain
        run: |
          set -euo pipefail
          npm install --global bun@1.3.14 wrangler@4.122.0
          test "$(bun --version)" = '1.3.14'
          test "$(wrangler --version | awk '{print $1}')" = '4.122.0'
          bun install --frozen-lockfile
          bun audit
          git diff --exit-code -- bun.lock
      - name: Typecheck lint tests build and budgets
        run: bun run validate
      - name: Wrangler exact build dry-run
        run: wrangler deploy --config dist/voy_app/wrangler.json --dry-run --minify
      - name: Install Chromium 1.61.1
        run: bunx playwright install --with-deps chromium
      - name: Clean-profile local browser gates
        env:
          WRANGLER_LOG: none
        run: bash scripts/run-browser-smoke.sh
      - name: Observe production V8 health read-only
        run: |
          set -euo pipefail
          curl -fsS https://voy-app.simondalmasso44.workers.dev/api/health > production-health.json
          node -e '
            const fs = require("node:fs");
            const health = JSON.parse(fs.readFileSync("production-health.json", "utf8"));
            if (health.ok !== true || health.version !== "V8.0.0") throw new Error(`Unexpected production health: ${JSON.stringify(health)}`);
            console.log(`PUBLIC_PRODUCTION_OK=true VERSION=${health.version} BUILD=${health.build_hash || "unverified"}`);
          '
      - name: Production browser smoke read-only
        env:
          VOY_BASE_URL: https://voy-app.simondalmasso44.workers.dev
          VOY_EXTERNAL_SERVER: '1'
          VOY_EVIDENCE_DIR: test-results/production-screens
          VOY_OUTPUT_DIR: test-results/production-browser
          VOY_REPORT_DIR: playwright-report-production
        run: bun run test:browser
      - name: Upload main evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-validation-${{ github.run_id }}
          path: |
            production-health.json
            test-results
            playwright-report-main
            playwright-report-production
            dist/client/index.html
            dist/client/.vite/manifest.json
            dist/voy_app/wrangler.json
          if-no-files-found: error
          retention-days: 30

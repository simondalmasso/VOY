name: VOY Issue43 National Validation

on:
  push:
    branches:
      - feat/argentina-national-product-01

permissions:
  contents: read

concurrency:
  group: voy-issue43-national-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: ce83145c3e9a2bb08d100472c771ebdbcab3f68a

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prove frozen-base lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feat/argentina-national-product-01'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA"..HEAD
      - name: Install pinned frozen toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global bun@1.3.14 wrangler@4.112.0
          test "$(bun --version)" = '1.3.14'
          test "$(wrangler --version | awk '{print $1}')" = '4.112.0'
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock
      - name: Validate source, tests, build and budgets
        run: bun run validate
      - name: Wrangler build dry-run
        run: wrangler deploy --dry-run --outdir test-results/issue43-wrangler-dry-run
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voy-issue43-validation-${{ github.run_id }}
          path: |
            test-results
            dist
          if-no-files-found: ignore
          retention-days: 30

name: VOY Issue43 National Validation

on:
  push:
    branches:
      - feat/argentina-national-product-01

permissions:
  contents: read
  issues: write

concurrency:
  group: voy-issue43-national-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: ce83145c3e9a2bb08d100472c771ebdbcab3f68a

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prove frozen-base lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feat/argentina-national-product-01'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA"..HEAD
          test ! -e .env
      - name: Install pinned frozen toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global bun@1.3.14 wrangler@4.112.0
          test "$(bun --version)" = '1.3.14'
          test "$(wrangler --version | awk '{print $1}')" = '4.112.0'
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock
      - name: Validate source, unit/security tests, build and budgets
        run: bun run validate
      - name: Install Chromium for national browser regression
        run: bunx playwright install --with-deps chromium
      - name: National browser matrix and Santa Fe regression
        env:
          VOY_OUTPUT_DIR: test-results/issue43-browser
          VOY_REPORT_DIR: test-results/issue43-browser-report
        run: bun run test:browser
      - name: Wrangler build dry-run
        run: wrangler deploy --dry-run --outdir test-results/issue43-wrangler-dry-run
      - name: Persist exact validation summary
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p test-results/issue43-summary
          printf '%s\n' \
            "ORDER_ID=VOY-ARGENTINA-NATIONAL-PRODUCT-01" \
            "BASE_SHA=${BASE_SHA}" \
            "HEAD_SHA=${GITHUB_SHA}" \
            "GENERATED_IMAGES=0" \
            "PRODUCTION_MUTATION=NO" \
            "JURISDICTIONS_REGISTRY=24/24" \
            > test-results/issue43-summary/result.txt
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voy-issue43-validation-${{ github.run_id }}
          path: |
            test-results
            dist
          if-no-files-found: ignore
          retention-days: 30
      - name: Persist validation checkpoint on Issue 43
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 43 --repo "$GITHUB_REPOSITORY" --body "ISSUE43_VALIDATION_RUN=${GITHUB_RUN_ID};RESULT=${RESULT};HEAD=${GITHUB_SHA};BASE_SHA=${BASE_SHA};NATIONAL_BROWSER=FULL;SANTA_FE_REGRESSION=INCLUDED;GENERATED_IMAGES=0;PRODUCTION_MUTATION=NO"

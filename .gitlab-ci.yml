image: node:24-bookworm

stages:
  - verify

variables:
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  NPM_CONFIG_FUND: "false"

r2_verify:
  stage: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "r2/recovery-order057-r2"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends wget apt-transport-https gnupg ca-certificates >/dev/null
    - wget -q https://packages.microsoft.com/config/debian/12/packages-microsoft-prod.deb -O /tmp/packages-microsoft-prod.deb
    - dpkg -i /tmp/packages-microsoft-prod.deb >/dev/null
    - apt-get update -qq
    - apt-get install -y --no-install-recommends powershell >/dev/null
    - ln -sf /usr/bin/pwsh /usr/local/bin/powershell
  script:
    - node ci/verify-r2.mjs provenance
    - npm ci --ignore-scripts
    - npm test
    - npm run build
    - node ci/verify-r2.mjs package
    - npx wrangler deploy --dry-run --outdir .wrangler-dry-run
    - |
      set +e
      npm audit --json > npm-audit.json
      audit_rc=$?
      set -e
      test "$audit_rc" -eq 1
    - node ci/verify-r2.mjs audit npm-audit.json
    - npm audit --omit=dev --audit-level=high
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - npm-audit.json
      - dist/BUILD_MANIFEST.json
  interruptible: true
order069_browser:
  stage: verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends wget gnupg ca-certificates powershell >/dev/null
    - ln -sf /usr/bin/pwsh /usr/local/bin/powershell
    - wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/google-chrome.deb
    - apt-get install -y /tmp/google-chrome.deb >/dev/null
    - wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /usr/share/keyrings/microsoft-edge.gpg
    - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge.gpg] https://packages.microsoft.com/repos/edge stable main" > /etc/apt/sources.list.d/microsoft-edge.list
    - apt-get update -qq
    - apt-get install -y --no-install-recommends microsoft-edge-stable >/dev/null
  script:
    - npm ci --ignore-scripts
    - npm run build
    - node order069/evidence/browser-audit.mjs
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - order069/evidence/browser/
      - order069/evidence/browser-report.json
  interruptible: true
